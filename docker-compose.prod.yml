# =============================================================================
# GIS Data Agent — Production Docker Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# =============================================================================

services:
  db:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  app:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  ingestion-worker:
    restart: always
    environment:
      # DolphinScheduler is the production DataOps schedule authority. This
      # worker only executes durable runs submitted through the platform API.
      GDA_INGEST_SCHEDULE_DRIVER: external
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"

  ontology-rdf:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 3G
        reservations:
          cpus: "0.25"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # Database Backup (daily cron)
  # ---------------------------------------------------------------------------
  db-backup:
    image: "${POSTGIS_IMAGE:-gis-postgis-pgvector:16-3.4}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD must be set}
      PGDATABASE: gis_agent
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - db-backups:/backups
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        echo "[Backup] Starting daily backup cron..."
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          FILENAME="/backups/gis_agent_$${TIMESTAMP}.dump"
          PARTIAL="$${FILENAME}.partial"
          echo "[Backup] Creating $$FILENAME ..."
          if pg_dump --format=custom --no-owner --no-acl --file "$$PARTIAL"; then
            mv "$$PARTIAL" "$$FILENAME"
            echo "[Backup] Done: $$FILENAME ($$(du -h $$FILENAME | cut -f1))"
          else
            echo "[Backup] FAILED"
            rm -f "$$PARTIAL"
            exit 1
          fi
          # Cleanup old backups
          find /backups -name "gis_agent_*.dump" -mtime +$${BACKUP_RETENTION_DAYS} -delete 2>/dev/null
          echo "[Backup] Next run in 24h"
          sleep 86400
        done
    networks:
      - agent-net

volumes:
  db-backups:
