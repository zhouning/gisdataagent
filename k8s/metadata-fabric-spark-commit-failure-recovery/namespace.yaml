apiVersion: v1
kind: Namespace
metadata:
  name: gda-metadata-spark-commit-failure
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spark-commit-failure-recovery
  namespace: gda-metadata-spark-commit-failure
spec:
  hard:
    requests.cpu: "7"
    requests.memory: 9Gi
    limits.cpu: "14"
    limits.memory: 16Gi
    pods: "9"
    persistentvolumeclaims: "4"
    requests.storage: 8Gi
    secrets: "5"
    configmaps: "9"
