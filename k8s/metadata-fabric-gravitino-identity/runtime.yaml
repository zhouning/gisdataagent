apiVersion: v1
kind: ServiceAccount
metadata:
  name: gravitino-identity-postgresql
  namespace: gda-metadata-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gravitino-identity
  namespace: gda-metadata-identity
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitino-identity-config
  namespace: gda-metadata-identity
data:
  gravitino.conf: |
    gravitino.server.shutdown.timeout = 30000
    gravitino.server.webserver.host = 0.0.0.0
    gravitino.server.webserver.httpPort = 8090
    gravitino.server.health.entityStore.probeTimeoutMs = 5000
    gravitino.entity.store = relational
    gravitino.entity.store.relational = JDBCBackend
    gravitino.entity.store.relational.jdbcUrl = jdbc:postgresql://gravitino-identity-postgresql:5432/gravitino
    gravitino.entity.store.relational.jdbcDriver = org.postgresql.Driver
    gravitino.entity.store.relational.jdbcUser = gravitino
    gravitino.authenticators = basic
    gravitino.server.rest.extensionPackages = org.apache.gravitino.idp.web.rest.feature
    gravitino.authorization.enable = true
    gravitino.authorization.serviceAdmins = gda-identity-admin
    gravitino.cache.enabled = false
    gravitino.auxService.names =
---
apiVersion: v1
kind: Service
metadata:
  name: gravitino-identity-postgresql
  namespace: gda-metadata-identity
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gravitino-identity-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gravitino-identity-postgresql
  namespace: gda-metadata-identity
spec:
  serviceName: gravitino-identity-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gravitino-identity-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gravitino-identity-postgresql
        app.kubernetes.io/component: database
    spec:
      serviceAccountName: gravitino-identity-postgresql
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:16.10-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: gravitino
            - name: POSTGRES_DB
              value: gravitino
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gravitino-identity-runtime
                  key: database-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "gravitino", "-d", "gravitino"]
            periodSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gravitino", "-d", "gravitino"]
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: 001-schema.sql
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: schema
          configMap:
            name: gravitino-identity-schema
---
apiVersion: v1
kind: Service
metadata:
  name: gravitino-identity
  namespace: gda-metadata-identity
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gravitino-identity
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gravitino-identity
  namespace: gda-metadata-identity
spec:
  serviceName: gravitino-identity
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gravitino-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gravitino-identity
        app.kubernetes.io/component: technical-metadata
    spec:
      serviceAccountName: gravitino-identity
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gravitino
          image: gda/gravitino:1.3.0-local-arm64
          imagePullPolicy: Never
          command: ["/bin/bash", "-ec"]
          args:
            - |
              install -d -m 0700 /var/run/gravitino/conf
              install -m 0600 /etc/gravitino/gravitino.conf /var/run/gravitino/conf/gravitino.conf
              install -m 0444 /opt/gravitino/conf/gravitino-env.sh /var/run/gravitino/conf/gravitino-env.sh
              printf '\ngravitino.entity.store.relational.jdbcPassword = ' >> /var/run/gravitino/conf/gravitino.conf
              cat /var/run/secrets/gravitino/database-password >> /var/run/gravitino/conf/gravitino.conf
              printf '\n' >> /var/run/gravitino/conf/gravitino.conf
              exec /opt/gravitino/bin/gravitino.sh --config /var/run/gravitino/conf run
          env:
            - name: GRAVITINO_MEM
              value: -Xms384m -Xmx1024m -XX:MaxMetaspaceSize=384m
            - name: GRAVITINO_INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gravitino-identity-runtime
                  key: admin-password
          ports:
            - name: http
              containerPort: 8090
          startupProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 12
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/gravitino
              readOnly: true
            - name: secrets
              mountPath: /var/run/secrets/gravitino
              readOnly: true
            - name: runtime
              mountPath: /var/run/gravitino
            - name: logs
              mountPath: /opt/gravitino/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: gravitino-identity-config
        - name: secrets
          secret:
            secretName: gravitino-identity-runtime
            defaultMode: 0400
        - name: runtime
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
