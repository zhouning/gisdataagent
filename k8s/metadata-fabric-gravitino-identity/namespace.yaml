apiVersion: v1
kind: Namespace
metadata:
  name: gda-metadata-identity
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: gravitino-identity-rehearsal
  namespace: gda-metadata-identity
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "4"
    limits.memory: 6Gi
    pods: "4"
    secrets: "4"
    configmaps: "4"
