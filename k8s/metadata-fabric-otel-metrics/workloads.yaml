apiVersion: v1
kind: Service
metadata:
  name: metadata-json-exporter
  namespace: gda-metadata-sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metadata-json-exporter
  ports:
    - name: http
      port: 7979
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-json-exporter
  namespace: gda-metadata-sandbox
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-json-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-json-exporter
        app.kubernetes.io/component: metrics-translation
        gda.openai.com/metadata-sandbox-client: "true"
    spec:
      serviceAccountName: metadata-json-exporter
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: json-exporter
          image: prometheuscommunity/json-exporter@sha256:62370e6e39818966ae1ddfbb69ebf480c697a313cc05ddd76c910b9fbe6934ec
          imagePullPolicy: IfNotPresent
          args: [--config.file=/etc/json-exporter/config.yaml]
          ports:
            - name: http
              containerPort: 7979
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/json-exporter
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: metadata-json-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-otel-collector
  namespace: gda-metadata-sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metadata-otel-collector
  ports:
    - name: prometheus
      port: 8889
      targetPort: prometheus
    - name: health
      port: 13133
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-otel-collector
  namespace: gda-metadata-sandbox
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-otel-collector
        app.kubernetes.io/component: metrics-pipeline
        gda.openai.com/metadata-sandbox-client: "true"
    spec:
      serviceAccountName: metadata-otel-collector
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib@sha256:330e0c7e4f4f60dc94f9657e5fb96ce9cfcf333b9aaa41a5c06b4ce4532de92d
          imagePullPolicy: IfNotPresent
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - name: prometheus
              containerPort: 8889
            - name: health
              containerPort: 13133
          startupProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: metadata-otel-collector-config
