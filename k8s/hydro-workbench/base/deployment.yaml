apiVersion: apps/v1
kind: Deployment
metadata:
  name: hydro-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hydro-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hydro-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: hydro-api
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: abu-dhabi-hydrodynamics:workbench-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HYDRO_RUN_ROOT
              value: /data/runs
            - name: HYDRO_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HYDRO_RUNS_PVC
              value: hydro-runs
            - name: HYDRO_WORKER_IMAGE
              value: abu-dhabi-hydrodynamics:workbench-dev
            - name: HYDRO_GPU_ENABLED
              value: "false"
          volumeMounts:
            - name: hydro-runs
              mountPath: /data/runs
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: hydro-runs
          persistentVolumeClaim:
            claimName: hydro-runs
