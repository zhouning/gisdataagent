apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Docker Desktop's kind nodes materialize locally loaded OCI indexes as a tag
# plus a platform-specific import digest. The generic sandbox overlay keeps
# the portable registry digest; this explicit local overlay maps to the same
# verified content without silently weakening the production manifest.
resources:
  - ../temporal-agentops-discovery-sandbox

patches:
  - path: image-patch.yaml
