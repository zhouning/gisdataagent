# Local kind dev secret values. Strategic merge replaces stringData wholesale.
# Don't ship these secrets — they're laptop-only.
apiVersion: v1
kind: Secret
metadata:
  name: gis-agent-secret
  namespace: gis-agent
type: Opaque
stringData:
  POSTGRES_PASSWORD: local_dev_pg_password
  POSTGRES_ADMIN_PASSWORD: local_dev_admin_password
  CHAINLIT_AUTH_SECRET: local_dev_chainlit_secret_change_me_to_64_chars_minimum_xx
  DATABASE_URL: postgresql://agent_user:local_dev_pg_password@postgres:5432/gis_agent
  REDIS_URL: redis://redis:6379/0
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minio_admin
  AWS_SECRET_ACCESS_KEY: local_dev_minio_secret
  AWS_S3_BUCKET: gis-agent-uploads
  AWS_REGION: us-east-1
  CLOUD_STORAGE_PROVIDER: aws
  # GOOGLE_API_KEY needs SOME value (even a fake one) because app.py:54
  # initializes a google-genai Client at import time, which raises if no key
  # is set. The router classifier itself doesn't actually use this client at
  # runtime when ROUTER_MODEL points at the Ollama-backed registry entry, but
  # the import-time check still fires. Stick a placeholder here.
  GOOGLE_API_KEY: "AIzaSy-LOCAL-PLACEHOLDER-not-used-with-ollama-router"
  GOOGLE_APPLICATION_CREDENTIALS: ""
  GAODE_API_KEY: ""
  TIANDITU_TOKEN: ""
  HUAWEI_OBS_AK: ""
  HUAWEI_OBS_SK: ""
  HUAWEI_OBS_SERVER: ""
  HUAWEI_OBS_BUCKET: ""
  WECOM_CORP_ID: ""
  WECOM_APP_SECRET: ""
  WECOM_TOKEN: ""
  WECOM_ENCODING_AES_KEY: ""
  WECOM_AGENT_ID: ""
  DINGTALK_APP_KEY: ""
  DINGTALK_APP_SECRET: ""
  DINGTALK_ROBOT_CODE: ""
  FEISHU_APP_ID: ""
  FEISHU_APP_SECRET: ""
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
