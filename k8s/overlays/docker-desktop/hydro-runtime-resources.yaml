apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hydro-runs
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: hydro-runs
    app.kubernetes.io/part-of: abu-dhabi-hydro-workbench
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hydro-worker
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: hydro-worker
    app.kubernetes.io/part-of: abu-dhabi-hydro-workbench
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gis-agent-hydro-runner
  namespace: gis-agent
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gis-agent-app-hydro-runner
  namespace: gis-agent
subjects:
  - kind: ServiceAccount
    name: gis-agent-app
    namespace: gis-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gis-agent-hydro-runner
---
# Solver Jobs do not need network access for the pinned development fixtures.
# Keep this policy in production unless an approved ETL adapter explicitly
# requires access to object storage through a dedicated egress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: hydro-worker-default-deny
  namespace: gis-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hydro-run
  policyTypes:
    - Ingress
    - Egress
