# Patch ConfigMap to point at the user's actual host Ollama model tags.
#   - ROUTER_MODEL is a key into model_gateway.MODEL_REGISTRY._builtin_models
#     (NOT a raw Ollama tag). The registry entry maps to model_id =
#     ollama_chat/Gemma4:26b under the hood.
#   - EMBEDDING_MODEL is a key into embedding_gateway._builtin_models.
#     The new entry `nomic-embed-text-v2-moe` maps to ollama_model_id
#     `nomic-embed-text-v2-moe:latest`, which is what `ollama list` reports.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gis-agent-config
  namespace: gis-agent
data:
  ROUTER_MODEL: "gemma4-26b-ollama"
  EMBEDDING_MODEL: "nomic-embed-text-v2-moe"
  # All three pipeline tiers point at the same local Gemma4 — agent.py defaults
  # MODEL_FAST/STANDARD/PREMIUM to gemini-2.0-flash / 2.5-flash / 2.5-pro,
  # which fail with "API_KEY_INVALID" against AI Studio when running offline.
  # ROUTER_MODEL alone isn't enough: every Agent in agent.py is built with
  # one of these tier env vars (see agent.py:215, 252, 274, ...). Pointing
  # all three at the Ollama registry key keeps everything local.
  MODEL_FAST: "gemma4-26b-ollama"
  MODEL_STANDARD: "gemma4-26b-ollama"
  MODEL_PREMIUM: "gemma4-26b-ollama"
  # app.py:2689 hard-gates every user message on `GOOGLE_CLOUD_PROJECT`
  # being set, regardless of whether the actual call path uses Vertex AI.
  # When running fully local against Ollama nothing reads this value, but
  # the gate still fires. Stick a placeholder so the gate passes.
  # Remove if/when the gate is fixed to honour GOOGLE_GENAI_USE_VERTEXAI=FALSE.
  GOOGLE_CLOUD_PROJECT: "local-dev-placeholder"
  # Bypass the ExternalName `ollama` service and hit host.docker.internal
  # directly. Ollama 0.24 enforces strict origin/Host header validation —
  # `Host: ollama:11434` returns HTTP 403 Forbidden, but `Host:
  # host.docker.internal:11434` is on the implicit allowlist and passes.
  # The ExternalName Service still exists in the namespace (harmless) but
  # nothing references it now.
  OLLAMA_API_BASE: "http://host.docker.internal:11434"
