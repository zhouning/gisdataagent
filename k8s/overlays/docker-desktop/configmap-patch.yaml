# Patch ConfigMap to point at the user's actual host Ollama model tags.
#   - ROUTER_MODEL is a key into model_gateway.MODEL_REGISTRY._builtin_models
#     (NOT a raw Ollama tag). The registry entry maps to model_id =
#     ollama_chat/Gemma4:26b under the hood.
#   - EMBEDDING_MODEL is a key into embedding_gateway._builtin_models.
#     The new entry `nomic-embed-text-v2-moe` maps to ollama_model_id
#     `nomic-embed-text-v2-moe:latest`, which is what `ollama list` reports.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gis-agent-config
  namespace: gis-agent
data:
  ROUTER_MODEL: "gemma4-26b-ollama"
  EMBEDDING_MODEL: "nomic-embed-text-v2-moe"
  # All three pipeline tiers point at the same local Gemma4 — agent.py defaults
  # MODEL_FAST/STANDARD/PREMIUM to gemini-2.0-flash / 2.5-flash / 2.5-pro,
  # which fail with "API_KEY_INVALID" against AI Studio when running offline.
  # ROUTER_MODEL alone isn't enough: every Agent in agent.py is built with
  # one of these tier env vars (see agent.py:215, 252, 274, ...). Pointing
  # all three at the Ollama registry key keeps everything local.
  MODEL_FAST: "gemma4-26b-ollama"
  MODEL_STANDARD: "gemma4-26b-ollama"
  MODEL_PREMIUM: "gemma4-26b-ollama"
  # app.py:2689 hard-gates every user message on `GOOGLE_CLOUD_PROJECT`
  # being set, regardless of whether the actual call path uses Vertex AI.
  # When running fully local against Ollama nothing reads this value, but
  # the gate still fires. Stick a placeholder so the gate passes.
  # Remove if/when the gate is fixed to honour GOOGLE_GENAI_USE_VERTEXAI=FALSE.
  GOOGLE_CLOUD_PROJECT: "local-dev-placeholder"
  # Bypass the ExternalName `ollama` service and hit host.docker.internal
  # directly. Ollama 0.24 enforces strict origin/Host header validation —
  # `Host: ollama:11434` returns HTTP 403 Forbidden, but `Host:
  # host.docker.internal:11434` is on the implicit allowlist and passes.
  # The ExternalName Service still exists in the namespace (harmless) but
  # nothing references it now.
  OLLAMA_API_BASE: "http://host.docker.internal:11434"
  # Paper9 / World Model v2.1 demo bundle copied into Docker Desktop kind nodes.
  PAPER9_FARMLAND_MPC_REPO: "/app/paper9-demo"
  PAPER9_FARMLAND_MPC_DEFAULT_PREPARED_DIR: "/app/paper9-demo/runs/restoration/buchanan_va/prepared_watershed"
  PAPER9_FARMLAND_MPC_DEFAULT_ENSEMBLE_DIR: "/app/paper9-demo/paper/checkpoints/restoration/profiles/buchanan_va/watershed/ensemble_seed0"
  # The main GIS API creates hydro Jobs in its own namespace for Docker
  # Desktop smoke runs. Production overlays should point these values at the
  # dedicated execution namespace and an immutable worker image.
  HYDRO_RUN_ROOT: "/data/runs"
  HYDRO_K8S_NAMESPACE: "gis-agent"
  HYDRO_RUNS_PVC: "hydro-runs"
  HYDRO_WORKER_IMAGE: "abu-dhabi-hydrodynamics:workbench-dev"
  HYDRO_GPU_ENABLED: "false"
  # Docker Desktop is the explicit development/test overlay. Production
  # overlays must omit this flag (the backend defaults to false).
  HYDRO_ALLOW_DEVELOPMENT_FIXTURES: "true"
  # Real customer assets registered in the in-cluster MinIO lakehouse. The UI
  # receives these credential-free URIs from the authenticated defaults API.
  HYDRO_DEFAULT_NETWORK_URI: "minio://gis-agent-lakehouse/hydro/abu-dhabi/customer-data/v1/model-ready/network/abu_dhabi_city_full_topology.inp"
  HYDRO_DEFAULT_NETWORK_FORMAT: "SWMM_INP"
  HYDRO_DEFAULT_NETWORK_VERSION: "customer-data-v1"
  HYDRO_DEFAULT_NETWORK_SIZE_BYTES: "39679155"
  HYDRO_DEFAULT_NETWORK_SHA256: "42d47501e6dd14041d7beb55388f996c9913bfd6e13a53c37a97e98dcd57b05e"
  HYDRO_NETWORK_SOURCE_URI: "minio://gis-agent-lakehouse/hydro/abu-dhabi/customer-data/v1/raw/network/DMT_StormWater_AbuDhabi_Processed.gdb.zip"
  HYDRO_NETWORK_SOURCE_FORMAT: "FILE_GDB_ZIP"
  HYDRO_NETWORK_SOURCE_NAME: "DMT_StormWater_AbuDhabi_Processed.gdb.zip"
  HYDRO_DEFAULT_TERRAIN_URI: "minio://gis-agent-lakehouse/hydro/abu-dhabi/customer-data/v1/model-ready/terrain/AUH_DTM_10m_region.tif"
  HYDRO_DEFAULT_TERRAIN_FORMAT: "GeoTIFF"
  HYDRO_DEFAULT_TERRAIN_VERSION: "customer-data-v1"
  HYDRO_DEFAULT_TERRAIN_SIZE_BYTES: "6688625"
  HYDRO_DEFAULT_TERRAIN_SHA256: "e0df80a9351962de6dad8a5742e31be2883fe5b34d07d55811858ea30b232f75"
  HYDRO_DEFAULT_TERRAIN_CRS: "EPSG:32640"
  HYDRO_DEFAULT_TERRAIN_RESOLUTION_M: "10"
  HYDRO_TERRAIN_SOURCE_FORMAT: "GeoTIFF"
  HYDRO_TERRAIN_SOURCE_NAME: "AUH_DTM_5m_Z40.TIF"
  # Boundary source coordinates are non-secret. The reader credentials are
  # deliberately not committed and must be injected in gis-agent-secret.
  HYDRO_AREA_DATABASE_HOST: "10.255.254.109"
  HYDRO_AREA_DATABASE_PORT: "5443"
  HYDRO_AREA_DATABASE_NAME: "liveability_data_20260730"
  HYDRO_ADMINISTRATIVE_TABLE: "public.dim_districts"
  HYDRO_ADMINISTRATIVE_ID_COLUMN: "district_id"
  HYDRO_ADMINISTRATIVE_NAME_COLUMN: "name_en"
  HYDRO_ADMINISTRATIVE_GEOMETRY_COLUMN: "geom"
  HYDRO_DEFAULT_RAINFALL_URI: "minio://gis-agent-lakehouse/hydro/abu-dhabi/public-proxy/v1/rainfall/abu_dhabi_april_2024_openmeteo_hourly.json"
  HYDRO_DEFAULT_RAINFALL_FORMAT: "Open-Meteo JSON hourly time series"
  HYDRO_DEFAULT_RAINFALL_VERSION: "uae-april-2024-event-v1"
  HYDRO_DEFAULT_RAINFALL_SIZE_BYTES: "2376"
  HYDRO_DEFAULT_RAINFALL_SHA256: "c03e452277ef944918a0ef2fa7ca046a78a614ab8f1f5a88bcdb213e8bb3c7ff"
  HYDRO_RAINFALL_SOURCE_FORMAT: "Open-Meteo Historical API archive point product"
  HYDRO_RAINFALL_SOURCE_NAME: "openmeteo_archive_abu_dhabi_20240415_20240417.json"
  HYDRO_RAINFALL_EVENT_ID: "uae-april-2024-extreme-rainfall"
  HYDRO_RAINFALL_TIME_STANDARD: "GMT"
  HYDRO_RAINFALL_START_TIME: "2024-04-15T00:00:00Z"
  HYDRO_RAINFALL_END_TIME: "2024-04-17T23:00:00Z"
  HYDRO_RAINFALL_TOTAL_MM: "67.8"
  HYDRO_RAINFALL_DURATION_MINUTES: "4320"
