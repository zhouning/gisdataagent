apiVersion: batch/v1
kind: Job
metadata:
  name: ontology-projection-2-0-1
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: ontology-projection
    app.kubernetes.io/component: semantic-projection
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontology-projection
        app.kubernetes.io/component: semantic-projection
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      containers:
        - name: project
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              attempt=0
              until curl -fsS http://ontology-fuseki:3030/$/ping >/dev/null; do
                attempt=$((attempt + 1))
                if [ "$attempt" -ge 60 ]; then exit 1; fi
                sleep 2
              done
              result="$(curl -fsS -G \
                --data-urlencode 'query=SELECT (COUNT(*) AS ?triples) WHERE { ?s ?p ?o }' \
                -H 'Accept: application/sparql-results+json' \
                http://ontology-fuseki:3030/ontology/query)"
              echo "$result" | grep -q '528252'
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
