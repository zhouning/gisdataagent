apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: probe-authorized-allow-dns-and-server
  namespace: gda-metadata-network-policy-rehearsal
  labels:
    app.kubernetes.io/part-of: gda-metadata-network-policy-rehearsal
spec:
  podSelector:
    matchLabels:
      access: allowed
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              role: server
      ports:
        - protocol: TCP
          port: 8080
