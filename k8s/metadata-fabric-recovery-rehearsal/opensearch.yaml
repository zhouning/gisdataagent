apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recovery-opensearch
  namespace: gda-metadata-recovery-rehearsal
spec:
  serviceName: recovery-opensearch
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-opensearch
        app.kubernetes.io/component: recovery-search
    spec:
      serviceAccountName: recovery-opensearch
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-config
          image: opensearchproject/opensearch:3.3.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ceu
            - cp -R /usr/share/opensearch/config/. /mnt/config/
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /mnt/config
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms1g -Xmx1g
            - name: path.repo
              value: /var/lib/gda-snapshots
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            periodSeconds: 15
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /
              port: 9200
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: recovery-opensearch-data
              mountPath: /usr/share/opensearch/data
            - name: snapshot-staging
              mountPath: /var/lib/gda-snapshots
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /usr/share/opensearch/logs
            - name: config
              mountPath: /usr/share/opensearch/config
      volumes:
        - name: snapshot-staging
          emptyDir:
            sizeLimit: 8Gi
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
        - name: config
          emptyDir:
            sizeLimit: 128Mi
  volumeClaimTemplates:
    - metadata:
        name: recovery-opensearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
