apiVersion: v1
kind: Namespace
metadata:
  name: gda-metadata-recovery-rehearsal
  labels:
    gda.openai.com/ephemeral-owner: metadata-recovery-rehearsal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: metadata-recovery-rehearsal
  namespace: gda-metadata-recovery-rehearsal
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 5Gi
    limits.cpu: "6"
    limits.memory: 10Gi
    requests.storage: 16Gi
    persistentvolumeclaims: "3"
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: metadata-recovery-defaults
  namespace: gda-metadata-recovery-rehearsal
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "2"
        memory: 4Gi
