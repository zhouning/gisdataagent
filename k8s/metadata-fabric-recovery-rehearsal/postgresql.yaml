apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: recovery-openmetadata-postgresql
  namespace: gda-metadata-recovery-rehearsal
spec:
  serviceName: recovery-openmetadata-postgresql
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-openmetadata-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-openmetadata-postgresql
        app.kubernetes.io/component: recovery-database
    spec:
      serviceAccountName: recovery-openmetadata-postgresql
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:16.10-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: openmetadata_user
            - name: POSTGRES_DB
              value: openmetadata_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: recovery-openmetadata-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "openmetadata_user", "-d", "openmetadata_db"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "openmetadata_user", "-d", "openmetadata_db"]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "openmetadata_user", "-d", "openmetadata_db"]
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: recovery-openmetadata-data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: recovery-openmetadata-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
