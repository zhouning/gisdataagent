apiVersion: v1
kind: Namespace
metadata:
  name: gda-metadata-backup-repository
  labels:
    gda.openai.com/ephemeral-owner: metadata-backup-repository-rehearsal
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: metadata-backup-repository
  namespace: gda-metadata-backup-repository
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.cpu: "2"
    limits.memory: 4Gi
    requests.storage: 8Gi
    persistentvolumeclaims: "1"
    pods: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: metadata-backup-repository-defaults
  namespace: gda-metadata-backup-repository
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "1"
        memory: 2Gi
