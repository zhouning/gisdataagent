apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metadata-backup-minio
  namespace: gda-metadata-backup-repository
spec:
  serviceName: metadata-backup-minio
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
    whenScaled: Delete
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-backup-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-backup-minio
        app.kubernetes.io/component: backup-repository
    spec:
      serviceAccountName: metadata-backup-minio
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--address", ":9000"]
          envFrom:
            - secretRef:
                name: metadata-backup-minio-root
          env:
            - name: MINIO_BROWSER
              value: "off"
            - name: HOME
              value: /home/minio
          ports:
            - name: api
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: repository-data
              mountPath: /data
            - name: config
              mountPath: /home/minio/.minio
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: repository-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-backup-minio
  namespace: gda-metadata-backup-repository
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: api
  selector:
    app.kubernetes.io/name: metadata-backup-minio
