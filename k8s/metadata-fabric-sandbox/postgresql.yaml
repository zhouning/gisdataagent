apiVersion: v1
kind: Service
metadata:
  name: metadata-openmetadata-postgresql
  namespace: gda-metadata-sandbox
  labels:
    app.kubernetes.io/name: metadata-openmetadata-postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metadata-openmetadata-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metadata-openmetadata-postgresql
  namespace: gda-metadata-sandbox
spec:
  serviceName: metadata-openmetadata-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-openmetadata-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-openmetadata-postgresql
        app.kubernetes.io/component: database
        gda.openai.com/provider: openmetadata
    spec:
      serviceAccountName: metadata-openmetadata-postgresql
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:16.10-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: openmetadata_user
            - name: POSTGRES_DB
              value: openmetadata_db
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metadata-openmetadata-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command:
                - pg_isready
                - -U
                - openmetadata_user
                - -d
                - openmetadata_db
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - openmetadata_user
                - -d
                - openmetadata_db
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - openmetadata_user
                - -d
                - openmetadata_db
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: metadata-gravitino-postgresql
  namespace: gda-metadata-sandbox
  labels:
    app.kubernetes.io/name: metadata-gravitino-postgresql
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metadata-gravitino-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metadata-gravitino-postgresql
  namespace: gda-metadata-sandbox
spec:
  serviceName: metadata-gravitino-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-gravitino-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-gravitino-postgresql
        app.kubernetes.io/component: database
        gda.openai.com/provider: gravitino
    spec:
      serviceAccountName: metadata-gravitino-postgresql
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          image: postgres:16.10-bookworm
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: gravitino
            - name: POSTGRES_DB
              value: gravitino
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: metadata-gravitino-postgresql
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "gravitino", "-d", "gravitino"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "gravitino", "-d", "gravitino"]
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "gravitino", "-d", "gravitino"]
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: gravitino-data
              mountPath: /var/lib/postgresql/data
            - name: runtime
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: gravitino-schema
              mountPath: /docker-entrypoint-initdb.d/001-schema.sql
              subPath: 001-schema.sql
              readOnly: true
      volumes:
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: gravitino-schema
          configMap:
            name: metadata-gravitino-schema-1-3-0
  volumeClaimTemplates:
    - metadata:
        name: gravitino-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 8Gi
