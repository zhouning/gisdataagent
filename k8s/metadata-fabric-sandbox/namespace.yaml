apiVersion: v1
kind: Namespace
metadata:
  name: gda-metadata-sandbox
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: metadata-fabric-foundation
  namespace: gda-metadata-sandbox
spec:
  hard:
    requests.cpu: "6"
    requests.memory: 16Gi
    limits.cpu: "15"
    limits.memory: 24Gi
    requests.storage: 40Gi
    persistentvolumeclaims: "4"
    pods: "12"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: metadata-fabric-defaults
  namespace: gda-metadata-sandbox
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        cpu: "2"
        memory: 4Gi
