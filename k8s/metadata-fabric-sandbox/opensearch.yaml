apiVersion: v1
kind: Service
metadata:
  name: metadata-opensearch
  namespace: gda-metadata-sandbox
  labels:
    app.kubernetes.io/name: metadata-opensearch
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metadata-opensearch
  ports:
    - name: http
      port: 9200
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: metadata-opensearch
  namespace: gda-metadata-sandbox
spec:
  serviceName: metadata-opensearch
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metadata-opensearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metadata-opensearch
        app.kubernetes.io/component: search
    spec:
      serviceAccountName: metadata-opensearch
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: opensearch
          image: opensearchproject/opensearch:3.3.2
          imagePullPolicy: IfNotPresent
          env:
            - name: discovery.type
              value: single-node
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: -Xms1g -Xmx1g
          ports:
            - name: http
              containerPort: 9200
          startupProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: http
            periodSeconds: 15
            failureThreshold: 8
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: opensearch-data
              mountPath: /usr/share/opensearch/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: opensearch-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 16Gi
