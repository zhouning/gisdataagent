apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-agent-gis-mvt-cache-purge-worker
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent-gis-mvt-cache-purge-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-gis-mvt-cache-purge-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-gis-mvt-cache-purge-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: gis-agent-gis-mvt-cache-purge-worker
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "[purge-worker] waiting for postgres"
                sleep 2
              done
        - name: wait-for-migrate
          image: bitnami/kubectl:1.30
          command:
            - sh
            - -c
            - |
              echo "[purge-worker] waiting for migration Job"
              until kubectl -n gis-agent wait --for=condition=complete \
                       --timeout=10s job/gis-agent-migrate 2>/dev/null; do
                sleep 5
              done
          securityContext:
            runAsNonRoot: false
      containers:
        - name: worker
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - data_agent.gis_mvt_cache_purge_worker
          envFrom:
            - configMapRef:
                name: gis-agent-config
            - secretRef:
                name: gis-agent-secret
          env:
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
            - name: DB_POOL_SIZE
              value: "2"
            - name: DB_MAX_OVERFLOW
              value: "0"
            - name: ASYNC_POOL_MIN
              value: "0"
            - name: ASYNC_POOL_MAX
              value: "1"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gis-agent-gis-mvt-cache-purge-worker
  namespace: gis-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gis-agent-gis-mvt-cache-purge-worker
  namespace: gis-agent
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gis-agent-gis-mvt-cache-purge-worker
  namespace: gis-agent
subjects:
  - kind: ServiceAccount
    name: gis-agent-gis-mvt-cache-purge-worker
    namespace: gis-agent
roleRef:
  kind: Role
  name: gis-agent-gis-mvt-cache-purge-worker
  apiGroup: rbac.authorization.k8s.io
