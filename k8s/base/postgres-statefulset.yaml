apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        fsGroup: 999  # postgres group inside container; lets PVC ownership work
      containers:
        - name: postgres
          # Note: postgis/postgis:16-3.4 ships PostGIS but NOT pgvector or
          # ltree-as-binary. Both are required by std_platform migrations
          # (070 hard-fails without pgvector, 072+ depends on ltree).
          # The bootstrap script below installs them via CREATE EXTENSION,
          # which works because the postgres apt package provides the
          # contrib modules — but if you change the base image, verify both
          # extensions are available.
          image: postgis/postgis:16-3.4
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: gis-agent-config
                  key: POSTGRES_DATABASE
            - name: POSTGRES_USER
              # Container-level superuser. App connects as 'agent_user'
              # (created by the init script below as a downgraded role).
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gis-agent-secret
                  key: POSTGRES_ADMIN_PASSWORD
            - name: AGENT_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gis-agent-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "8"
              memory: 16Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: init-scripts
          configMap:
            name: postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
# Bootstrap script — runs ONCE on a fresh PGDATA (postgres image convention:
# anything in /docker-entrypoint-initdb.d is executed on first init only,
# never on restart). After that the app's own migration_runner takes over.
#
# We use a .sh wrapper rather than a .sql so AGENT_USER_PASSWORD can be read
# from the env without splicing through psql here-doc quoting.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: gis-agent
data:
  01-init.sh: |
    #!/bin/bash
    set -e
    if [ -z "$AGENT_USER_PASSWORD" ]; then
        echo "[postgres-init] AGENT_USER_PASSWORD not set; aborting" >&2
        exit 1
    fi
    psql -v ON_ERROR_STOP=1 \
         -v agent_pw="$AGENT_USER_PASSWORD" \
         --username "$POSTGRES_USER" \
         --dbname "$POSTGRES_DB" <<-'EOSQL'
        -- Required extensions for the application.
        CREATE EXTENSION IF NOT EXISTS postgis;
        CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
        CREATE EXTENSION IF NOT EXISTS pgcrypto;
        CREATE EXTENSION IF NOT EXISTS ltree;
        CREATE EXTENSION IF NOT EXISTS vector;

        -- Application role; password from psql -v variable.
        DO $$
        BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'agent_user') THEN
                EXECUTE format('CREATE ROLE agent_user WITH LOGIN PASSWORD %L',
                               :'agent_pw');
            ELSE
                EXECUTE format('ALTER ROLE agent_user WITH PASSWORD %L',
                               :'agent_pw');
            END IF;
        END $$;

        GRANT USAGE ON SCHEMA public TO agent_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO agent_user;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO agent_user;
        GRANT ALL ON ALL TABLES IN SCHEMA public TO agent_user;
        GRANT ALL ON ALL SEQUENCES IN SCHEMA public TO agent_user;

        -- GRANT CONNECT against the current DB (which is $POSTGRES_DB).
        DO $$
        BEGIN
            EXECUTE format('GRANT CONNECT ON DATABASE %I TO agent_user',
                           current_database());
        END $$;
    EOSQL
