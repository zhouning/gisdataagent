# Secret template — values are placeholders. Override via overlay
# (k8s/overlays/local-kind/secret-patch.yaml) or kubectl create secret
# --from-env-file before applying.
#
# stringData lets us write plaintext; K8s base64-encodes on apply. Use the
# `data:` block instead if you want explicit base64 control.
apiVersion: v1
kind: Secret
metadata:
  name: gis-agent-secret
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent
type: Opaque
stringData:
  # ----- Required (override in overlay) -----
  POSTGRES_PASSWORD: change_me_strong_password
  POSTGRES_ADMIN_PASSWORD: change_me_admin_password
  CHAINLIT_AUTH_SECRET: replace_with_a_real_secret_min_32_chars

  # Connection strings derived from the values above; kept as separate keys
  # because martin / external tools want the URL form directly. If you
  # rotate POSTGRES_PASSWORD you MUST update DATABASE_URL too — the overlay
  # has a kustomize secretGenerator helper that derives this.
  DATABASE_URL: postgresql://agent_user:change_me_strong_password@postgres:5432/gis_agent
  REDIS_URL: redis://redis:6379/0

  # ----- MinIO (S3-compatible object store, in-cluster) -----
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minio_admin
  AWS_SECRET_ACCESS_KEY: change_me_minio_secret
  AWS_S3_BUCKET: gis-agent-uploads
  AWS_REGION: us-east-1
  CLOUD_STORAGE_PROVIDER: aws  # tells cloud_storage.py to use AWSS3Adapter

  # Optional object projection provider credentials. These are deliberately
  # separate from the general storage adapter credentials above.
  GDA_OBJECT_PROJECTION_ACCESS_KEY_ID: ""
  GDA_OBJECT_PROJECTION_SECRET_ACCESS_KEY: ""
  GDA_OBJECT_PROJECTION_SESSION_TOKEN: ""
  GDA_LAKEHOUSE_PROJECTION_ACCESS_KEY_ID: ""
  GDA_LAKEHOUSE_PROJECTION_SECRET_ACCESS_KEY: ""
  GDA_LAKEHOUSE_PROJECTION_SESSION_TOKEN: ""

  # ----- Google AI (set one) -----
  GOOGLE_API_KEY: ""
  GOOGLE_APPLICATION_CREDENTIALS: ""

  # ----- Optional services -----
  GAODE_API_KEY: ""
  TIANDITU_TOKEN: ""

  # Huawei OBS — leave empty when using MinIO. CLOUD_STORAGE_PROVIDER above
  # selects which adapter wins.
  HUAWEI_OBS_AK: ""
  HUAWEI_OBS_SK: ""
  HUAWEI_OBS_SERVER: ""
  HUAWEI_OBS_BUCKET: ""

  # Bot integrations
  WECOM_CORP_ID: ""
  WECOM_APP_SECRET: ""
  WECOM_TOKEN: ""
  WECOM_ENCODING_AES_KEY: ""
  WECOM_AGENT_ID: ""
  DINGTALK_APP_KEY: ""
  DINGTALK_APP_SECRET: ""
  DINGTALK_ROBOT_CODE: ""
  FEISHU_APP_ID: ""
  FEISHU_APP_SECRET: ""
  # OAuth
  OAUTH_GOOGLE_CLIENT_ID: ""
  OAUTH_GOOGLE_CLIENT_SECRET: ""
---
# Separate secret for MinIO root credentials. Kept distinct so the app's
# Secret can be rotated independently of the storage layer.
apiVersion: v1
kind: Secret
metadata:
  name: minio-root
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minio_admin
  MINIO_ROOT_PASSWORD: change_me_minio_secret
