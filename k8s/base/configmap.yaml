apiVersion: v1
kind: ConfigMap
metadata:
  name: gis-agent-config
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent
data:
  # ----- Postgres connection (non-secret parts) -----
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: "gis_agent"
  POSTGRES_USER: "agent_user"
  POSTGRES_ADMIN_USER: "postgres"

  # ----- Redis -----
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"

  # ----- QC subsystem endpoints (in-cluster DNS) -----
  CV_SERVICE_URL: "http://cv-service:8001"
  CAD_PARSER_URL: "http://cad-parser:8002"
  REFERENCE_DATA_URL: "http://reference-data:8004"
  MARTIN_URL: "http://martin:3000"

  # ----- Local LLM backend (Ollama on host via ExternalName service) -----
  # The 'ollama' DNS name resolves to host.docker.internal on kind/Docker
  # Desktop -- see k8s/base/ollama-service.yaml. App code reads OLLAMA_API_BASE
  # in embedding_gateway.py and via api_base on registered models in
  # model_gateway.py.
  OLLAMA_API_BASE: "http://ollama:11434"
  ROUTER_MODEL: "gemma-4-31b-it-ollama"
  EMBEDDING_MODEL: "nomic-embed-text"
  # Disable Vertex AI / Google GenAI bootstrap when running fully local.
  # Code paths that hit the Google client are guarded; setting this to FALSE
  # short-circuits them.
  GOOGLE_GENAI_USE_VERTEXAI: "FALSE"

  # ----- LLM defaults -----
  GOOGLE_CLOUD_LOCATION: "global"

  # ----- App behavior -----
  DYNAMIC_PLANNER: "true"
  DAILY_ANALYSIS_LIMIT: "20"
  AUDIT_LOG_RETENTION_DAYS: "90"

  # ----- Standards Platform (Wave 6+ outbox worker) -----
  OUTBOX_WORKER_INTERVAL_SEC: "5"
  OUTBOX_MAX_ATTEMPTS: "5"
