# NetworkPolicy — least-privilege ingress for stateful services. Egress is
# left unrestricted because the app needs to reach Vertex AI / Gaode /
# Tianditu / Ollama / etc; lock that down per-cluster if your security
# posture requires it.
#
# kind clusters by default ship with kindnet which doesn't enforce
# NetworkPolicy. Install Calico or Cilium if you actually want the rules
# below to bite. Otherwise the manifests are documentation.

# ----- Postgres: app + workers + martin + migrate Job -----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-access
  namespace: gis-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-outbox-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-dolphinscheduler-command-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-migrate
        - podSelector:
            matchLabels:
              app: martin
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: reference-data
      ports:
        - protocol: TCP
          port: 5432
---
# ----- Redis: app + outbox-worker only -----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-access
  namespace: gis-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-outbox-worker
      ports:
        - protocol: TCP
          port: 6379
---
# ----- MinIO: app + outbox-worker + bucket-init Job -----
# Console (9001) is reachable by anything in-namespace to make debugging
# easy; lock down via overlay if you don't want that.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-access
  namespace: gis-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-app
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-outbox-worker
        - podSelector: {}  # any pod, for bucket-init Job
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
---
# ----- App: ingress controller can reach 8080 -----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: app-access
  namespace: gis-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-app
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
# ----- Martin tile server -----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: martin-access
  namespace: gis-agent
spec:
  podSelector:
    matchLabels:
      app: martin
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
