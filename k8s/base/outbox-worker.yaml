apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-agent-outbox-worker
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent-outbox-worker
    app.kubernetes.io/component: worker
spec:
  # Outbox worker is a single-process consumer (no SKIP LOCKED on
  # std_outbox_event yet); running multiple replicas would cause double
  # processing. If you need throughput later, add SELECT ... FOR UPDATE SKIP
  # LOCKED to standards_platform/outbox.py and bump replicas here.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-outbox-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-outbox-worker
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: gis-agent-outbox-worker
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-migrate
          # Read the migration ledger as the application role; no Kubernetes
          # API token is needed by this worker Pod.
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - data_agent.migration_runner
            - status
          envFrom:
            - configMapRef:
                name: gis-agent-config
            - secretRef:
                name: gis-agent-secret
          env:
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
      containers:
        - name: worker
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - data_agent.standards_platform.outbox_worker
          envFrom:
            - configMapRef:
                name: gis-agent-config
            - secretRef:
                name: gis-agent-secret
          # The worker only uses the application role. Explicit values
          # override administrator credentials inherited through envFrom.
          env:
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # No HTTP probe — worker is a long-running consumer. We rely on
          # liveness via process exit (Deployment auto-restarts on crash).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gis-agent-outbox-worker
  namespace: gis-agent
