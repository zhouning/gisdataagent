# One-shot Job that runs all pending DB migrations against postgres. Replaces
# the in-process migration loop in docker-entrypoint.sh, which races when
# multiple app pods boot simultaneously and re-runs all SQL on every restart.
#
# Runs once per (image, schema_migrations) combo:
#   - schema_migrations table tracks applied versions
#   - run_pending_migrations() is idempotent and skips already-applied files
#
# Triggered by `kubectl apply -k k8s/`. App deployment uses an init container
# to wait for this Job's completion before starting Chainlit.
apiVersion: batch/v1
kind: Job
metadata:
  name: gis-agent-migrate
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent-migrate
    app.kubernetes.io/component: bootstrap
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-migrate
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "[migrate] waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gis-agent-config
            - secretRef:
                name: gis-agent-secret
          command:
            - sh
            - -c
            - |
              # 1. Run python-side migrations (082+ are tracked in
              #    schema_migrations). data_agent.migration_runner discovers
              #    all migrations/*.sql and skips already-applied ones.
              cd /app
              export PYTHONPATH=/app
              python -c "from dotenv import load_dotenv; load_dotenv('/app/.env', override=False) if __import__('os').path.exists('/app/.env') else None; from data_agent.migration_runner import run_pending_migrations; run_pending_migrations()"
              echo "[migrate] migrations done"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
