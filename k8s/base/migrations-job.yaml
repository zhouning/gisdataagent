# One-shot Job that runs all pending DB migrations against postgres. Replaces
# the in-process migration loop in docker-entrypoint.sh, which races when
# multiple app pods boot simultaneously and re-runs all SQL on every restart.
#
# Runs once per (image, schema_migrations) combo:
#   - schema_migrations tracks stable filename IDs and SHA-256 checksums
#   - the strict runner fails on drift and applies only pending files
#
# Triggered by `kubectl apply -k k8s/`. Runtime pods wait for this Job and then
# perform the same read-only ledger verification during process startup.
apiVersion: batch/v1
kind: Job
metadata:
  name: gis-agent-migrate
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent-migrate
    app.kubernetes.io/component: bootstrap
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-migrate
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "[migrate] waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gis-agent-config
            - secretRef:
                name: gis-agent-secret
          command:
            - sh
            - -c
            - |
              set -eu
              # The migration Job is the only schema writer and uses the admin
              # role. Application and worker processes use the normal role.
              cd /app
              export PYTHONPATH=/app
              export MIGRATION_RUNTIME_DB_ROLE="${POSTGRES_USER}"
              export POSTGRES_USER="${POSTGRES_ADMIN_USER}"
              export POSTGRES_PASSWORD="${POSTGRES_ADMIN_PASSWORD}"
              unset DATABASE_URL
              python -m data_agent.migration_runner migrate
              bash /app/scripts/grant-platform-gateway-role.sh
              echo "[migrate] migrations done"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
