apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-agent-app
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent-app
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-app
        app.kubernetes.io/component: application
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: gis-agent-app
      automountServiceAccountToken: false
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                  echo "[init] waiting for postgres..."
                  sleep 2
              done
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                  echo "[init] waiting for redis..."
                  sleep 2
              done
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- --timeout=2 http://minio:9000/minio/health/ready >/dev/null 2>&1; do
                  echo "[init] waiting for minio..."
                  sleep 2
              done
        - name: wait-for-migrate
          # Verify the migration ledger through the application database role.
          # This avoids granting the runtime Pod Kubernetes API credentials.
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - data_agent.migration_runner
            - status
          envFrom:
            - configMapRef:
                name: gis-agent-config
            - secretRef:
                name: gis-agent-secret
          env:
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
      containers:
        - name: app
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: gis-agent-config
            - secretRef:
                name: gis-agent-secret
          # env entries override envFrom. Only the migration Job may retain
          # the shared Secret's administrator credentials.
          env:
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
          volumeMounts:
            # Local scratch / temp files. Production uploads now go to
            # MinIO via StorageManager (s3:// URI). This PVC is kept for
            # files written outside the storage manager (e.g. matplotlib
            # temp PNG renders, generated reports before upload).
            - name: scratch
              mountPath: /app/data_agent/uploads
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
      volumes:
        - name: scratch
          # emptyDir keeps HPA scale-up working (no PVC contention) since
          # nothing on this volume needs to survive a pod restart.
          emptyDir:
            sizeLimit: 5Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gis-agent-app
  namespace: gis-agent
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gis-agent-app
  namespace: gis-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-app
