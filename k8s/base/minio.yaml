apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: object-storage
    spec:
      containers:
        - name: minio
          # Pinned to a known-good release. The 'latest' tag flips
          # behavior between releases (console port, env-var names) and
          # broke a number of K8s deployments in 2025-Q1.
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          envFrom:
            - secretRef:
                name: minio-root
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: object-storage
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: api
      protocol: TCP
      name: api
    - port: 9001
      targetPort: console
      protocol: TCP
      name: console
  selector:
    app.kubernetes.io/name: minio
---
# One-shot Job to create the uploads and lakehouse buckets. Idempotent —
# `mc mb --ignore-existing` won't fail on subsequent runs, and the Job's
# completions=1 means kustomize re-applies are no-ops once it succeeds.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: bootstrap
  annotations:
    # Re-running the same Job (kubectl delete + apply) is fine; helm-style
    # hook annotation is left out so kustomize doesn't try to manage it.
    description: "Creates upload and lakehouse buckets on first MinIO bring-up"
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
            - name: UPLOADS_BUCKET
              valueFrom:
                secretKeyRef:
                  name: gis-agent-secret
                  key: AWS_S3_BUCKET
            - name: LAKEHOUSE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: gis-agent-config
                  key: MMFE_LAKEHOUSE_BUCKET
          command:
            - sh
            - -c
            - |
              set -e
              # Wait for MinIO to be reachable. The StatefulSet's readiness
              # probe makes its Service endpoint flap during boot; we retry
              # for up to 60 seconds.
              for i in $(seq 1 30); do
                  if mc alias set local http://minio:9000 \
                       "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>/dev/null; then
                      break
                  fi
                  echo "[bucket-init] minio not ready (attempt $i/30), sleeping 2s"
                  sleep 2
              done
              mc alias set local http://minio:9000 \
                  "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/"$UPLOADS_BUCKET"
              mc mb --ignore-existing local/"$LAKEHOUSE_BUCKET"
              # No public read; the app uses signed URLs / SDK auth.
              mc anonymous set none local/"$UPLOADS_BUCKET" || true
              mc anonymous set none local/"$LAKEHOUSE_BUCKET" || true
              echo "[bucket-init] buckets '$UPLOADS_BUCKET' and '$LAKEHOUSE_BUCKET' ready"
