apiVersion: v1
kind: ServiceAccount
metadata:
  name: gis-agent-metric-query-worker
  namespace: gis-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gis-agent-metric-query-worker
  namespace: gis-agent
data:
  GDA_METRIC_QUERY_POSTGIS_DATABASE_ROLE: gda_metric_query_reader
  GDA_METRIC_QUERY_POSTGIS_RELATION_AUTHORITY: serving-local
  GDA_METRIC_QUERY_POSTGIS_CONNECT_TIMEOUT_SECONDS: "5"
  GDA_METRIC_QUERY_POSTGIS_STATEMENT_TIMEOUT_MS: "30000"
  GDA_METRIC_QUERY_MAX_RESULT_ROWS: "10000"
  GDA_METRIC_QUERY_BATCH_SIZE: "10"
  GDA_METRIC_QUERY_LEASE_SECONDS: "120"
  GDA_METRIC_QUERY_POLL_INTERVAL_SECONDS: "5"
  GDA_METRIC_QUERY_HEALTH_MAX_AGE_SECONDS: "180"
  GDA_METRIC_QUERY_RESULT_BACKEND: s3
  GDA_METRIC_QUERY_RESULT_S3_BUCKET: gis-agent-metric-query-results
  GDA_METRIC_QUERY_RESULT_S3_PREFIX: metric-query-results/v1
  GDA_METRIC_QUERY_RESULT_STORE_TIMEOUT_SECONDS: "10"
  AWS_ENDPOINT_URL: http://minio:9000
  AWS_REGION: us-east-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-agent-metric-query-worker
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent-metric-query-worker
    app.kubernetes.io/component: metric-query
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-metric-query-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-metric-query-worker
        app.kubernetes.io/component: metric-query
    spec:
      serviceAccountName: gis-agent-metric-query-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: materialize-provider-secret
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /app/scripts/materialize_metric_query_provider_secret.sh
            - /var/run/gda-secret-input/database-url
            - /var/run/gda-secret-owned/postgis.url
          volumeMounts:
            - name: provider-secret-input
              mountPath: /var/run/gda-secret-input
              readOnly: true
            - name: provider-secret-owned
              mountPath: /var/run/gda-secret-owned
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: worker
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export GDA_METRIC_QUERY_WORKER_ID="worker:metric-query-postgis:${POD_NAME}"
              exec python -m data_agent.metric_query_command_worker run
          envFrom:
            - configMapRef:
                name: gis-agent-metric-query-worker
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: gis_agent
            - name: POSTGRES_USER
              value: agent_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gis-agent-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
            - name: GDA_METRIC_QUERY_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: gis-agent-metric-query-postgis-runtime
                  key: tenant-id
            - name: GDA_METRIC_QUERY_POSTGIS_DATABASE_URL_FILE
              value: /var/run/gda-secret-owned/postgis.url
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: gis-agent-metric-query-postgis-runtime
                  key: s3-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: gis-agent-metric-query-postgis-runtime
                  key: s3-secret-access-key
            - name: GDA_METRIC_QUERY_STATUS_FILE
              value: /var/run/gda-status/worker.json
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "0"
            - name: ASYNC_POOL_MIN
              value: "0"
            - name: ASYNC_POOL_MAX
              value: "1"
          volumeMounts:
            - name: provider-secret-owned
              mountPath: /var/run/gda-secret-owned
              readOnly: true
            - name: worker-status
              mountPath: /var/run/gda-status
            - name: worker-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            exec:
              command:
                - python
                - -m
                - data_agent.metric_query_command_worker
                - liveness
                - --status-file
                - /var/run/gda-status/worker.json
                - --max-age-seconds
                - "180"
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            exec:
              command:
                - python
                - -m
                - data_agent.metric_query_command_worker
                - health
                - --status-file
                - /var/run/gda-status/worker.json
                - --max-age-seconds
                - "180"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - python
                - -m
                - data_agent.metric_query_command_worker
                - liveness
                - --status-file
                - /var/run/gda-status/worker.json
                - --max-age-seconds
                - "180"
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: provider-secret-input
          secret:
            secretName: gis-agent-metric-query-postgis-runtime
            defaultMode: 0444
            items:
              - key: database-url
                path: database-url
        - name: provider-secret-owned
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: worker-status
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: worker-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
