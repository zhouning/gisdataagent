apiVersion: v1
kind: ServiceAccount
metadata:
  name: gis-agent-projection-recovery-worker
  namespace: gis-agent
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gis-agent-projection-recovery-worker
  namespace: gis-agent
data:
  GDA_PROJECTION_RECOVERY_WORKER_LIMIT: "1"
  GDA_PROJECTION_RECOVERY_WORKER_LEASE_SECONDS: "120"
  GDA_PROJECTION_RECOVERY_WORKER_HEARTBEAT_SECONDS: "40"
  GDA_PROJECTION_RECOVERY_WORKER_RETRY_DELAY_SECONDS: "30"
  GDA_PROJECTION_RECOVERY_WORKER_POLL_SECONDS: "5"
  GDA_PROJECTION_RECOVERY_ROWS_DIRECTORY: /var/lib/gda/projection-recovery-rows
  GDA_PROJECTION_RECOVERY_CONTROLLER_ADMISSION_FILE: /var/run/gda-controller/admissions.json
  GDA_PROJECTION_RECOVERY_COMPENSATION_STRATEGY: disabled
  GDA_PROJECTION_RECOVERY_COMPENSATION_APPROVAL_TTL_SECONDS: "900"
  GDA_PROJECTION_RECOVERY_COMPENSATION_MAX_ATTEMPTS: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-agent-projection-recovery-worker
  namespace: gis-agent
  labels:
    app.kubernetes.io/name: gis-agent-projection-recovery-worker
    app.kubernetes.io/component: projection-recovery
spec:
  # Opt in only after provisioning the runtime Secret and admission bundle.
  replicas: 0
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-projection-recovery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-projection-recovery-worker
        app.kubernetes.io/component: projection-recovery
    spec:
      serviceAccountName: gis-agent-projection-recovery-worker
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              until nc -z postgres 5432; do
                echo "[projection-recovery] waiting for postgres"
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: worker
          image: gis-data-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              export GDA_PROJECTION_RECOVERY_TENANT_ID="$(cat /var/run/gda-runtime/tenant-id)"
              export GDA_PROJECTION_RECOVERY_WORKER_ID="worker:projection-recovery:${POD_NAME}"
              exec python -m data_agent.cross_store_projection_recovery_job_worker
          envFrom:
            - configMapRef:
                name: gis-agent-projection-recovery-worker
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DATABASE
              value: gis_agent
            - name: POSTGRES_USER
              value: agent_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gis-agent-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_ADMIN_USER
              value: ""
            - name: POSTGRES_ADMIN_PASSWORD
              value: ""
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "0"
            - name: ASYNC_POOL_MIN
              value: "0"
            - name: ASYNC_POOL_MAX
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: runtime-identity
              mountPath: /var/run/gda-runtime
              readOnly: true
            - name: controller-admission
              mountPath: /var/run/gda-controller
              readOnly: true
            - name: recovery-rows
              mountPath: /var/lib/gda/projection-recovery-rows
              readOnly: true
            - name: worker-tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: runtime-identity
          secret:
            secretName: gis-agent-projection-recovery-runtime
            defaultMode: 0440
            items:
              - key: tenant-id
                path: tenant-id
        - name: controller-admission
          secret:
            secretName: gis-agent-projection-recovery-admission
            defaultMode: 0440
            items:
              - key: admissions.json
                path: admissions.json
        # Replace with an environment-owned plan-bound volume for rebuild jobs.
        - name: recovery-rows
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: worker-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
