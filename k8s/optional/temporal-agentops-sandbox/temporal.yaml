apiVersion: v1
kind: Service
metadata:
  name: gis-agent-temporal-frontend
  labels:
    app.kubernetes.io/name: gis-agent-temporal
    app.kubernetes.io/component: temporal-server
spec:
  selector:
    app.kubernetes.io/name: gis-agent-temporal
  ports:
    - name: frontend
      port: 7233
      targetPort: frontend
    - name: history
      port: 7234
      targetPort: history
    - name: matching
      port: 7235
      targetPort: matching
    - name: worker
      port: 7239
      targetPort: worker
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gis-agent-temporal
  labels:
    app.kubernetes.io/name: gis-agent-temporal
    app.kubernetes.io/component: temporal-server
spec:
  # This profile is opt-in. The overlay raises this to one replica for a local rehearsal.
  replicas: 0
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-temporal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-temporal
        app.kubernetes.io/component: temporal-server
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.29.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: frontend
              containerPort: 7233
            - name: history
              containerPort: 7234
            - name: matching
              containerPort: 7235
            - name: worker
              containerPort: 7239
          env:
            - name: DB
              value: postgres12
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_SEEDS
              value: gis-agent-temporal-postgres
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: gis-agent-temporal-runtime
                  key: database-password
            - name: ENABLE_ES
              value: "false"
            - name: DEFAULT_NAMESPACE
              value: gda-agentops-sandbox
            - name: DEFAULT_NAMESPACE_RETENTION
              value: 24h
            - name: DYNAMIC_CONFIG_FILE_PATH
              value: config/dynamicconfig/docker.yaml
            # Port-forward and local SDK rehearsals connect through pod loopback.
            - name: BIND_ON_IP
              value: 0.0.0.0
          readinessProbe:
            tcpSocket:
              port: frontend
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: frontend
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
