apiVersion: v1
kind: Service
metadata:
  name: gis-agent-temporal-postgres
spec:
  selector:
    app.kubernetes.io/name: gis-agent-temporal-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gis-agent-temporal-postgres
  labels:
    app.kubernetes.io/name: gis-agent-temporal-postgres
    app.kubernetes.io/component: temporal-sandbox-database
spec:
  replicas: 0
  serviceName: gis-agent-temporal-postgres
  selector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-temporal-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gis-agent-temporal-postgres
        app.kubernetes.io/component: temporal-sandbox-database
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 70
        runAsNonRoot: true
        runAsGroup: 70
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16.4-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: temporal
            - name: POSTGRES_USER
              value: temporal
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gis-agent-temporal-runtime
                  key: database-password
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U temporal -d temporal"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U temporal -d temporal"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
  volumeClaimTemplates:
    - metadata:
        name: temporal-postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
