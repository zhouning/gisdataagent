apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gis-agent-temporal-server-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-temporal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-agentops-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-agentops-discovery
      ports:
        - protocol: TCP
          port: 7233
        - protocol: TCP
          port: 7235
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-temporal-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gis-agent-temporal-postgres-isolation
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gis-agent-temporal-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gis-agent-temporal
      ports:
        - protocol: TCP
          port: 5432
---
