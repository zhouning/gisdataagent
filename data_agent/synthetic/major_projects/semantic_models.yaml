semantic_models:
  - name: mp_project_lifecycle
    description: "重大项目从清单、用地计划、预审、农转用、供地到许可核实的合成生命周期模型。"
    source_table: mp_project_list
    srid: 4326
    geometry_type: Polygon
    metadata:
      profile: small_dev
      seed: 20260604
      generator_version: major_project_synthetic_core_v1
      synthetic_only: true
      notice: "Synthetic major-project semantic model; no production records."
    entities:
      - name: major_project
        type: primary
        column: project_id
      - name: parcel
        type: foreign
        column: parcel_id
    joins:
      - name: project_to_pre_review
        left_table: mp_project_list
        right_table: mp_pre_review
        left_key: project_id
        right_key: project_id
        relationship: one_to_many
      - name: project_to_conversion
        left_table: mp_project_list
        right_table: mp_conversion_expropriation
        left_key: project_id
        right_key: project_id
        relationship: one_to_many
      - name: project_to_parcel_confidence
        left_table: mp_project_list
        right_table: mp_relation_confidence
        left_key: project_id
        right_key: project_id
        relationship: one_to_many
        filter: "relation_type = 'OCCUPIES_PARCEL'"
      - name: parcel_confidence_to_parcel
        left_table: mp_relation_confidence
        right_table: mp_parcel
        left_key: target_id
        right_key: parcel_id
        relationship: many_to_one
    dimensions:
      - name: project_name
        type: categorical
        column: project_name
      - name: zdxmbh
        type: categorical
        column: zdxmbh
      - name: province
        type: categorical
        column: province
      - name: city
        type: categorical
        column: city
      - name: county
        type: categorical
        column: county
      - name: project_type
        type: categorical
        column: project_type
      - name: status
        type: categorical
        column: status
      - name: list_year
        type: time
        column: list_year
      - name: geom
        type: spatial
        column: geom
        srid: 4326
        geometry_type: Polygon
    measures:
      - name: project_count
        agg: count_distinct
        column: project_id
      - name: planned_land_area_mu
        agg: sum
        column: planned_land_area_mu
      - name: occupied_parcel_area_mu
        agg: sum
        column: area_mu
    metrics:
      - name: total_planned_land_area_mu
        type: simple
        measure: planned_land_area_mu
      - name: total_occupied_parcel_area_mu
        type: simple
        measure: occupied_parcel_area_mu
