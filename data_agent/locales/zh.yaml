# --- TWM research positioning, claims and experiments ---
twm_service.research.positioning.research_question: "治理导向的地理空间世界模型，能否通过在一个可审计闭环中耦合分层 GIS 状态、政策约束、证据血缘和动作条件预测，改善国土空间规划决策？"
twm_service.research.positioning.claim_boundary: "当前 TWM 是严谨的原型和审查脚手架。近期可辩护的主张是为国土空间治理工作流提供可审计决策支持；生产级预测主张需要真实观察历史、基线比较和外部验证。"
twm_service.research.positioning.core.0.name: "分层 GIS 对象-关系-规则-证据状态"
twm_service.research.positioning.core.0.claim: "TWM 将图斑、项目、管控边界、规划分区、审批、证据和规则表示为关联状态，而不是扁平要素表。"
twm_service.research.positioning.core.0.why_it_matters: "国土空间治理决策同时依赖对象角色、空间关系、政策条款和证据血缘。"
twm_service.research.positioning.core.1.name: "动作条件多头国土空间动力学"
twm_service.research.positioning.core.1.claim: "TWM 根据复核、保护、转换和修复动作，预测多维分层未来状态潜变量、约束风险、规划效用、不确定性和动作掩码可行性；潜变量解码为状态摘要，不生成完整图斑几何。"
twm_service.research.positioning.core.1.why_it_matters: "决策对象不只是土地利用变化，还包括硬约束和证据限制下治理动作的后果。"
twm_service.research.positioning.core.2.name: "证据门控与因果校准的主张阶梯"
twm_service.research.positioning.core.2.claim: "TWM 在升级任何运营主张前，区分确定性规则证据、观察性因果校准和验证门。"
twm_service.research.positioning.core.2.why_it_matters: "即使数据为合成、识别不足或缺少生产证据，系统仍可以有用，同时拒绝过度主张。"
twm_service.research.positioning.innovation.0.hypothesis: "创新点是架构集成，而不是 GIS 模拟本身是新事物。"
twm_service.research.positioning.innovation.0.test: "与土地利用模拟器、GIS 规则引擎和优化工具比较其是否能共同暴露动作条件预测、政策证据和可审计主张边界。"
twm_service.research.positioning.innovation.1.hypothesis: "对象-关系-规则-证据状态比逐图层人工复核更少漏掉合规冲突。"
twm_service.research.positioning.innovation.1.test: "在留出的真实审批/复核案件上测量硬约束冲突召回率和错误复核负担。"
twm_service.research.positioning.innovation.2.hypothesis: "证据门控预测比黑箱规划分数更能提升决策可辩护性。"
twm_service.research.positioning.innovation.2.test: "审计每个推荐或拒绝选项是否携带来源证据、规则条款、不确定性和人工复核原因。"
twm_service.research.positioning.unmet_need_hypotheses.0: "规划和用地审查工作流仍把空间叠加、政策检查、审批证据和情景比较分散在不同工具中。"
twm_service.research.positioning.unmet_need_hypotheses.1: "现有土地利用模拟器强调空间格局转移，而运营审查需要动作后果、规则有效性和审计边界。"
twm_service.research.positioning.unmet_need_hypotheses.2: "优化工具可以给候选项排序，但通常无法保留候选项为何违法、证据不足或只能复核而不能通过。"
twm_service.research.positioning.baselines_to_beat.0: "人工 GIS 叠加加清单审查"
twm_service.research.positioning.baselines_to_beat.1: "纯规则空间合规引擎"
twm_service.research.positioning.baselines_to_beat.2: "用于格局转移的 FLUS/PLUS/CLUE-S/CA-Markov 等土地利用模拟模型"
twm_service.research.positioning.baselines_to_beat.3: "不带证据门控主张验证的纯优化耕地或规划候选项排序"
twm_service.research.positioning.falsification_conditions.0: "如果真实工作流访谈表明目标决策已被现有工具很好解决，应收窄或停止 TWM。"
twm_service.research.positioning.falsification_conditions.1: "如果 TWM 在硬约束冲突召回、证据完整性或审计轨迹质量上没有超过基线，则不支持该主张。"
