twm_service.research.claim.C3_action_conditioned_triage.minimum_data.1: "خطط مرشحة وتصرفات فعلية"
twm_service.research.claim.C3_action_conditioned_triage.minimum_data.2: "تسميات نوع الإجراء وجدوى السياسة"
