twm_service.research.claim.C1_state_conflict_recall.minimum_data.1: "إصدارات حدود موثوقة للأراضي الزراعية الأساسية والخط الأحمر البيئي وضبط الاستخدام"
twm_service.research.claim.C1_state_conflict_recall.minimum_data.2: "قائمة مراجعة يدوية أو إصابات قواعد تاريخية"
twm_service.research.claim.C1_state_conflict_recall.minimum_data.3: "التصرف النهائي"
twm_service.research.claim.C2_audit_defensibility.claim: "تحسن المراجعة المحكومة بالأدلة قابلية الدفاع عن التدقيق مقارنة بمحركات الامتثال المكاني القائمة على القواعد فقط."
twm_service.research.claim.C2_audit_defensibility.business_need: "يحتاج المشغلون إلى معرفة القاعدة المصابة ومصدر الدليل والفجوات وسبب المراجعة البشرية وسبب عدم أتمتة نتيجة الموافقة."
twm_service.research.claim.C2_audit_defensibility.core_technology: "سلم ادعاءات محكوم بالأدلة ومعاير سببياً"
twm_service.research.claim.C2_audit_defensibility.current_evidence: "إصابات القواعد وعناصر الأدلة ومهام المراجعة الحالية اصطناعية وغير مخصصة للإنتاج؛ مفيدة للانحدار لا لإثبات جودة التدقيق."
twm_service.research.claim.C2_audit_defensibility.falsification: "إذا قدم خرج القواعد فقط اكتمال تدقيق مكافئاً وعبئاً أقل في الحالات الحقيقية، فلا يكون إسهام TWM المحكوم بالأدلة مدعوماً."
