# --- TWM research positioning, claims and experiments ---
twm_service.research.positioning.research_question: "هل يستطيع نموذج جغرافي مكاني عالمي موجه للحوكمة تحسين قرارات التخطيط الإقليمي بربط حالة GIS الهرمية وقيود السياسات ومصدر الأدلة والتنبؤ المشروط بالإجراء في حلقة واحدة قابلة للتدقيق؟"
twm_service.research.positioning.claim_boundary: "يمثل TWM الحالي نموذجاً أولياً صارماً وهيكل مراجعة. والادعاء القريب القابل للدفاع هو دعم قرارات قابل للتدقيق لسير عمل الحوكمة الإقليمية؛ أما ادعاءات التنبؤ الإنتاجية فتتطلب سجلات مرصودة حقيقية ومقارنات خطوط أساس وتحقيقاً خارجياً."
twm_service.research.positioning.core.0.name: "حالة GIS هرمية للكائن والعلاقة والقاعدة والدليل"
twm_service.research.positioning.core.0.claim: "يمثل TWM القطع والمشروعات وحدود التحكم ومناطق التخطيط والموافقات والأدلة والقواعد كحالة مترابطة بدلاً من جدول معالم مسطح."
twm_service.research.positioning.core.0.why_it_matters: "تعتمد قرارات الحوكمة الإقليمية في الوقت نفسه على أدوار الكائنات والعلاقات المكانية وبنود السياسة ومصدر الدليل."
twm_service.research.positioning.core.1.name: "ديناميكيات إقليمية متعددة الرؤوس مشروطة بالإجراء"
twm_service.research.positioning.core.1.claim: "يتنبأ TWM بمتغير حالة مستقبلية هرمية متعددة الأبعاد ومخاطر القيود ومنفعة التخطيط وعدم اليقين وجدوى قناع الإجراء المشروطة بإجراءات المراجعة والحماية والتحويل والاستعادة؛ ويُفك ترميز المتغير إلى ملخصات حالة ولا يولد هندسة القطع الكاملة."
twm_service.research.positioning.core.1.why_it_matters: "لا يقتصر موضوع القرار على تغير استخدام الأرض، بل يشمل عواقب إجراءات الحوكمة تحت القيود الصارمة وحدود الأدلة."
twm_service.research.positioning.core.2.name: "سلم ادعاءات محكوم بالأدلة ومعاير سببياً"
twm_service.research.positioning.core.2.claim: "يفصل TWM بين دليل القاعدة الحتمي والمعايرة السببية الرصدية وبوابات التحقق قبل ترقية أي ادعاء تشغيلي."
twm_service.research.positioning.core.2.why_it_matters: "يمكن للنظام أن يكون مفيداً مع رفض المبالغة عندما تكون البيانات اصطناعية أو التعريف ناقصاً أو دليل الإنتاج مفقوداً."
twm_service.research.positioning.innovation.0.hypothesis: "الجدة هي التكامل المعماري، وليست أن محاكاة GIS جديدة بحد ذاتها."
twm_service.research.positioning.innovation.0.test: "المقارنة مع محاكيات استخدام الأرض ومحركات قواعد GIS وأدوات التحسين لمعرفة ما إذا كانت تكشف معاً التنبؤ المشروط بالإجراء ودليل السياسة وحدود الادعاء القابلة للتدقيق."
twm_service.research.positioning.innovation.1.hypothesis: "تقلل حالة الكائن والعلاقة والقاعدة والدليل من تعارضات الامتثال الفائتة مقارنة بالمراجعة اليدوية طبقة بطبقة."
twm_service.research.positioning.innovation.1.test: "قياس استدعاء تعارض القيود الصارمة وعبء المراجعة الخاطئة في حالات موافقة ومراجعة حقيقية محجوزة."
twm_service.research.positioning.innovation.2.hypothesis: "تحسن التنبؤات المحكومة بالأدلة قابلية الدفاع عن القرار مقارنة بدرجات التخطيط الصندوقية."
twm_service.research.positioning.innovation.2.test: "تدقيق ما إذا كان كل خيار موصى به أو مرفوض يحمل دليل المصدر وبند القاعدة وعدم اليقين وسبب المراجعة البشرية."
twm_service.research.positioning.unmet_need_hypotheses.0: "ما زالت أعمال التخطيط ومراجعة استخدام الأرض تفرق التراكبات المكانية وفحوص السياسات وأدلة الموافقة ومقارنة السيناريوهات بين أدوات منفصلة."
twm_service.research.positioning.unmet_need_hypotheses.1: "تركز محاكيات استخدام الأرض الحالية على انتقال النمط المكاني، بينما تحتاج المراجعة التشغيلية إلى عواقب الإجراء وصحة القاعدة وحدود التدقيق."
twm_service.research.positioning.unmet_need_hypotheses.2: "يمكن لأدوات التحسين ترتيب المرشحين، لكنها غالباً لا تحفظ سبب كون المرشح غير قانوني أو ناقص الأدلة أو قابلاً للمراجعة فقط بدلاً من الموافقة."
twm_service.research.positioning.baselines_to_beat.0: "تراكب GIS يدوي مع مراجعة قائمة تحقق"
twm_service.research.positioning.baselines_to_beat.1: "محرك امتثال مكاني قائم على القواعد فقط"
twm_service.research.positioning.baselines_to_beat.2: "نماذج محاكاة استخدام الأرض مثل FLUS/PLUS/CLUE-S/CA-Markov لانتقال النمط"
twm_service.research.positioning.baselines_to_beat.3: "ترتيب مرشحي الأراضي الزراعية أو التخطيط بالتحسين فقط دون تحقق ادعاء محكوم بالأدلة"
twm_service.research.positioning.falsification_conditions.0: "إذا أظهرت مقابلات سير العمل الحقيقية أن القرارات المستهدفة محلولة جيداً بالأدوات الحالية، فيجب تضييق TWM أو إيقافه."
twm_service.research.positioning.falsification_conditions.1: "إذا لم يحسن TWM استدعاء تعارض القيود الصارمة أو اكتمال الأدلة أو جودة مسار التدقيق على خطوط الأساس، فلا يكون الادعاء مدعوماً."
twm_service.research.positioning.falsification_conditions.2: "إذا تعذر التحقق من الديناميكيات المشروطة بالإجراء خارج التركيبات الاصطناعية، فيجب إبقاء TWM هيكل مراجعة لا نموذج قرار إنتاجياً."
twm_service.research.positioning.minimum_evaluation_plan.0: "جمع سجلات موافقات ومراجعات حقيقية أو منقحة تتضمن هندسة المشروع ونتائج القواعد وروابط الأدلة والقرارات النهائية."
twm_service.research.positioning.minimum_evaluation_plan.1: "المقارنة مع التراكب اليدوي والمحرك القائم على القواعد وخط أساس واحد على الأقل لمحاكاة استخدام الأرض أو تحسينه حيثما يلزم."
twm_service.research.positioning.minimum_evaluation_plan.2: "الإبلاغ عن تعارضات القيود الصارمة الفائتة ودقة مهام المراجعة واكتمال الأدلة وتغطية أسباب رفض المرشح واكتمال مسار التدقيق."
twm_service.research.positioning.minimum_evaluation_plan.3: "الإبقاء على التركيبات الاصطناعية للانحدار فقط؛ وعدم استخدامها كدليل أثر إنتاجي."
twm_service.research.claim.C1_state_conflict_recall.claim: "تقلل حالة الكائن والعلاقة والقاعدة والدليل من تعارضات القيود الصارمة الفائتة مقارنة بالمراجعة اليدوية لـ GIS طبقة بطبقة."
twm_service.research.claim.C1_state_conflict_recall.business_need: "يجب أن تراجع معاينة استخدام أرض المشروع النطاق والقطع الحالية والأراضي الزراعية الأساسية الدائمة والخط الأحمر البيئي ومناطق الاستخدام وأدلة الموافقة وبنود القواعد معاً؛ وقد تفوت التراكبات المتفرقة التعارضات أو فجوات الأدلة."
twm_service.research.claim.C1_state_conflict_recall.core_technology: "حالة GIS هرمية للكائن والعلاقة والقاعدة والدليل"
twm_service.research.claim.C1_state_conflict_recall.current_evidence: "تتحقق التركيبات الاصطناعية من المسار ونموذج كائن القاعدة/الدليل، لكنها لا تتحقق من استدعاء التعارض الحقيقي."
twm_service.research.claim.C1_state_conflict_recall.falsification: "إذا فشل TWM في اكتشاف القيود الصارمة نفسها التي يفوتها التراكب اليدوي، أو طابق النتائج اليدوية مع إضافة عبء، يفشل هذا الادعاء."
