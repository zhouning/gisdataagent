twm_service.data_foundation.mentor.short_answer: "الجزء الموثوق من TWM اليوم هو التحقق من الفرضيات الهندسية والبحثية، لا إثبات التبني الإنتاجي. يوضح أساس البيانات أن إطار الكائن والعلاقة والقاعدة والدليل في TWM يعمل ويكشف أسئلة الأعمال التي تحتاج تحققاً ببيانات حقيقية؛ ومن دون سجل موافقات حقيقي وتسميات سياسات/إجراءات لا يمكنه ادعاء حل قرارات الحوكمة الإقليمية الحقيقية."
twm_service.data_foundation.mentor.research_judgment: "ينبغي أن تضيق المرحلة التالية سؤال البحث إلى احتياجات حقيقية غير ملباة: مراجعة القواعد عبر الطبقات واكتمال سلسلة الأدلة وأولوية مهام المراجعة وتفسير عدم جدوى الخطة. وتتطلب هذه الاحتياجات عينات أعمال حقيقية أو منقحة مقارنة بخطوط أساس GIS اليدوي والقواعد فقط والمحاكي والمحسن."

