twm_service.research.claim.C3_action_conditioned_triage.business_need: "يجب أن تشرح مراجعة الخيارات سبب عدم قانونية المرشح أو نقص أدلته أو اقتصاره على المراجعة أو جاهزيته للتقدم، لا أن تعيد انتقالاً مكانياً أو درجة تحسين واحدة فقط."
twm_service.research.claim.C3_action_conditioned_triage.core_technology: "ديناميكيات إقليمية متعددة الرؤوس مشروطة بالإجراء"
twm_service.research.claim.C3_action_conditioned_triage.current_evidence: "يدعم أساس التجربة الاصطناعية توصيلات قناع الإجراء والخطة الشعاعية؛ ولا يوجد تحقق حقيقي للديناميكيات المشروطة بالإجراء بعد."
twm_service.research.claim.C3_action_conditioned_triage.falsification: "إذا لم تتفوق المخرجات المشروطة بالإجراء على ترتيب مرشحين أبسط مفلتر بالقواعد في حالات حقيقية محجوزة، فتبقى هيكل مراجعة فقط."
