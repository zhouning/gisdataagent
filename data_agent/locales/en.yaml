# --- TWM research positioning, claims and experiments ---
twm_service.research.positioning.research_question: "Can a governance-oriented geospatial world model improve territorial planning decisions by coupling hierarchical GIS state, policy constraints, evidence provenance and action-conditioned forecast in one auditable loop?"
twm_service.research.positioning.claim_boundary: "Current TWM is a rigorous prototype and review scaffold. Its defensible near-term claim is auditable decision support for territorial governance workflows; production-grade predictive claims require real observed histories, baseline comparisons and external validation."
twm_service.research.positioning.core.0.name: "Hierarchical GIS object-relation-rule-evidence state"
twm_service.research.positioning.core.0.claim: "TWM represents parcels, projects, control boundaries, planning zones, approvals, evidence and rules as a linked state rather than as a flat feature table."
twm_service.research.positioning.core.0.why_it_matters: "Territorial governance decisions depend on object roles, spatial relations, policy clauses and evidence provenance at the same time."
twm_service.research.positioning.core.1.name: "Action-conditioned multi-head territorial dynamics"
twm_service.research.positioning.core.1.claim: "TWM forecasts a multi-dimensional hierarchical future-state latent, constraint-risk, planning utility, uncertainty and action-mask feasibility conditional on review/protect/convert/restore actions; the latent is decoded into state summaries and does not generate full parcel geometry."
twm_service.research.positioning.core.1.why_it_matters: "The decision object is not only land-use change, but the consequence of governance actions under hard constraints and evidence limits."
twm_service.research.positioning.core.2.name: "Evidence-gated and causally calibrated claim ladder"
twm_service.research.positioning.core.2.claim: "TWM separates deterministic rule evidence, observational causal calibration and validation gates before upgrading any operational claim."
twm_service.research.positioning.core.2.why_it_matters: "A system can be useful while still refusing to overclaim when data are synthetic, underidentified or missing production evidence."
twm_service.research.positioning.innovation.0.hypothesis: "The novelty is architectural integration, not that GIS simulation itself is new."
twm_service.research.positioning.innovation.0.test: "Compare against land-use simulators, GIS rule engines and optimization tools on whether they jointly expose action-conditioned forecast, policy evidence and audit-ready claim boundaries."
twm_service.research.positioning.innovation.1.hypothesis: "Object-relation-rule-evidence state reduces missed compliance conflicts compared with layer-by-layer manual review."
twm_service.research.positioning.innovation.1.test: "Measure hard-constraint conflict recall and false review burden on held-out real approval/review cases."
twm_service.research.positioning.innovation.2.hypothesis: "Evidence-gated forecasts improve decision defensibility compared with black-box planning scores."
twm_service.research.positioning.innovation.2.test: "Audit whether every recommended or rejected option carries source evidence, rule clause, uncertainty and human-review reason."
twm_service.research.positioning.unmet_need_hypotheses.0: "Planning and land-use review workflows still fragment spatial overlays, policy checks, approval evidence and scenario comparison across separate tools."
twm_service.research.positioning.unmet_need_hypotheses.1: "Existing land-use simulators emphasize spatial pattern transition, while operational review needs action consequences, rule validity and audit boundaries."
twm_service.research.positioning.unmet_need_hypotheses.2: "Optimization tools can rank candidates, but often do not preserve why a candidate is illegal, under-evidenced or only reviewable rather than approvable."
twm_service.research.positioning.baselines_to_beat.0: "Manual GIS overlay plus checklist review"
twm_service.research.positioning.baselines_to_beat.1: "Rule-only spatial compliance engine"
twm_service.research.positioning.baselines_to_beat.2: "Land-use simulation models such as FLUS/PLUS/CLUE-S/CA-Markov for pattern transition"
twm_service.research.positioning.baselines_to_beat.3: "Optimization-only farmland or planning candidate ranking without evidence-gated claim validation"
twm_service.research.positioning.falsification_conditions.0: "If real workflow interviews show the target decisions are already well solved by existing tools, TWM should be narrowed or stopped."
twm_service.research.positioning.falsification_conditions.1: "If TWM does not improve hard-constraint conflict recall, evidence completeness or audit-trail quality over baselines, the claimed contribution is not supported."
twm_service.research.positioning.falsification_conditions.2: "If action-conditioned dynamics cannot be validated beyond synthetic fixtures, TWM must remain a review scaffold rather than a production decision model."
twm_service.research.positioning.minimum_evaluation_plan.0: "Collect real or sanitized approval/review histories with project geometry, rule outcomes, evidence links and final decisions."
twm_service.research.positioning.minimum_evaluation_plan.1: "Benchmark against manual overlay, rule-only engine and at least one land-use simulation or optimization baseline where appropriate."
twm_service.research.positioning.minimum_evaluation_plan.2: "Report missed hard-constraint conflicts, review-task precision, evidence completeness, candidate rejection reason coverage and audit-trail completeness."
twm_service.research.positioning.minimum_evaluation_plan.3: "Keep synthetic fixtures for regression only; do not use them as production-effect evidence."
twm_service.research.claim.C1_state_conflict_recall.claim: "Object-relation-rule-evidence state reduces missed hard-constraint conflicts compared with layer-by-layer manual GIS review."
twm_service.research.claim.C1_state_conflict_recall.business_need: "Project land-use pre-review must consider project extent, current parcels, permanent basic farmland, ecological redline, use zones, approval evidence and rule clauses together; dispersed overlays can miss conflicts or evidence gaps."
twm_service.research.claim.C1_state_conflict_recall.core_technology: "Hierarchical GIS object-relation-rule-evidence state"
twm_service.research.claim.C1_state_conflict_recall.current_evidence: "Synthetic fixtures verify the pipeline and rule/evidence object model, but do not validate real conflict recall."
twm_service.research.claim.C1_state_conflict_recall.falsification: "If TWM misses the same hard constraints as manual overlay, or only matches manual results while adding overhead, this claim fails."
twm_service.research.claim.C1_state_conflict_recall.minimum_data.0: "Real or sanitized project geometry"
twm_service.research.claim.C1_state_conflict_recall.minimum_data.1: "Authoritative permanent-basic-farmland/ecological-redline/use-control boundary versions"
twm_service.research.claim.C1_state_conflict_recall.minimum_data.2: "Manual review checklist or historical rule hits"
twm_service.research.claim.C1_state_conflict_recall.minimum_data.3: "Final disposition"
twm_service.research.claim.C2_audit_defensibility.claim: "Evidence-gated review improves audit defensibility compared with rule-only spatial compliance engines."
twm_service.research.claim.C2_audit_defensibility.business_need: "Operators need to know not only which rule was hit, but also the evidence source, gaps, human-review reason and why an approval conclusion cannot be automated."
twm_service.research.claim.C2_audit_defensibility.core_technology: "Evidence-gated and causally calibrated claim ladder"
twm_service.research.claim.C2_audit_defensibility.current_evidence: "Current rule hits, evidence items and review tasks are synthetic/not-for-production; useful for regression, not for audit quality proof."
twm_service.research.claim.C2_audit_defensibility.falsification: "If rule-only output gives equivalent audit completeness and lower burden on real cases, TWM's evidence-gated contribution is unsupported."
twm_service.research.claim.C2_audit_defensibility.minimum_data.0: "Real rule clauses and versions"
twm_service.research.claim.C2_audit_defensibility.minimum_data.1: "Rule-hit evidence links"
twm_service.research.claim.C2_audit_defensibility.minimum_data.2: "Review tasks and correction records"
twm_service.research.claim.C2_audit_defensibility.minimum_data.3: "Audit sampling conclusions"
twm_service.research.claim.C3_action_conditioned_triage.claim: "Action-conditioned dynamics improves plan-option triage compared with land-use simulators or optimization-only candidate ranking."
twm_service.research.claim.C3_action_conditioned_triage.business_need: "Option review must explain why a candidate is illegal, under-evidenced, review-only or ready to proceed, rather than returning only spatial transition or a single optimization score."
twm_service.research.claim.C3_action_conditioned_triage.core_technology: "Action-conditioned multi-head territorial dynamics"
twm_service.research.claim.C3_action_conditioned_triage.current_evidence: "Synthetic experiment foundation supports action-mask and beam-plan plumbing; no real action-conditioned dynamics validation yet."
twm_service.research.claim.C3_action_conditioned_triage.falsification: "If action-conditioned outputs cannot beat simpler rule-filtered candidate ranking on real held-out cases, keep this as a review scaffold only."
twm_service.research.claim.C3_action_conditioned_triage.minimum_data.0: "Real multi-period state snapshots"
twm_service.research.claim.C3_action_conditioned_triage.minimum_data.1: "Candidate plans and actual dispositions"
twm_service.research.claim.C3_action_conditioned_triage.minimum_data.2: "Action type and policy feasibility labels"
twm_service.research.claim.C3_action_conditioned_triage.minimum_data.3: "Plan review opinions and later regulatory outcomes"
twm_service.research.claim.C4_standard_contract_ingestion.claim: "Role-contract based ingestion reduces standard-data onboarding errors compared with ad hoc layer mapping."
twm_service.research.claim.C4_standard_contract_ingestion.business_need: "One Map, village-planning samples and local business fields often differ in aliases, value domains and roles; manual mapping can create semantic mismatches."
twm_service.research.claim.C4_standard_contract_ingestion.core_technology: "Hierarchical GIS object-relation-rule-evidence state"
twm_service.research.claim.C4_standard_contract_ingestion.current_evidence: "One Map village standard sample validates structural compatibility but not cross-region production onboarding performance."
twm_service.research.claim.C4_standard_contract_ingestion.falsification: "If role-contract ingestion does not reduce mapping errors or rework over ad hoc mapping, this contribution should be dropped."
twm_service.research.claim.C4_standard_contract_ingestion.minimum_data.0: "One Map or village-planning samples from multiple regions"
twm_service.research.claim.C4_standard_contract_ingestion.minimum_data.1: "Field aliases and value-domain standards"
twm_service.research.claim.C4_standard_contract_ingestion.minimum_data.2: "Manual acceptance records"
twm_service.research.claim.C4_standard_contract_ingestion.minimum_data.3: "Mapping errors and repair logs"
