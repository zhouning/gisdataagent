twm_service.research.claim_matrix.claim_boundary: "Every TWM research claim must name the unmet business need, a simpler baseline, minimum real-data evidence, metrics and falsification conditions before it can be upgraded beyond prototype status."
twm_service.research.claim_matrix.mentor_answer: "TWM innovation cannot be proven by listing model components. Each claim should be bound to a real business problem, a simple baseline, a data gate and falsifiable metrics; until production history and baseline comparisons exist, TWM can claim an engineering prototype and review scaffold, not a production-grade world model."

# --- TWM baseline export schemas and templates ---
twm_service.baseline.export_type.manual_overlay.label: "Manual GIS overlay plus checklist export"
twm_service.baseline.export_type.manual_overlay.business_use: "Retrospective approval replay for C1 hard-constraint conflict recall and C2 audit defensibility."
twm_service.baseline.export_type.manual_overlay.expected_source: "Sanitized same-case export of manual overlay checklists, review records, evidence screenshots/layer versions and final dispositions."
twm_service.baseline.export_type.rule_only_engine.label: "Rule-only spatial compliance engine export"
twm_service.baseline.export_type.rule_only_engine.business_use: "Compare whether deterministic rule overlay already solves evidence and review-task needs without TWM state/claim gates."
twm_service.baseline.export_type.rule_only_engine.expected_source: "Rule hits, spatial relations, severity and clause references for the same projects or parcels."
twm_service.baseline.export_type.optimization_or_simulator_ranking.label: "Land-use simulator or optimization-only ranking export"
twm_service.baseline.export_type.optimization_or_simulator_ranking.business_use: "Plan-option triage benchmark for whether TWM explains illegal, review-only and evidence-gap options better than ranking alone."
twm_service.baseline.export_type.optimization_or_simulator_ranking.expected_source: "Simulation/optimization ranking, feasibility, rejection reasons and manual/expert ranking for the same candidate plans."
twm_service.baseline.schema.purpose: "Define the minimum real or sanitized same-case exports required before TWM baseline comparisons can support retrospective evidence instead of synthetic regression evidence."
twm_service.baseline.schema.same_case_policy: "TWM and baseline outputs must cover the same historical projects, parcels, candidates or review cases. Aggregate-only metrics are acceptable for smoke tests but cannot promote research claims."
twm_service.baseline.schema.minimum_sanitization_rule: "Production or sensitive project/person identifiers must be removed or replaced by stable anonymous IDs; geometry may be generalized if case joins, rule hits and final dispositions remain traceable."
twm_service.baseline.schema.claim_boundary: "Passing this schema check only means the baseline export is structurally comparable. It does not by itself prove TWM has solved an unmet business need."
twm_service.baseline.template.C1_state_conflict_recall.label: "C1 same-case hard-constraint conflict recall export"
twm_service.baseline.template.C1_state_conflict_recall.business_question: "On the same historical projects, does TWM miss fewer permanent-basic-farmland, ecological-redline and use-control conflicts than a manual overlay checklist?"
twm_service.baseline.template.C1_state_conflict_recall.field.0.description: "Stable sanitized same-case ID; it must match between TWM and the baseline."
twm_service.baseline.template.C1_state_conflict_recall.field.0.metric_use: "Used for same-case overlap; without it the two sides cannot be shown to cover the same projects."
twm_service.baseline.template.C1_state_conflict_recall.field.0.sanitization: "Replace the real project identifier with an irreversible anonymous ID."
twm_service.baseline.template.C1_state_conflict_recall.field.1.description: "Hard-constraint conflict truth confirmed by final disposition, review conclusion or expert relabeling."
