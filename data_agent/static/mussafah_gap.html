<body><main class="wrap" id="app"><div class="panel error"><h2>正在读取实际运行结果…</h2><p class="muted">读取 SWMM 报告、方案参数与逐节点对比。</p></div></main>
<script>
const API='/api/abu-dhabi/flood/mussafah00-gap/review';
const ASSET='/api/abu-dhabi/flood/mussafah00-gap/assets/formal/';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=0)=>n==null?'—':Number(n).toLocaleString('en-US',{maximumFractionDigits:d});
const signed=(n,d=0)=>n==null?'—':`${n>0?'+':''}${fmt(n,d)}`;
const asset=(dir,name)=>ASSET+dir.split('/').map(encodeURIComponent).join('/')+'/'+encodeURIComponent(name);
const short={L1:'L1',L2:'L2',A:'L2+ A · Parsons',B1:'L2+ B1 · 自主',B2:'L2+ B2 · 自主'};
let data,mapData,mapWorkspace,selected='B1';
function delta(s,k,d=0){const v=s.deltas[k];return `<small class="${v<0?'good':v>0?'bad':''}">${v===0?'与 L2 相同':`${v<0?'减少':'增加'} ${fmt(Math.abs(v),d)}${k.includes('volume')||k.includes('loss')?' m³':k.includes('count')?' 个':' m'}`}</small>`;}
function render(){
 const states=data.states,base=states[0];
 selected='B1';
 const rows=[['节点累计溢流量','node_flood_volume_m3','m³',0],['系统洪涝损失','routing_flooding_loss_m3','m³',0],['发生溢流的节点','flooded_node_count','个',0],['最大节点地表蓄水深度','maximum_ponded_depth_m','m',3]];
 const metricRows=rows.map(([label,key,unit,digits])=>`<tr><td>${label}<small>${unit}${key==='maximum_ponded_depth_m'?' · 相对井顶，不是二维水深':''}</small></td>${states.map(s=>`<td data-col="${s.key}">${fmt(s.outputs[key],digits)}${s.key==='L1'?'<small>基准</small>':delta(s,key,digits)}</td>`).join('')}</tr>`).join('');
 const aa=states.find(s=>s.key==='A');
 const qualify=states.some(s=>s.outputs.steps_not_converging_percent>1||Math.abs(s.outputs.continuity_error_percent)>1||s.outputs.error_count>0);
 document.getElementById('app').innerHTML=`
 <header class="top"><div><span class="eyebrow">ABU DHABI · STORMWATER</span><h1>Mussafah_00 防线效果对比</h1><p class="muted small">既有管网 → 现状塘 → Parsons 与自主规划方案</p></div><div class="actions"><a class="btn" href="/" target="_top">返回系统</a><a class="btn primary" href="${asset('actual_review_v2','comparison.csv')}">下载结果 CSV</a><button class="btn" onclick="window.print()">打印</button></div></header>
 <div class="context"><span>分析边界 <b>${fmt(data.scope.area_ha,2)} ha</b></span><span>计算时长 <b>48 h</b></span><span>模型 <b>${esc(data.solver)} · 一维</b></span><span>场景 <b>原模型外部入流 35,369 m³</b></span><span>更新 <b>${esc(data.updated.slice(0,16).replace('T',' '))} UTC</b></span></div>
 <div class="notice"><strong>${qualify?'计算已完成，数值质量尚未通过':'计算已完成'}</strong>采用相同入流与边界。${qualify?'动态波未收敛步比例超过 1% 筛查阈值；本页为未校准模型的计算输出。':''}二维淹没范围与成本最优性尚无有效结果。</div>
 <section id="comparisonMap" aria-label="真实地理位置的方案对比"></section>
 <details class="metrics-detail"><summary>展开五状态完整指标对照</summary><section class="panel"><div class="panel-heading"><div><h2>各状态计算结果</h2><p>L2 为 L1 加现状 pond；本边界内现状 pond 查询为 0，因此两列相同。增减量均相对 L2。</p></div><span class="pill">5 个状态 · 同源输入</span></div><div class="table-scroll"><table class="result-table"><thead><tr><th>评价指标</th>${states.map(s=>`<th data-col="${s.key}">${short[s.key]}${s.key.startsWith('B')?`<br>${Math.round(s.design.outlet_diameter_m*1000)} mm 出水管`:''}</th>`).join('')}</tr></thead><tbody>${metricRows}<tr><td>二维积水面积 / 历史点消失率</td><td colspan="5" class="no-data">未计算：本组结果尚未接入二维地表交换。不可用节点结果推算。</td></tr></tbody></table></div><div class="table-note">节点累计溢流包含节点地表蓄水；系统洪涝损失是离开一维系统的水量，两项不能混用。数值取自原始 RPT。</div></section></details>
 <div class="insights"><div class="insight"><strong>L1 → L2</strong><div class="numbers">0 m³</div><p>本边界未检索到现状 pond，本次没有现状塘的增量效果。</p></div><div class="insight"><strong>L2 → Parsons</strong><div class="numbers">${signed(aa.deltas.routing_flooding_loss_m3)} m³</div><p>系统洪涝损失变化；${aa.node_changes.resolved} 个节点不再报告溢流，${aa.node_changes.new} 个新增溢流节点。</p></div><div class="insight"><strong>L2 → 自主 B1 / B2</strong><div class="numbers">${states.filter(s=>s.key.startsWith('B')).map(s=>signed(s.deltas.routing_flooding_loss_m3)).join(' / ')} m³</div><p>两方案系统损失仅差 ${fmt(Math.abs(states[3].outputs.routing_flooding_loss_m3-states[4].outputs.routing_flooding_loss_m3))} m³，不能据此确认优劣。尚无成本排名。</p></div></div>
 <nav class="tabs" aria-label="结果视图"><button class="active" data-tab="plans" onclick="tab('plans')">方案与蓄水过程</button><button data-tab="quality" onclick="tab('quality')">质量与依据</button><button data-tab="files" onclick="tab('files')">运行文件</button></nav>
 <section id="plans"><div class="two"><article class="panel"><div class="panel-heading"><div><span class="eyebrow" id="schemeKey"></span><h2 id="schemeTitle"></h2></div></div><div class="scheme" id="scheme"></div></article><article class="panel"><div class="panel-heading"><div><h2>塘内蓄水过程</h2><p id="chartCaption">原始 SWMM OUT · 5 min 输出间隔 · 峰值为报告时刻采样值</p></div></div><div class="chart-row" style="grid-template-columns:1fr"><svg id="chart" viewBox="0 0 820 220" role="img" aria-label="塘内蓄水量随时间变化"></svg><div id="chartstats" class="chartstats" style="display:flex;flex-wrap:wrap;gap:10px 22px"></div></div></article></div></section>
 <section id="quality" class="hidden"><article class="panel"><div class="panel-heading"><h2>运行与数值质量</h2><span class="pill">完成运行 ≠ 通过数值筛查</span></div><div class="table-scroll"><table class="gap-table"><thead><tr><th>状态</th><th>连续性误差</th><th>未收敛步比例</th><th>错误 / 告警</th><th>数值筛查</th></tr></thead><tbody>${states.map(s=>`<tr><td>${short[s.key]}</td><td>${fmt(s.outputs.continuity_error_percent,3)}%</td><td>${fmt(s.outputs.steps_not_converging_percent,2)}%</td><td>${s.outputs.error_count} / ${s.outputs.warning_count}</td><td><span class="pill">${s.outputs.steps_not_converging_percent>1?'未通过 ≤ 1% 条件':'通过'}</span></td></tr>`).join('')}</tbody></table></div></article><div class="two" style="margin-top:16px"><article class="panel pad"><h3>模型输入与比较口径</h3><dl class="facts"><div><dt>时间窗口</dt><dd>原模型 2000-01-01 至 2000-01-03，为模型时间轴，不代表历史事件日期。</dd></div><div><dt>入流来源</dt><dd>${esc(data.scope.forcing)}</dd></div><div><dt>一致性核验</dt><dd>五状态 OPTIONS、入流时序、出水边界等内容哈希一致。</dd></div><div><dt>历史点</dt><dd>正式边界内 ${data.scope.historical_points_in_boundary} 个静态历史积水点，仅作空间参考；尚无本次事件观测对照。</dd></div><div><dt>库容归属</dt><dd>塘体只在一维 Storage 计容；本次未修改 DTM，未重复计算二维塘容。</dd></div></dl><p class="hash">统一输入 SHA256<br>${data.scope.forcing_sha256}</p></article><article class="panel pad"><h3>数据支持到哪里</h3>${data.limitations.map(x=>`<p class="small muted" style="margin-top:12px">${esc(x)}</p>`).join('')}<p class="small muted" style="margin-top:12px">道路中心线无相交不能证明用地与施工可行；管道走线仍需要道路面、地下设施与路权核验。</p></article></div><details><summary>本次修正记录</summary>${data.corrections.map(x=>`<p>${esc(x)}</p>`).join('')}<p>自主塘底采用 DTM 中位高程减 1 m，入口高位分流；真实地块不等于已经批准或建成的设施。</p></details></section>
 <section id="files" class="hidden"><div class="downloads">${states.map(s=>`<article class="panel download"><h3>${short[s.key]}</h3><p class="small muted">${esc(s.label)} · 实际求解输出</p>${['inp','rpt','out'].map(ext=>`<a href="${asset(s.source_dir,'Mussafah_00.'+ext)}">${ext.toUpperCase()} ${ext==='inp'?'模型输入':ext==='rpt'?'计算报告':'过程数据'}</a>`).join('')}<div class="hash">INP SHA256<br>${s.hashes.inp}</div></article>`).join('')}<article class="panel download"><h3>完整对比数据</h3><a href="${asset('actual_review_v2','Mussafah00_实际计算结果_v2.docx')}">结果报告 Word</a><a href="${asset('actual_review_v2','comparison.csv')}">指标 CSV</a><a href="${asset('actual_review_v2','node_comparison.csv')}">逐节点 CSV</a><a href="${asset('actual_review_v2','comparison.json')}">完整结果 JSON</a><a href="${asset('actual_review_v2','design.json')}">自主设计参数</a><a href="${asset('actual_review_v2','map_comparison.geojson')}">地图结果 GeoJSON</a><p class="small muted">包含方案几何、质量指标、塘水位过程、原始文件哈希。</p></article></div></section>
 <footer class="footer">数据版本 ${esc(data.version)} · 实际模拟结果，不代表实测观测或工程验收。旧版理想化试验不参与本页对比。</footer>`;
 mapWorkspace?.destroy();
 mapWorkspace=window.MussafahMap.mount(document.getElementById('comparisonMap'),data,mapData,selectState);
 selectState(selected);
}
function tab(name){for(const x of ['plans','quality','files'])document.getElementById(x).classList.toggle('hidden',name!==x);document.querySelectorAll('[data-tab]').forEach(el=>el.classList.toggle('active',el.dataset.tab===name));}
function selectState(key){selected=key;document.querySelectorAll('[data-state]').forEach(el=>el.classList.toggle('active',el.dataset.state===key));document.querySelectorAll('[data-col]').forEach(el=>el.classList.toggle('selected',el.dataset.col===key));drawMap();drawScheme();drawChart();}
function drawMap(){mapWorkspace?.setRightState(selected);}
function drawScheme(){
 const s=data.states.find(x=>x.key===selected),d=data.candidate;document.getElementById('schemeKey').textContent=short[selected];
 const facts=rows=>'<dl class="facts">'+rows.map(([a,b])=>`<div><dt>${a}</dt><dd>${b}</dd></div>`).join('')+'</dl>';
 if(selected.startsWith('B')){
 document.getElementById('schemeTitle').textContent=`真实地块 167073 · ${selected==='B1'?'小口径缓排':'增大出水能力'}`;
 document.getElementById('scheme').innerHTML=`<p class="lead">同一地块、同一塘体，比较 150 mm 与 300 mm 出水管；入口均为 450 mm 高位分流管，未设置泵。</p><div class="chain">CB4512 → 450 mm → OPT-B-167073<br>OPT-B-167073 → ${Math.round(s.design.outlet_diameter_m*1000)} mm → CB4513</div>${facts([['地块来源',`Makani · GISID ${d.gisid}`],['用地 / 状态','工业 / 展厅 · 未建设 · 已分配'],['塘体',`塘顶 2,500 m² · 深 1 m · 边坡 3H:1V`],['模型库容',`${fmt(s.pond.capacity_m3,3)} m³ · 21 点水深—面积曲线`],['塘顶 / 塘底',`${fmt(d.rim_m,3)} / ${fmt(d.bottom_m,3)} m（模型高程）`],['新建管线',`入 ${fmt(d.inlet_length_m,1)} m / 出 ${fmt(d.outlet_length_m,1)} m；拟定直线走线`]])}<h3>为何这样设计</h3><p>地块可容纳塘体及 5 m 内退；靠近既有节点，入口在上游井中高位分流，下游井底低于塘底，可利用水头重力排空。B1 限制出流以增加调蓄，B2 增大出流以比较退水与下游负荷。</p><p class="limit">${esc(d.constraints)}</p><p>本次相对 L2：${s.node_changes.resolved} 个节点不再报告溢流，${s.node_changes.new} 个节点新报告溢流；完整值可下载逐节点 CSV。</p>`;
 }else if(selected==='A'){

function drawChart(){const s=data.states.find(x=>x.key===selected),svg=document.getElementById('chart'),stats=document.getElementById('chartstats');if(!s.pond){svg.innerHTML='<text x="410" y="105" text-anchor="middle" fill="#6a7e94" font-size="15">该状态未加入调蓄塘</text>';stats.innerHTML='';return;}const a=s.pond.timeline,cap=s.pond.capacity_m3,max=Math.max(cap,...a.map(t=>t.volume_m3))*1.08;const px=t=>55+t/48*735,py=v=>185-v/max*160;let html='';for(let i=0;i<=4;i++){const v=max*i/4;html+=`<line x1="55" x2="790" y1="${py(v)}" y2="${py(v)}" stroke="#e3eaf2"/><text x="46" y="${py(v)+4}" text-anchor="end" fill="#708397" font-size="10">${fmt(v)}</text>`;}for(const t of [0,12,24,36,48])html+=`<text x="${px(t)}" y="207" text-anchor="middle" fill="#708397" font-size="11">${t} h</text>`;html+=`<line x1="55" x2="790" y1="${py(cap)}" y2="${py(cap)}" stroke="#a1b2c4" stroke-dasharray="4 4"/><path d="M ${a.map(t=>`${px(t.time_h)},${py(t.volume_m3)}`).join(' L ')}" fill="none" stroke="#247ab8" stroke-width="2.5"/><text x="55" y="13" fill="#708397" font-size="11">蓄水量 m³</text>`;svg.innerHTML=html;stats.innerHTML=`<div>峰值蓄水量<b>${fmt(s.pond.peak.volume_m3,1)} m³</b></div><div>库容利用率（采样峰值）<b>${fmt(s.pond.utilisation_percent,1)}%</b></div><div>48 h 末剩余蓄水<b>${fmt(s.pond.final.volume_m3,1)} m³</b></div><div>塘节点累计溢流<b>${fmt(s.pond.overflow_m3)} m³</b></div>`;}
async function readJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status===401?'请先在主系统登录。':`结果加载失败（${r.status}）`);return r.json();}
Promise.all([readJson(API),readJson(asset('actual_review_v2','map_comparison.geojson'))]).then(([d,g])=>{data=d;mapData=g;if(!d.states?.length)throw new Error('实际运行结果尚未生成。');if(!window.MussafahMap)throw new Error('地图组件未加载，请刷新页面。');if(g.metadata.source_version!==d.version||d.states.some(s=>['inp','rpt','out'].some(ext=>g.metadata.source_hashes[s.key]?.[ext]!==s.hashes[ext])))throw new Error('地图图层与计算结果版本不一致，请重新生成空间结果。');render();}).catch(e=>{document.getElementById('app').innerHTML=`<div class="panel error"><h2>无法读取结果</h2><p class="muted">${esc(e.message)}</p><p style="margin-top:15px"><a href="/" target="_top">打开主系统</a> · <button class="btn" onclick="location.reload()">重新加载</button></p></div>`;});
