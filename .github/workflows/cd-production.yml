# Production promotion is intentionally disabled. The previous workflow only
# printed hypothetical deployment commands and could claim success without a
# live staging deployment. Re-enable this workflow only after a verifier can
# bind immutable registry, live staging, migration, identity, health, and
# golden-slice evidence to the requested source revision.
name: CD - Production (Blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-gate:
    name: Require live staging evidence
    runs-on: ubuntu-latest
    steps:
      - name: Block unverified production promotion
        run: |
          echo "Production promotion is disabled: the live staging evidence verifier is not implemented." >&2
          echo "CI candidate evidence is not deployment evidence and cannot authorize production." >&2
          exit 1
