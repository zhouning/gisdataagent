# Production promotion is intentionally disabled. The previous workflow only
# printed hypothetical deployment commands and could claim success without a
# live staging deployment. A read-only live observation verifier now exists,
# and an independent OCI provenance verifier now exists, but neither can
# authorize production. Re-enable this workflow only after a protected runner
# attests live evidence and binds approval to the same source revision.
name: CD - Production (Blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-gate:
    name: Require attested live staging evidence
    runs-on: ubuntu-latest
    steps:
      - name: Block unverified production promotion
        run: |
          echo "Production promotion is disabled: no attested live staging evidence and same-revision approval have been verified." >&2
          echo "Candidate, registry, provenance, or live observation JSON alone cannot authorize production." >&2
          exit 1
