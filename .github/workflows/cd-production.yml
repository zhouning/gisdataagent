# Production promotion is intentionally disabled. The previous workflow only
# printed hypothetical deployment commands and could claim success without a
# live staging deployment. A read-only live observation verifier now exists,
# but it deliberately cannot authorize production. Re-enable this workflow
# only after a protected runner can attest that observation and bind approval
# to the same source revision.
name: CD - Production (Blocked)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-gate:
    name: Require attested live staging evidence
    runs-on: ubuntu-latest
    steps:
      - name: Block unverified production promotion
        run: |
          echo "Production promotion is disabled: protected staging provenance and artifact attestation are not implemented." >&2
          echo "Candidate or live observation JSON alone cannot authorize production." >&2
          exit 1
