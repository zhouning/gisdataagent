name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    # Keep the active lineage reviewable until ADR-035 promotes it to main.
    branches:
      - main
      - feat/v12-extensible-platform
      - feat/ar1-metadata-fabric-durable-backup-contract
      - feat/ar1-metadata-fabric-cross-cluster-recovery
      - feat/ar1-metadata-fabric-provider-metrics
      - feat/ar1-metadata-fabric-otel-metrics-pipeline
      - feat/ar1-metadata-fabric-otel-failure-rehearsal
      - feat/ar1-metadata-fabric-observability-gate
      - feat/ar1-metadata-fabric-network-policy-enforcement
      - feat/ar1-metadata-fabric-network-policy-readiness-gate
      - feat/ar1-metadata-fabric-ingestion-contract
      - feat/ar1-metadata-fabric-local-ingestion-replay
      - feat/ar1-metadata-fabric-binding-ledger
      - feat/ar1-metadata-fabric-openlineage-delivery
      - feat/ar1-metadata-fabric-provider-identity
      - feat/ar1-metadata-fabric-gravitino-identity
      - feat/ar1-metadata-fabric-identity-readiness-gate
      - feat/ar1-metadata-fabric-jdbc-catalog-restart
      - feat/ar1-metadata-fabric-spark-iceberg-rest-interoperability
      - feat/ar1-metadata-fabric-spark-object-store-interoperability
      - feat/ar1-metadata-fabric-object-store-readiness-gate
      - feat/ar1-metadata-fabric-spark-commit-failure-recovery
      - feat/ar1-metadata-fabric-spark-uncertain-commit-reconciliation
      - feat/ar1-metadata-fabric-active-metadata-outbox
      - feat/ar1-metadata-fabric-active-metadata-consumer
      - feat/ar1-metadata-fabric-active-metadata-authorization
      - feat/ar1-metadata-fabric-active-metadata-scheduler-delivery

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Platform Required Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gis_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libspatialindex-dev \
            postgresql-client \
            gdal-bin \
            libgdal-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate runtime dependency constraints
        run: python -m pytest tests/test_runtime_dependency_constraints.py -q

      - name: Validate migration catalog
        run: python -m data_agent.migration_runner validate

      - name: Validate platform configuration and runtime contracts
        run: python -m data_agent.platform_truth validate

      - name: Validate platform resource and run contracts
        run: python -m data_agent.platform_contracts validate

      - name: Validate legacy crosswalk and golden slice
        run: python -m data_agent.platform_crosswalk validate

      - name: Validate platform gateway boundary
        run: python -m data_agent.platform_gateway validate

      - name: Validate metadata fabric bridge boundary
        run: python -m data_agent.metadata_fabric_bridge validate

      - name: Validate metadata fabric foundation sandbox
        run: python -m data_agent.metadata_fabric_sandbox validate

      - name: Validate metadata fabric recovery rehearsal
        run: python -m data_agent.metadata_fabric_recovery_rehearsal validate

      - name: Validate metadata fabric backup repository
        run: python -m data_agent.metadata_fabric_backup_repository validate

      - name: Validate metadata fabric cross-cluster recovery
        run: python -m data_agent.metadata_fabric_cross_cluster_recovery validate

      - name: Validate metadata fabric provider metrics
        run: python -m data_agent.metadata_fabric_provider_metrics validate

      - name: Validate metadata fabric OTel metrics pipeline
        run: python -m data_agent.metadata_fabric_otel_metrics validate

      - name: Validate metadata fabric OTel failure rehearsal
        run: python -m data_agent.metadata_fabric_otel_failure_rehearsal validate

      - name: Validate metadata fabric production observability gate
        run: python -m data_agent.metadata_fabric_observability_gate validate

      - name: Validate metadata fabric NetworkPolicy enforcement contract
        run: python -m data_agent.metadata_fabric_network_policy_enforcement validate

      - name: Validate metadata fabric production NetworkPolicy gate
        run: python -m data_agent.metadata_fabric_network_policy_gate validate

      - name: Validate metadata fabric ingestion projection contract
        run: python -m data_agent.metadata_fabric_ingestion validate

      - name: Validate metadata fabric local ingestion replay evidence
        run: python -m data_agent.metadata_fabric_ingestion_replay validate

      - name: Validate metadata fabric binding ledger evidence
        run: python -m data_agent.metadata_fabric_binding_ledger validate

      - name: Validate metadata fabric OpenLineage delivery evidence
        run: python -m data_agent.metadata_fabric_lineage_delivery validate

      - name: Validate metadata fabric provider identity evidence
        run: python -m data_agent.metadata_fabric_provider_identity validate

      - name: Validate metadata fabric Gravitino identity evidence
        run: python -m data_agent.metadata_fabric_gravitino_identity validate

      - name: Validate metadata fabric production identity gate
        run: python -m data_agent.metadata_fabric_identity_gate validate

      - name: Validate metadata fabric Gravitino JDBC restart evidence
        run: python -m data_agent.metadata_fabric_gravitino_jdbc_restart validate

      - name: Validate metadata fabric Spark/Iceberg REST interoperability evidence
        run: python -m data_agent.metadata_fabric_spark_iceberg_rest_interoperability validate

      - name: Validate metadata fabric Spark/object-store interoperability evidence
        run: python -m data_agent.metadata_fabric_spark_object_store_interoperability validate

      - name: Validate metadata fabric production object-store gate
        run: python -m data_agent.metadata_fabric_object_store_gate validate

      - name: Validate metadata fabric Spark commit-failure recovery evidence
        run: python -m data_agent.metadata_fabric_spark_commit_failure_recovery validate

      - name: Validate metadata fabric Spark uncertain-commit reconciliation evidence
        run: python -m data_agent.metadata_fabric_spark_uncertain_commit_reconciliation validate

      - name: Validate metadata fabric Active Metadata outbox evidence
        run: python -m data_agent.metadata_fabric_active_metadata_outbox validate

      - name: Validate metadata fabric Active Metadata consumer evidence
        run: python -m data_agent.metadata_fabric_active_metadata_consumer validate

      - name: Validate metadata fabric Active Metadata authorization evidence
        run: python -m data_agent.metadata_fabric_active_metadata_authorization validate

      - name: Validate metadata fabric Active Metadata scheduler delivery evidence
        run: python -m data_agent.metadata_fabric_active_metadata_scheduler_delivery validate

      - name: Validate Active Metadata consumer deployment boundary
        run: python -m data_agent.active_metadata_consumer_deployment validate

      - name: Validate DolphinScheduler adapter boundary
        run: python -m data_agent.dolphinscheduler_adapter validate

      - name: Validate DolphinScheduler worker deployment boundary
        run: python -m data_agent.dolphinscheduler_worker_deployment validate

      - name: Verify platform control ledger on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
        run: python -m pytest data_agent/test_platform_control_ledger_postgres.py -q

      - name: Verify platform gateway role on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
        run: python -m pytest data_agent/test_platform_gateway_postgres.py -q

      - name: Verify metadata fabric binding ledger on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
        run: python -m pytest data_agent/test_metadata_fabric_binding_ledger_postgres.py -q

      - name: Verify metadata fabric OpenLineage delivery on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
        run: python -m pytest data_agent/test_metadata_fabric_lineage_delivery_postgres.py -q

      - name: Verify metadata fabric Active Metadata outbox on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
        run: python -m pytest data_agent/test_metadata_fabric_active_metadata_outbox_postgres.py -q

      - name: Verify Active Metadata consumer on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
        run: python -m pytest data_agent/test_active_metadata_consumer_postgres.py -q

      - name: Verify Active Metadata authorization on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
        run: python -m pytest data_agent/test_active_metadata_authorization_postgres.py -q

      - name: Run required platform tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gis_agent_test
          CHAINLIT_AUTH_SECRET: ci-test-secret-key-not-for-production
        run: |
          python -m pytest \
            data_agent/test_adk_compat.py \
            data_agent/test_arcpy_mcp_configuration.py \
            data_agent/test_auth.py \
            data_agent/test_dolphinscheduler_adapter.py \
            data_agent/test_dolphinscheduler_command_consumer.py \
            data_agent/test_dolphinscheduler_command_worker.py \
            data_agent/test_dolphinscheduler_worker_activation.py \
            data_agent/test_dolphinscheduler_worker_deployment.py \
            data_agent/test_frontend_api.py \
            data_agent/test_mcp_hub.py \
            data_agent/test_migration_authority_deployment.py \
            data_agent/test_migration_runner.py \
            data_agent/test_metadata_fabric_bridge.py \
            data_agent/test_metadata_fabric_live_evidence.py \
            data_agent/test_metadata_fabric_backup_repository.py \
            data_agent/test_metadata_fabric_cross_cluster_recovery.py \
            data_agent/test_metadata_fabric_observability_gate.py \
            data_agent/test_metadata_fabric_network_policy_enforcement.py \
            data_agent/test_metadata_fabric_network_policy_gate.py \
            data_agent/test_metadata_fabric_ingestion.py \
            data_agent/test_metadata_fabric_ingestion_replay.py \
            data_agent/test_metadata_fabric_binding_contract.py \
            data_agent/test_active_metadata_change_contract.py \
            data_agent/test_active_metadata_authorization.py \
            data_agent/test_active_metadata_consumer.py \
            data_agent/test_active_metadata_consumer_deployment.py \
            data_agent/test_active_metadata_consumer_worker.py \
            data_agent/test_metadata_fabric_active_metadata_outbox.py \
            data_agent/test_metadata_fabric_active_metadata_consumer.py \
            data_agent/test_metadata_fabric_active_metadata_authorization.py \
            data_agent/test_metadata_fabric_active_metadata_scheduler_delivery.py \
            data_agent/test_metadata_fabric_lineage_delivery.py \
            data_agent/test_metadata_fabric_provider_identity.py \
            data_agent/test_metadata_fabric_gravitino_identity.py \
            data_agent/test_metadata_fabric_identity_gate.py \
            data_agent/test_metadata_fabric_gravitino_jdbc_restart.py \
            data_agent/test_metadata_fabric_spark_iceberg_rest_interoperability.py \
            data_agent/test_metadata_fabric_spark_object_store_interoperability.py \
            data_agent/test_metadata_fabric_object_store_gate.py \
            data_agent/test_metadata_fabric_spark_commit_failure_recovery.py \
            data_agent/test_metadata_fabric_spark_uncertain_commit_reconciliation.py \
            data_agent/test_metadata_fabric_otel_failure_rehearsal.py \
            data_agent/test_metadata_fabric_otel_metrics.py \
            data_agent/test_metadata_fabric_provider_metrics.py \
            data_agent/test_metadata_fabric_recovery_rehearsal.py \
            data_agent/test_metadata_fabric_sandbox.py \
            data_agent/test_platform_authorization.py \
            data_agent/test_platform_contracts.py \
            data_agent/test_platform_crosswalk.py \
            data_agent/test_platform_gateway.py \
            data_agent/test_platform_truth.py \
            data_agent/test_route_registration.py \
            data_agent/test_s3_obs.py \
            data_agent/test_spatial_dataset_bundle.py \
            data_agent/test_staging_candidate_evidence.py \
            data_agent/test_staging_deployment_bundle.py \
            data_agent/test_staging_live_evidence.py \
            data_agent/test_staging_provenance_evidence.py \
            data_agent/test_staging_registry_evidence.py \
            data_agent/test_staging_release_evidence.py \
            --junitxml=test-results/platform-required.xml \
            -q

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-test-results
          path: test-results/

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  evaluate:
    name: Agent Evaluation (Full)
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libspatialindex-dev \
            gdal-bin \
            libgdal-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run multi-pipeline evaluation
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: us-central1
        run: |
          python data_agent/run_evaluation.py

      - name: Check evaluation results
        if: always()
        run: |
          python -c "
          import json, sys
          with open('data_agent/eval_results/eval_summary.json') as f:
              s = json.load(f)
          print(f'Passed: {s[\"total_passed\"]}/{s[\"total_tests\"]}')
          verdicts = s.get('pipeline_verdicts', {})
          thresholds = s.get('thresholds', {})
          for name, p in s['pipelines'].items():
              if p.get('status') in ('skipped', 'crashed'):
                  st = p['status'].upper()
              else:
                  rate = p.get('pass_rate', 0)
                  thr = thresholds.get(name, 0.6)
                  v = 'PASS' if verdicts.get(name, False) else 'FAIL'
                  st = f'{p.get(\"passed\",0)}/{p.get(\"total\",0)} ({rate:.0%} >= {thr:.0%} -> {v})'
              print(f'  {name}: {st}')
          if not s['overall_pass']:
              print('EVALUATION FAILED')
              sys.exit(1)
          "

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: data_agent/eval_results/

  route-eval:
    name: Route Evaluation Contract (PR)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libspatialindex-dev \
            gdal-bin \
            libgdal-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate route evaluation contracts without model credentials
        run: |
          python -m pytest \
            data_agent/test_adk_compat.py \
            data_agent/test_evaluation.py \
            --junitxml=route-eval-results/junit.xml \
            -q

      - name: Upload route evaluation contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-eval-contract-results
          path: route-eval-results/
          if-no-files-found: error
