# Validates a staging candidate, publishes that exact image to GHCR, and asks
# GitHub's OIDC attestation authority to sign the registry subject. This
# workflow does not deploy staging and cannot authorize production promotion.
name: Publish - Staging Candidate Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: staging-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-candidate:
    name: Validate candidate and publish attested image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libspatialindex-dev \
            postgresql-client \
            gdal-bin \
            libgdal-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Generate ephemeral candidate credentials
        run: |
          ADMIN_PASSWORD=$(openssl rand -hex 24)
          APP_PASSWORD=$(openssl rand -hex 24)
          AUTH_SECRET=$(openssl rand -hex 32)
          AWS_ACCESS_KEY=$(openssl rand -hex 16)
          AWS_SECRET_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$APP_PASSWORD"
          echo "::add-mask::$AUTH_SECRET"
          echo "::add-mask::$AWS_ACCESS_KEY"
          echo "::add-mask::$AWS_SECRET_KEY"
          {
            echo "CANDIDATE_ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "CANDIDATE_APP_PASSWORD=$APP_PASSWORD"
            echo "CANDIDATE_AUTH_SECRET=$AUTH_SECRET"
            echo "CANDIDATE_AWS_ACCESS_KEY=$AWS_ACCESS_KEY"
            echo "CANDIDATE_AWS_SECRET_KEY=$AWS_SECRET_KEY"
          } >> "$GITHUB_ENV"

      - name: Build and start the candidate database
        run: |
          docker build -t gis-postgis-pgvector:candidate docker/postgis-pgvector
          docker run --detach \
            --name gda-staging-candidate-postgres \
            --env POSTGRES_DB=gis_agent_staging \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD="$CANDIDATE_ADMIN_PASSWORD" \
            --publish 5432:5432 \
            gis-postgis-pgvector:candidate
          for _ in $(seq 1 60); do
            if docker exec \
                 --env PGPASSWORD="$CANDIDATE_ADMIN_PASSWORD" \
                 gda-staging-candidate-postgres \
                 pg_isready \
                   --host 127.0.0.1 \
                   --port 5432 \
                   --username postgres \
                   --dbname gis_agent_staging; then
              exit 0
            fi
            sleep 2
          done
          echo "candidate PostgreSQL did not become ready" >&2
          exit 1
      - name: Bootstrap database roles and extensions
        run: |
          docker exec -i \
            --env PGPASSWORD="$CANDIDATE_ADMIN_PASSWORD" \
            gda-staging-candidate-postgres \
            psql -v ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --port 5432 \
              --username postgres \
              --dbname gis_agent_staging \
              -v app_password="$CANDIDATE_APP_PASSWORD" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS postgis;
          CREATE EXTENSION IF NOT EXISTS vector;
          CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS ltree;
          CREATE ROLE agent_user LOGIN NOSUPERUSER NOBYPASSRLS PASSWORD :'app_password';
          GRANT CONNECT ON DATABASE gis_agent_staging TO agent_user;
          GRANT USAGE ON SCHEMA public TO agent_user;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO agent_user;
          ALTER DEFAULT PRIVILEGES FOR ROLE postgres IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO agent_user;
          SQL

      - name: Run the migration authority as database administrator
        run: |
          mkdir -p staging-candidate-evidence
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export POSTGRES_DATABASE=gis_agent_staging
          export POSTGRES_USER=postgres
          export POSTGRES_PASSWORD="$CANDIDATE_ADMIN_PASSWORD"
          python -m data_agent.migration_runner migrate \
            --output staging-candidate-evidence/schema-admin.json
          docker exec -i \
            --env PGPASSWORD="$CANDIDATE_ADMIN_PASSWORD" \
            gda-staging-candidate-postgres \
            psql -v ON_ERROR_STOP=1 \
              --host 127.0.0.1 \
              --port 5432 \
              --username postgres \
              --dbname gis_agent_staging \
              -c "GRANT gda_control_gateway TO agent_user"

      - name: Verify the ledger through the application role
        run: |
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export POSTGRES_DATABASE=gis_agent_staging
          export POSTGRES_USER=agent_user
          export POSTGRES_PASSWORD="$CANDIDATE_APP_PASSWORD"
          python -m data_agent.migration_runner status \
            --output staging-candidate-evidence/schema-app.json
          python -m data_agent.migration_runner compare \
            staging-candidate-evidence/schema-admin.json \
            staging-candidate-evidence/schema-app.json

      - name: Run required platform release tests
        run: |
          export DATABASE_URL="postgresql://postgres:${CANDIDATE_ADMIN_PASSWORD}@localhost:5432/gis_agent_staging"
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export POSTGRES_DATABASE=gis_agent_staging
          export POSTGRES_USER=postgres
          export POSTGRES_PASSWORD="$CANDIDATE_ADMIN_PASSWORD"
          export GDA_DEPLOYMENT_PROFILE=test
          export CHAINLIT_AUTH_SECRET="$CANDIDATE_AUTH_SECRET"
          python -m pytest \
            tests/test_runtime_dependency_constraints.py \
            data_agent/test_platform_control_ledger_postgres.py \
            data_agent/test_platform_gateway_postgres.py \
            data_agent/test_adk_compat.py \
            data_agent/test_arcpy_mcp_configuration.py \
            data_agent/test_auth.py \
            data_agent/test_dolphinscheduler_adapter.py \
            data_agent/test_dolphinscheduler_command_consumer.py \
            data_agent/test_dolphinscheduler_command_worker.py \
            data_agent/test_dolphinscheduler_worker_activation.py \
            data_agent/test_dolphinscheduler_worker_activation_admission.py \
            data_agent/test_dolphinscheduler_worker_deployment.py \
            data_agent/test_dolphinscheduler_worker_staging.py \
            data_agent/test_frontend_api.py \
            data_agent/test_mcp_hub.py \
            data_agent/test_migration_authority_deployment.py \
            data_agent/test_migration_runner.py \
            data_agent/test_metadata_fabric_bridge.py \
            data_agent/test_metadata_fabric_live_evidence.py \
            data_agent/test_metadata_fabric_recovery_rehearsal.py \
            data_agent/test_metadata_fabric_sandbox.py \
            data_agent/test_platform_authorization.py \
            data_agent/test_platform_contracts.py \
            data_agent/test_platform_crosswalk.py \
            data_agent/test_platform_gateway.py \
            data_agent/test_platform_truth.py \
            data_agent/test_route_registration.py \
            data_agent/test_s3_obs.py \
            data_agent/test_staging_candidate_evidence.py \
            data_agent/test_staging_deployment_bundle.py \
            data_agent/test_staging_dolphinscheduler_worker_activation_workflow.py \
            data_agent/test_staging_dolphinscheduler_worker_workflow.py \
            data_agent/test_staging_live_evidence.py \
            data_agent/test_staging_provenance_evidence.py \
            data_agent/test_staging_registry_evidence.py \
            data_agent/test_staging_release_evidence.py \
            --junitxml=staging-candidate-evidence/junit.xml \
            -q --tb=short

      - name: Re-verify the application ledger after tests
        run: |
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export POSTGRES_DATABASE=gis_agent_staging
          export POSTGRES_USER=agent_user
          export POSTGRES_PASSWORD="$CANDIDATE_APP_PASSWORD"
          python -m data_agent.migration_runner status \
            --output staging-candidate-evidence/schema-app.json
          python -m data_agent.migration_runner compare \
            staging-candidate-evidence/schema-admin.json \
            staging-candidate-evidence/schema-app.json

      - name: Export strict redacted staging platform snapshot
        run: |
          export DATABASE_URL="postgresql://agent_user:${CANDIDATE_APP_PASSWORD}@localhost:5432/gis_agent_staging"
          export POSTGRES_HOST=localhost
          export POSTGRES_PORT=5432
          export POSTGRES_DATABASE=gis_agent_staging
          export POSTGRES_USER=agent_user
          export POSTGRES_PASSWORD="$CANDIDATE_APP_PASSWORD"
          export CHAINLIT_AUTH_SECRET="$CANDIDATE_AUTH_SECRET"
          export CLOUD_STORAGE_PROVIDER=aws
          export AWS_ACCESS_KEY_ID="$CANDIDATE_AWS_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$CANDIDATE_AWS_SECRET_KEY"
          export AWS_S3_BUCKET=gis-agent-staging-candidate
          export OLLAMA_API_BASE=https://model-gateway.staging-candidate.invalid
          python -m data_agent.platform_truth snapshot \
            --profile staging \
            --output staging-candidate-evidence/platform.json

      - name: Set up Docker Buildx with shared layer cache
        uses: docker/setup-buildx-action@v3

      - name: Build the application candidate image
        run: |
          docker buildx build \
            --load \
            --cache-from type=gha,scope=gda-staging-candidate \
            --cache-to type=gha,mode=max,scope=gda-staging-candidate \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "gis-data-agent:${GITHUB_SHA}" .
          IMAGE_ID=$(docker image inspect \
            --format '{{.Id}}' "gis-data-agent:${GITHUB_SHA}")
          echo "CANDIDATE_IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"

      - name: Generate non-promotion candidate evidence
        run: |
          python -m data_agent.staging_candidate_evidence validate \
            --schema-report staging-candidate-evidence/schema-app.json \
            --platform-snapshot staging-candidate-evidence/platform.json \
            --junit staging-candidate-evidence/junit.xml \
            --source-revision "$GITHUB_SHA" \
            --image-id "$CANDIDATE_IMAGE_ID" \
            --output staging-candidate-evidence/candidate.json

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push exact candidate image and resolve registry digest
        id: registry
        run: |
          set -euo pipefail
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGGED_IMAGE="${REPOSITORY}:${GITHUB_SHA}"
          docker tag "gis-data-agent:${GITHUB_SHA}" "$TAGGED_IMAGE"
          for attempt in 1 2 3; do
            if docker push "$TAGGED_IMAGE"; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "candidate image push failed after 3 attempts" >&2
              exit 1
            fi
            echo "candidate image push failed; retrying after backoff" >&2
            sleep "$((attempt * 15))"
          done

          MANIFEST_FILE=$(mktemp)
          docker buildx imagetools inspect \
            "$TAGGED_IMAGE" --raw > "$MANIFEST_FILE"
          DIGEST="sha256:$(sha256sum "$MANIFEST_FILE" | awk '{print $1}')"
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry did not return a canonical sha256 manifest digest" >&2
            exit 1
          fi
          docker buildx imagetools inspect "${REPOSITORY}@${DIGEST}" >/dev/null
          {
            echo "repository=$REPOSITORY"
            echo "digest=$DIGEST"
            echo "image=${REPOSITORY}@${DIGEST}"
          } >> "$GITHUB_OUTPUT"

      - name: Bind candidate evidence to registry subject
        run: |
          EXPECTED_REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}"
          python -m data_agent.staging_registry_evidence validate \
            --candidate-evidence staging-candidate-evidence/candidate.json \
            --source-revision "$GITHUB_SHA" \
            --local-image-id "$CANDIDATE_IMAGE_ID" \
            --repository "${{ steps.registry.outputs.repository }}" \
            --digest "${{ steps.registry.outputs.digest }}" \
            --expected-repository "$EXPECTED_REPOSITORY" \
            --output staging-candidate-evidence/registry.json

      - name: Attest registry image provenance with GitHub OIDC
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.registry.outputs.repository }}
          subject-digest: ${{ steps.registry.outputs.digest }}
          push-to-registry: true

      - name: Upload registry binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-registry-evidence-${{ github.sha }}
          path: staging-candidate-evidence/registry.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload candidate evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-candidate-evidence-${{ github.sha }}
          path: |
            staging-candidate-evidence/candidate.json
            staging-candidate-evidence/platform.json
            staging-candidate-evidence/schema-admin.json
            staging-candidate-evidence/schema-app.json
          if-no-files-found: error
          retention-days: 30

  candidate-summary:
    name: Candidate boundary summary
    needs: validate-candidate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report validated candidate boundary
        if: needs.validate-candidate.result == 'success'
        run: |
          echo "Candidate validation and attested registry publication passed."
          echo "No staging deployment was performed."
          echo "Production promotion remains blocked pending protected verification and live staging evidence."

      - name: Preserve candidate validation failure
        if: needs.validate-candidate.result != 'success'
        run: |
          echo "Candidate validation failed; no deployment or promotion is allowed." >&2
          exit 1
