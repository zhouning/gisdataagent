  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text class="" x="70" y="70" font-size="38" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="70" dy="0">GIS Data Agent 总体技术架构</tspan></text><text class="" x="70" y="110" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="70" dy="0">模型负责决策，专业工具负责计算，独立代码负责审核与证据</tspan></text><line x1="70" y1="132" x2="1530" y2="132" stroke="#D5DEE2" stroke-width="2"/><rect x="70" y="160" width="300" height="105" rx="8" fill="#E7F5F5" stroke="#087E8B" stroke-width="2.5"/><rect x="70" y="160" width="8" height="105" rx="4" fill="#087E8B"/><text class="" x="96" y="199" font-size="25" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="96" dy="0">用户目标</tspan></text><text class="" x="96" y="230" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="96" dy="0">自然语言问题</tspan><tspan x="96" dy="30">显式 @ 路由</tspan></text><rect x="450" y="160" width="480" height="105" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="450" y="160" width="8" height="105" rx="4" fill="#1976D2"/><text class="" x="476" y="199" font-size="25" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="476" dy="0">@NL2SQL</tspan></text><text class="" x="476" y="230" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="476" dy="0">高频空间问数</tspan><tspan x="476" dy="30">Gemma 4 合成 GeoSQL</tspan></text><rect x="1010" y="160" width="520" height="105" rx="8" fill="#F2EEFA" stroke="#6950A1" stroke-width="2.5"/><rect x="1010" y="160" width="8" height="105" rx="4" fill="#6950A1"/><text class="" x="1036" y="199" font-size="25" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="1036" dy="0">@WorldModelV21</tspan></text><text class="" x="1036" y="230" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="1036" dy="0">县域空间优化</tspan><tspan x="1036" dy="30">Gemma 4 动态选择下一工具</tspan></text><line x1="370" y1="212" x2="450" y2="212" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="370,225 410,225 410,145 1270,145 1270,160" fill="none" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="315" width="1460" height="125" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="70" y="315" width="8" height="125" rx="4" fill="#1976D2"/><text class="" x="800" y="354" font-size="29" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">Gemma 4 26B 决策面</tspan></text><text class="" x="800" y="385" font-size="22" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="800" dy="0">意图理解  ·  GeoSQL 合成  ·  工具选择  ·  根据反馈停止 / 恢复 / 提交</tspan></text><line x1="690" y1="265" x2="690" y2="315" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1270" y1="265" x2="1270" y2="315" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="490" width="1460" height="120" rx="8" fill="#E7F5F5" stroke="#087E8B" stroke-width="2.5"/><rect x="70" y="490" width="8" height="120" rx="4" fill="#087E8B"/><text class="" x="800" y="529" font-size="29" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">Google ADK 运行时</tspan></text><text class="" x="800" y="560" font-size="22" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="800" dy="0">LlmAgent / BaseAgent  ·  10 个函数工具  ·  session / event  ·  function_call / function_response</tspan></text><line x1="800" y1="440" x2="800" y2="490" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="660" width="700" height="135" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5"/><rect x="70" y="660" width="8" height="135" rx="4" fill="#1976D2"/><text class="" x="96" y="699" font-size="25" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="96" dy="0">NL2Semantic2GeoSQL 行动面</tspan></text><text class="" x="96" y="730" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="96" dy="0">Semantic Layer + GeoSQL Harness</tspan><tspan x="96" dy="30">PostGIS 只读执行 + 三层地图证据</tspan></text><rect x="830" y="660" width="700" height="135" rx="8" fill="#FFFFFF" stroke="#6950A1" stroke-width="2.5"/><rect x="830" y="660" width="8" height="135" rx="4" fill="#6950A1"/><text class="" x="856" y="699" font-size="25" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="856" dy="0">县域耕地空间优化行动面</tspan></text><text class="" x="856" y="730" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="856" dy="0">Transition Ensemble + ONNX Runtime</tspan><tspan x="856" dy="30">MPC + 真实县域环境执行</tspan></text><line x1="530" y1="610" x2="420" y2="660" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1070" y1="610" x2="1180" y2="660" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="845" width="1460" height="105" rx="8" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2.5"/><rect x="70" y="845" width="8" height="105" rx="4" fill="#2E7D32"/><text class="" x="800" y="884" font-size="28" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">治理与证据面</tspan></text><text class="" x="800" y="915" font-size="21" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="800" dy="0">版本兼容  ·  SQL 安全  ·  硬约束校验  ·  Verified Episodic Memory  ·  Map / Trace / PDF</tspan></text><line x1="420" y1="795" x2="420" y2="845" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1180" y1="795" x2="1180" y2="845" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/>
</svg>