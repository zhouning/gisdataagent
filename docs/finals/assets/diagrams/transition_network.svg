<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="970" viewBox="0 0 1600 970" role="img" aria-label="237K 参数状态转移网络结构">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8CA0A8"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1600" height="970" fill="#FFFFFF"/>
  <text class="" x="70" y="70" font-size="38" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="70" dy="0">状态转移模型成员结构</tspan></text><text class="" x="70" y="110" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="70" dy="0">每个成员约 237K 参数；3 个独立成员导出 ONNX 并在 CPU 上批量推理</tspan></text><line x1="70" y1="132" x2="1530" y2="132" stroke="#D5DEE2" stroke-width="2"/><rect x="70" y="205" width="270" height="120" rx="8" fill="#E7F5F5" stroke="#087E8B" stroke-width="2.5"/><rect x="70" y="205" width="8" height="120" rx="4" fill="#087E8B"/><text class="" x="205" y="244" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="205" dy="0">Block 状态</tspan></text><text class="" x="205" y="275" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="205" dy="0">2,640 × 17</tspan></text><rect x="70" y="410" width="270" height="120" rx="8" fill="#FFF5E5" stroke="#A86200" stroke-width="2.5"/><rect x="70" y="410" width="8" height="120" rx="4" fill="#A86200"/><text class="" x="205" y="449" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="205" dy="0">行动索引</tspan></text><text class="" x="205" y="480" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="205" dy="0">Discrete(n_blocks)</tspan></text><rect x="70" y="615" width="270" height="120" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="70" y="615" width="8" height="120" rx="4" fill="#1976D2"/><text class="" x="205" y="654" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="205" dy="0">县域全局状态</tspan></text><text class="" x="205" y="685" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="205" dy="0">12 维</tspan></text><rect x="425" y="185" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#087E8B" stroke-width="2.5"/><rect x="425" y="185" width="8" height="150" rx="4" fill="#087E8B"/><text class="" x="575" y="224" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="575" dy="0">共享 Block Encoder</tspan></text><text class="" x="575" y="255" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="575" dy="0">17 → 64 → 32</tspan><tspan x="575" dy="29">所有 blocks 共享权重</tspan></text><rect x="425" y="395" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#A86200" stroke-width="2.5"/><rect x="425" y="395" width="8" height="150" rx="4" fill="#A86200"/><text class="" x="575" y="434" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="575" dy="0">Action Embedding</tspan></text><text class="" x="575" y="465" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="575" dy="0">n_blocks → 32</tspan><tspan x="575" dy="29">选择目标 block</tspan></text><rect x="425" y="605" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5"/><rect x="425" y="605" width="8" height="150" rx="4" fill="#1976D2"/><text class="" x="575" y="644" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="575" dy="0">Global Encoder</tspan></text><text class="" x="575" y="675" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="575" dy="0">12 → 64 → 32</tspan></text><line x1="340" y1="265" x2="425" y2="265" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="340" y1="470" x2="425" y2="470" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="340" y1="675" x2="425" y2="675" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="795" y="235" width="310" height="120" rx="8" fill="#E7F5F5" stroke="#087E8B" stroke-width="2.5"/><rect x="795" y="235" width="8" height="120" rx="4" fill="#087E8B"/><text class="" x="950" y="274" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="950" dy="0">Mean Pooling</tspan></text><text class="" x="950" y="305" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="950" dy="0">所有 block 编码 → 32</tspan></text><rect x="795" y="440" width="310" height="180" rx="8" fill="#F2EEFA" stroke="#6950A1" stroke-width="2.5"/><rect x="795" y="440" width="8" height="180" rx="4" fill="#6950A1"/><text class="" x="950" y="479" font-size="25" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="950" dy="0">Context 拼接</tspan></text><text class="" x="950" y="510" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="950" dy="0">selected block 32</tspan><tspan x="950" dy="29">+ action 32 + global 32</tspan><tspan x="950" dy="29">+ mean pool 32 = 128</tspan></text><line x1="725" y1="260" x2="795" y2="295" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="725,315 755,315 755,480 795,480" fill="none" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="785" y="380" font-size="17" font-weight="600" fill="#8CA0A8" text-anchor="middle"><tspan x="785" dy="0">selected</tspan></text><polyline points="725,470 760,470 760,520 795,520" fill="none" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="725,680 760,680 760,560 795,560" fill="none" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="950" y1="355" x2="950" y2="440" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1180" y="190" width="350" height="135" rx="8" fill="#E7F5F5" stroke="#087E8B" stroke-width="2.5"/><rect x="1180" y="190" width="8" height="135" rx="4" fill="#087E8B"/><text class="" x="1355" y="229" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1355" dy="0">Block Delta Head</tspan></text><text class="" x="1355" y="260" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1355" dy="0">128 → 256 → 256 → 17</tspan></text><line x1="1105" y1="530" x2="1180" y2="258" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1180" y="390" width="350" height="135" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="1180" y="390" width="8" height="135" rx="4" fill="#1976D2"/><text class="" x="1355" y="429" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1355" dy="0">Global Delta Head</tspan></text><text class="" x="1355" y="460" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1355" dy="0">128 → 256 → 12</tspan></text><line x1="1105" y1="530" x2="1180" y2="458" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1180" y="590" width="350" height="135" rx="8" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2.5"/><rect x="1180" y="590" width="8" height="135" rx="4" fill="#2E7D32"/><text class="" x="1355" y="629" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1355" dy="0">Reward Head</tspan></text><text class="" x="1355" y="660" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1355" dy="0">128 → 64 → 1</tspan></text><line x1="1105" y1="530" x2="1180" y2="658" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="300" y="830" width="1000" height="95" rx="8" fill="#F4F7F8" stroke="#6950A1" stroke-width="2.5"/><rect x="300" y="830" width="8" height="95" rx="4" fill="#6950A1"/><text class="" x="800" y="886.5" font-size="26" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">3-member Ensemble → ONNX Runtime → MPC 批量评估候选行动</tspan></text>
</svg>