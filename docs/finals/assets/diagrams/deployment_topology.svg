<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="GIS Data Agent 决赛运行和部署拓扑">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8CA0A8"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text class="" x="70" y="70" font-size="38" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="70" dy="0">决赛运行与部署拓扑</tspan></text><text class="" x="70" y="110" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="70" dy="0">核心服务本地或内网部署；模型、数据、算法资源与用户产物边界清晰</tspan></text><line x1="70" y1="132" x2="1530" y2="132" stroke="#D5DEE2" stroke-width="2"/><rect x="70" y="330" width="270" height="145" rx="8" fill="#E7F5F5" stroke="#087E8B" stroke-width="2.5"/><rect x="70" y="330" width="8" height="145" rx="4" fill="#087E8B"/><text class="" x="205" y="369" font-size="25" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="205" dy="0">现场浏览器</tspan></text><text class="" x="205" y="400" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="205" dy="0">PPT / Demo 操作端</tspan><tspan x="205" dy="29">HTTP :8000</tspan></text><rect x="410" y="170" width="1110" height="650" rx="8" fill="#F4F7F8" stroke="#AFC0C7" stroke-width="2.5" stroke-dasharray="12 8"/><text class="" x="445" y="215" font-size="28" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="445" dy="0">Docker Compose / 内网运行边界</tspan></text><rect x="465" y="295" width="380" height="210" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="465" y="295" width="8" height="210" rx="4" fill="#1976D2"/><text class="" x="655" y="334" font-size="26" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="655" dy="0">GIS Data Agent App</tspan></text><text class="" x="655" y="365" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="655" dy="0">Chainlit + API</tspan><tspan x="655" dy="29">Google ADK 运行时</tspan><tspan x="655" dy="29">用户与运行目录隔离</tspan></text><line x1="340" y1="402" x2="465" y2="402" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="402" y="372" font-size="17" font-weight="600" fill="#8CA0A8" text-anchor="middle"><tspan x="402" dy="0">请求 / 地图 / 报告</tspan></text><rect x="930" y="260" width="250" height="125" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5"/><rect x="930" y="260" width="8" height="125" rx="4" fill="#1976D2"/><text class="" x="1055" y="299" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1055" dy="0">Gemma 4 / Ollama</tspan></text><text class="" x="1055" y="330" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1055" dy="0">本地模型服务</tspan></text><rect x="1225" y="260" width="240" height="125" rx="8" fill="#FFFFFF" stroke="#087E8B" stroke-width="2.5"/><rect x="1225" y="260" width="8" height="125" rx="4" fill="#087E8B"/><text class="" x="1345" y="299" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1345" dy="0">PostGIS</tspan></text><text class="" x="1345" y="330" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1345" dy="0">只读空间查询</tspan><tspan x="1345" dy="28">:5432</tspan></text><rect x="930" y="440" width="250" height="125" rx="8" fill="#FFFFFF" stroke="#A86200" stroke-width="2.5"/><rect x="930" y="440" width="8" height="125" rx="4" fill="#A86200"/><text class="" x="1055" y="479" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1055" dy="0">Redis</tspan></text><text class="" x="1055" y="510" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1055" dy="0">会话与运行状态</tspan><tspan x="1055" dy="28">:6379</tspan></text><rect x="1225" y="440" width="240" height="125" rx="8" fill="#FFFFFF" stroke="#60727A" stroke-width="2.5"/><rect x="1225" y="440" width="8" height="125" rx="4" fill="#60727A"/><text class="" x="1345" y="479" font-size="21" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1345" dy="0">MinIO（可选）</tspan></text><text class="" x="1345" y="510" font-size="17" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1345" dy="0">对象存储扩展</tspan><tspan x="1345" dy="27">非主 Demo 依赖</tspan></text><line x1="845" y1="350" x2="930" y2="322" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="845,375 885,375 885,235 1345,235 1345,260" fill="none" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="845" y1="425" x2="930" y2="502" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="845,450 885,450 885,590 1345,590 1345,565" fill="none" stroke="#8CA0A8" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/><rect x="465" y="610" width="310" height="140" rx="8" fill="#F2EEFA" stroke="#6950A1" stroke-width="2.5"/><rect x="465" y="610" width="8" height="140" rx="4" fill="#6950A1"/><text class="" x="620" y="649" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="620" dy="0">只读算法资源</tspan></text><text class="" x="620" y="680" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="620" dy="0">0.3.3 / 2.2.3 包</tspan><tspan x="620" dy="28">Bishan prepared + ONNX</tspan></text><rect x="835" y="610" width="310" height="140" rx="8" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2.5"/><rect x="835" y="610" width="8" height="140" rx="4" fill="#2E7D32"/><text class="" x="990" y="649" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="990" dy="0">按用户隔离的产物</tspan></text><text class="" x="990" y="680" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="990" dy="0">uploads / output</tspan><tspan x="990" dy="28">Map / Audit / PDF</tspan></text><rect x="1205" y="610" width="260" height="140" rx="8" fill="#FCECEF" stroke="#C33C54" stroke-width="2.5"/><rect x="1205" y="610" width="8" height="140" rx="4" fill="#C33C54"/><text class="" x="1335" y="649" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1335" dy="0">预检与健康检查</tspan></text><text class="" x="1335" y="680" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1335" dy="0">版本 · 模型 · 数据</tspan><tspan x="1335" dy="28">app / db / redis</tspan></text><line x1="620" y1="610" x2="620" y2="505" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="790" y1="505" x2="935" y2="610" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1205,680 1175,680 1175,785 430,785 430,475 465,475" fill="none" stroke="#C33C54" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text class="" x="800" y="776" font-size="17" font-weight="600" fill="#C33C54" text-anchor="middle"><tspan x="800" dy="0">启动前</tspan></text><rect x="260" y="865" width="1080" height="75" rx="8" fill="#FCECEF" stroke="#C33C54" stroke-width="2.5"/><rect x="260" y="865" width="8" height="75" rx="4" fill="#C33C54"/><text class="" x="800" y="911.5" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">失败策略：版本、模型、数据或核心服务预检不通过时停止，不在现场临时降级</tspan></text>
</svg>