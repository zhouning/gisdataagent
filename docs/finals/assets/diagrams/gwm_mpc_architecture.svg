<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="地理空间世界模型原型、MPC 和审核记忆的关系">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8CA0A8"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text class="" x="70" y="70" font-size="38" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="70" dy="0">领域化 GWM 原型与 MPC 的严格关系</tspan></text><text class="" x="70" y="110" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="70" dy="0">学习型状态转移模型是动力学内核；MPC 消费模型预测，但不是世界模型本身</tspan></text><line x1="70" y1="132" x2="1530" y2="132" stroke="#D5DEE2" stroke-width="2"/><rect x="430" y="155" width="740" height="105" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="430" y="155" width="8" height="105" rx="4" fill="#1976D2"/><text class="" x="800" y="194" font-size="27" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">Gemma 4 + Google ADK 任务级控制</tspan></text><text class="" x="800" y="225" font-size="20" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="800" dy="0">理解目标 · 选择工具 · 根据反馈停止 / 恢复 / 提交</tspan></text><rect x="70" y="305" width="840" height="420" rx="8" fill="#F2EEFA" stroke="#6950A1" stroke-width="3" stroke-dasharray="12 8"/><text class="" x="105" y="350" font-size="29" font-weight="700" fill="#6950A1" text-anchor="start"><tspan x="105" dy="0">GWM 动力学内核</tspan></text><rect x="110" y="405" width="300" height="130" rx="8" fill="#FFFFFF" stroke="#087E8B" stroke-width="2.5"/><rect x="110" y="405" width="8" height="130" rx="4" fill="#087E8B"/><text class="" x="260" y="444" font-size="24" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="260" dy="0">状态 S</tspan></text><text class="" x="260" y="475" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="260" dy="0">2,640 blocks × 17 维</tspan><tspan x="260" dy="28">县域全局 12 维</tspan></text><rect x="110" y="575" width="300" height="105" rx="8" fill="#FFFFFF" stroke="#A86200" stroke-width="2.5"/><rect x="110" y="575" width="8" height="105" rx="4" fill="#A86200"/><text class="" x="260" y="614" font-size="24" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="260" dy="0">行动 A</tspan></text><text class="" x="260" y="645" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="260" dy="0">选择可行 block</tspan><tspan x="260" dy="28">执行 paired swaps</tspan></text><rect x="500" y="440" width="355" height="190" rx="8" fill="#FFFFFF" stroke="#6950A1" stroke-width="2.5"/><rect x="500" y="440" width="8" height="190" rx="4" fill="#6950A1"/><text class="" x="677.5" y="479" font-size="25" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="677.5" dy="0">转移模型集成 Tθ</tspan></text><text class="" x="677.5" y="510" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="677.5" dy="0">3 个独立 ONNX 成员</tspan><tspan x="677.5" dy="29">预测 next state</tspan><tspan x="677.5" dy="29">预测 reward</tspan></text><line x1="410" y1="470" x2="500" y2="500" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="455" y="462" font-size="17" font-weight="600" fill="#8CA0A8" text-anchor="middle"><tspan x="455" dy="0">s</tspan></text><line x1="410" y1="625" x2="500" y2="575" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="455" y="630" font-size="17" font-weight="600" fill="#8CA0A8" text-anchor="middle"><tspan x="455" dy="0">a</tspan></text><rect x="1000" y="335" width="500" height="145" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="1000" y="335" width="8" height="145" rx="4" fill="#1976D2"/><text class="" x="1250" y="374" font-size="27" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1250" dy="0">MPC 规划器</tspan></text><text class="" x="1250" y="405" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1250" dy="0">在模型上比较候选 rollout</tspan><tspan x="1250" dy="29">只执行预测回报最高方案的第一步</tspan></text><line x1="855" y1="500" x2="1000" y2="420" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="927.5" y="438" font-size="17" font-weight="600" fill="#8CA0A8" text-anchor="middle"><tspan x="927.5" dy="0">ŝ' , r̂</tspan></text><rect x="1000" y="535" width="500" height="145" rx="8" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2.5"/><rect x="1000" y="535" width="8" height="145" rx="4" fill="#2E7D32"/><text class="" x="1250" y="574" font-size="27" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1250" dy="0">真实县域环境</tspan></text><text class="" x="1250" y="605" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1250" dy="0">执行行动并重新观测</tspan><tspan x="1250" dy="29">产生真实 reward 与空间产物</tspan></text><line x1="1250" y1="480" x2="1250" y2="535" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="1355" y="516" font-size="17" font-weight="600" fill="#8CA0A8" text-anchor="middle"><tspan x="1355" dy="0">首个行动</tspan></text><polyline points="1000,610 940,610 940,760 260,760 260,535" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="610" y="750" font-size="17" font-weight="600" fill="#2E7D32" text-anchor="middle"><tspan x="610" dy="0">真实观测形成下一状态</tspan></text><rect x="100" y="820" width="650" height="115" rx="8" fill="#FCECEF" stroke="#C33C54" stroke-width="2.5"/><rect x="100" y="820" width="8" height="115" rx="4" fill="#C33C54"/><text class="" x="425" y="859" font-size="25" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="425" dy="0">独立硬约束校验</tspan></text><text class="" x="425" y="890" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="425" dy="0">面积不减少 · 坡度下降 · 连片度提升 · 产物完整</tspan></text><rect x="850" y="820" width="650" height="115" rx="8" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2.5"/><rect x="850" y="820" width="8" height="115" rx="4" fill="#2E7D32"/><text class="" x="1175" y="859" font-size="25" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1175" dy="0">Verified Episodic Memory</tspan></text><text class="" x="1175" y="890" font-size="19" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1175" dy="0">仅通过校验的运行经验可保存并被下次召回</tspan></text><polyline points="1250,680 1250,790 800,790 800,878 750,878" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="1015" y="780" font-size="17" font-weight="600" fill="#2E7D32" text-anchor="middle"><tspan x="1015" dy="0">真实结果与空间产物</tspan></text><line x1="750" y1="878" x2="850" y2="878" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="800" y="860" font-size="17" font-weight="600" fill="#8CA0A8" text-anchor="middle"><tspan x="800" dy="0">通过后提交</tspan></text><polyline points="1175,820 1540,820 1540,210 1170,210" fill="none" stroke="#2E7D32" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/><text class="" x="1370" y="198" font-size="17" font-weight="600" fill="#2E7D32" text-anchor="middle"><tspan x="1370" dy="0">下一任务召回</tspan></text>
</svg>