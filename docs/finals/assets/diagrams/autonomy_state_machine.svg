<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-label="受控自主决策状态机">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8CA0A8"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#FFFFFF"/>
  <text class="" x="70" y="70" font-size="38" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="70" dy="0">受控自主决策状态机</tspan></text><text class="" x="70" y="110" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="70" dy="0">自主性体现在观察、选择、反馈后恢复或停止；权限边界由代码强制执行</tspan></text><line x1="70" y1="132" x2="1530" y2="132" stroke="#D5DEE2" stroke-width="2"/><rect x="695" y="155" width="210" height="38" rx="19" fill="#F4F7F8" stroke="#17313A" stroke-width="1.5"/><text class="" x="800" y="180" font-size="21" font-weight="600" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">START</tspan></text><rect x="550" y="230" width="500" height="95" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><rect x="550" y="230" width="8" height="95" rx="4" fill="#1976D2"/><text class="" x="800" y="286.5" font-size="24" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">检查版本、能力与资源</tspan></text><line x1="800" y1="193" x2="800" y2="230" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polygon points="800,337.5 995,390 800,442.5 605,390" fill="#FFF5E5" stroke="#A86200" stroke-width="2.5"/><text class="" x="800" y="397" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">版本与资源可用？</tspan></text><line x1="800" y1="325" x2="800" y2="338" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1125" y="340" width="370" height="100" rx="8" fill="#FCECEF" stroke="#C33C54" stroke-width="2.5"/><rect x="1125" y="340" width="8" height="100" rx="4" fill="#C33C54"/><text class="" x="1310" y="379" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1310" dy="0">停止并报告缺口</tspan></text><text class="" x="1310" y="410" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1310" dy="0">不自动降级旧算法</tspan></text><line x1="995" y1="390" x2="1125" y2="390" stroke="#C33C54" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="1060" y="375" font-size="17" font-weight="600" fill="#C33C54" text-anchor="middle"><tspan x="1060" dy="0">否</tspan></text><rect x="550" y="485" width="500" height="95" rx="8" fill="#E7F5F5" stroke="#087E8B" stroke-width="2.5"/><rect x="550" y="485" width="8" height="95" rx="4" fill="#087E8B"/><text class="" x="800" y="541.5" font-size="24" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">召回已验证经验</tspan></text><line x1="800" y1="443" x2="800" y2="485" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="835" y="472" font-size="17" font-weight="600" fill="#2E7D32" text-anchor="middle"><tspan x="835" dy="0">是</tspan></text><rect x="550" y="635" width="500" height="95" rx="8" fill="#F2EEFA" stroke="#6950A1" stroke-width="2.5"/><rect x="550" y="635" width="8" height="95" rx="4" fill="#6950A1"/><text class="" x="800" y="691.5" font-size="24" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">执行 Pipeline / MPC Plan</tspan></text><line x1="800" y1="580" x2="800" y2="635" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polygon points="800,747.5 1015,805 800,862.5 585,805" fill="#FFF5E5" stroke="#A86200" stroke-width="2.5"/><text class="" x="800" y="812" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">确定性审核通过？</tspan></text><line x1="800" y1="730" x2="800" y2="748" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1130" y="755" width="370" height="100" rx="8" fill="#EDF7EE" stroke="#2E7D32" stroke-width="2.5"/><rect x="1130" y="755" width="8" height="100" rx="4" fill="#2E7D32"/><text class="" x="1315" y="794" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1315" dy="0">提交已验证经验</tspan></text><text class="" x="1315" y="825" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1315" dy="0">幂等写入 + SHA-256</tspan></text><line x1="1015" y1="805" x2="1130" y2="805" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="1072.5" y="790" font-size="17" font-weight="600" fill="#2E7D32" text-anchor="middle"><tspan x="1072.5" dy="0">通过</tspan></text><rect x="105" y="755" width="340" height="100" rx="8" fill="#FFF5E5" stroke="#A86200" stroke-width="2.5"/><rect x="105" y="755" width="8" height="100" rx="4" fill="#A86200"/><text class="" x="275" y="794" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="275" dy="0">最多重规划一次</tspan></text><text class="" x="275" y="825" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="275" dy="0">仅重跑 Tool 4 MPC</tspan></text><line x1="585" y1="805" x2="445" y2="805" stroke="#A86200" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="515" y="790" font-size="17" font-weight="600" fill="#A86200" text-anchor="middle"><tspan x="515" dy="0">首次失败</tspan></text><line x1="800" y1="862" x2="800" y2="910" stroke="#C33C54" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="860" y="895" font-size="17" font-weight="600" fill="#C33C54" text-anchor="middle"><tspan x="860" dy="0">缺产物</tspan></text><rect x="105" y="910" width="340" height="100" rx="8" fill="#FFFFFF" stroke="#A86200" stroke-width="2.5"/><rect x="105" y="910" width="8" height="100" rx="4" fill="#A86200"/><text class="" x="275" y="969" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="275" dy="0">再次确定性审核</tspan></text><line x1="275" y1="855" x2="275" y2="910" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><rect x="630" y="910" width="340" height="100" rx="8" fill="#FCECEF" stroke="#C33C54" stroke-width="2.5"/><rect x="630" y="910" width="8" height="100" rx="4" fill="#C33C54"/><text class="" x="800" y="949" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">转人工复核</tspan></text><text class="" x="800" y="980" font-size="17" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="800" dy="0">二次失败或缺少空间产物</tspan></text><line x1="445" y1="960" x2="630" y2="960" stroke="#C33C54" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="537.5" y="945" font-size="17" font-weight="600" fill="#C33C54" text-anchor="middle"><tspan x="537.5" dy="0">失败</tspan></text><polyline points="275,1010 275,1035 1315,1035 1315,855" fill="none" stroke="#2E7D32" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="800" y="1028" font-size="17" font-weight="600" fill="#2E7D32" text-anchor="middle"><tspan x="800" dy="0">通过</tspan></text>
</svg>