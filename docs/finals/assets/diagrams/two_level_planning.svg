<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-label="任务级规划与数值级规划的责任边界">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8CA0A8"/>
    </marker>
    <style>
      text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>
  <text class="" x="70" y="70" font-size="38" font-weight="700" fill="#17313A" text-anchor="start"><tspan x="70" dy="0">两层规划：任务决策与数值优化</tspan></text><text class="" x="70" y="110" font-size="20" font-weight="400" fill="#60727A" text-anchor="start"><tspan x="70" dy="0">两层都称为规划，但责任、输入和证据完全不同</tspan></text><line x1="70" y1="132" x2="1530" y2="132" stroke="#D5DEE2" stroke-width="2"/><rect x="70" y="165" width="1460" height="300" rx="8" fill="#EAF3FC" stroke="#1976D2" stroke-width="2.5"/><text class="" x="105" y="205" font-size="29" font-weight="700" fill="#1976D2" text-anchor="start"><tspan x="105" dy="0">任务级规划</tspan></text><rect x="1250" y="177" width="230" height="38" rx="19" fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5"/><text class="" x="1365" y="202" font-size="18" font-weight="600" fill="#1976D2" text-anchor="middle"><tspan x="1365" dy="0">由 Gemma 4 决定</tspan></text><rect x="110" y="250" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5"/><rect x="110" y="250" width="8" height="130" rx="4" fill="#1976D2"/><text class="" x="245" y="289" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="245" dy="0">用户目标</tspan></text><text class="" x="245" y="320" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="245" dy="0">问题、版本、资源</tspan></text><rect x="420" y="250" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5"/><rect x="420" y="250" width="8" height="130" rx="4" fill="#1976D2"/><text class="" x="555" y="289" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="555" dy="0">Gemma 4 + ADK</tspan></text><text class="" x="555" y="320" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="555" dy="0">理解目标并选工具</tspan></text><rect x="760" y="250" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5"/><rect x="760" y="250" width="8" height="130" rx="4" fill="#1976D2"/><text class="" x="895" y="289" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="895" dy="0">函数工具反馈</tspan></text><text class="" x="895" y="320" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="895" dy="0">状态、结果、审计结论</tspan></text><rect x="1100" y="250" width="270" height="130" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="2.5"/><rect x="1100" y="250" width="8" height="130" rx="4" fill="#1976D2"/><text class="" x="1235" y="289" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1235" dy="0">下一动作</tspan></text><text class="" x="1235" y="320" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1235" dy="0">停止 / 恢复 / 提交</tspan></text><line x1="380" y1="315" x2="420" y2="315" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="690" y1="315" x2="760" y2="315" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1030" y1="315" x2="1100" y2="315" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1235,380 1235,425 555,425 555,380" fill="none" stroke="#1976D2" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="900" y="418" font-size="17" font-weight="600" fill="#1976D2" text-anchor="middle"><tspan x="900" dy="0">结构化反馈驱动下一步</tspan></text><rect x="70" y="520" width="1460" height="300" rx="8" fill="#F2EEFA" stroke="#6950A1" stroke-width="2.5"/><text class="" x="105" y="560" font-size="29" font-weight="700" fill="#6950A1" text-anchor="start"><tspan x="105" dy="0">数值级规划</tspan></text><rect x="1240" y="532" width="240" height="38" rx="19" fill="#FFFFFF" stroke="#6950A1" stroke-width="1.5"/><text class="" x="1360" y="557" font-size="18" font-weight="600" fill="#6950A1" text-anchor="middle"><tspan x="1360" dy="0">确定性算法执行</tspan></text><rect x="110" y="610" width="270" height="145" rx="8" fill="#FFFFFF" stroke="#6950A1" stroke-width="2.5"/><rect x="110" y="610" width="8" height="145" rx="4" fill="#6950A1"/><text class="" x="245" y="649" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="245" dy="0">空间状态</tspan></text><text class="" x="245" y="680" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="245" dy="0">17 维 block</tspan><tspan x="245" dy="28">12 维全局</tspan></text><rect x="420" y="610" width="270" height="145" rx="8" fill="#FFFFFF" stroke="#6950A1" stroke-width="2.5"/><rect x="420" y="610" width="8" height="145" rx="4" fill="#6950A1"/><text class="" x="555" y="649" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="555" dy="0">转移模型集成</tspan></text><text class="" x="555" y="680" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="555" dy="0">预测 s' 与 reward</tspan></text><rect x="760" y="610" width="270" height="145" rx="8" fill="#FFFFFF" stroke="#6950A1" stroke-width="2.5"/><rect x="760" y="610" width="8" height="145" rx="4" fill="#6950A1"/><text class="" x="895" y="649" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="895" dy="0">MPC 搜索</tspan></text><text class="" x="895" y="680" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="895" dy="0">比较候选 rollout</tspan></text><rect x="1100" y="610" width="270" height="145" rx="8" fill="#FFFFFF" stroke="#6950A1" stroke-width="2.5"/><rect x="1100" y="610" width="8" height="145" rx="4" fill="#6950A1"/><text class="" x="1235" y="649" font-size="23" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="1235" dy="0">真实环境执行</tspan></text><text class="" x="1235" y="680" font-size="18" font-weight="400" fill="#60727A" text-anchor="middle"><tspan x="1235" dy="0">执行首个行动</tspan><tspan x="1235" dy="28">重新观测状态</tspan></text><line x1="380" y1="682" x2="420" y2="682" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="690" y1="682" x2="760" y2="682" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><line x1="1030" y1="682" x2="1100" y2="682" stroke="#8CA0A8" stroke-width="3" marker-end="url(#arrow)"/><polyline points="1235,755 1235,790 245,790 245,755" fill="none" stroke="#6950A1" stroke-width="3" marker-end="url(#arrow)"/><text class="" x="740" y="786" font-size="17" font-weight="600" fill="#6950A1" text-anchor="middle"><tspan x="740" dy="0">滚动优化：每一步重新观测</tspan></text><rect x="315" y="865" width="970" height="70" rx="8" fill="#FCECEF" stroke="#C33C54" stroke-width="2.5"/><rect x="315" y="865" width="8" height="70" rx="4" fill="#C33C54"/><text class="" x="800" y="909" font-size="22" font-weight="700" fill="#17313A" text-anchor="middle"><tspan x="800" dy="0">责任边界：Gemma 4 决定调用什么；MPC 计算具体空间行动；独立代码审核结果</tspan></text>
</svg>