services:
  abu-dhabi-gwm:
    image: ${GWM_IMAGE:-abu-dhabi-gwm-api:1.0.0-model-r1-linux-amd64}
    platform: linux/amd64
    container_name: abu-dhabi-gwm
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "${GWM_BIND_ADDRESS:-127.0.0.1}:${GWM_PORT:-8080}:8080"
    environment:
      GWM_API_TOKEN: ${GWM_API_TOKEN:?Set GWM_API_TOKEN in .env}
      GWM_MIN_FREE_DISK_GB: ${GWM_MIN_FREE_DISK_GB:-5}
      GWM_MAX_CONCURRENT_RUNS: "1"
    volumes:
      - type: bind
        source: ${GWM_RUNS_DIR:?Set GWM_RUNS_DIR in .env}
        target: /data/runs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
