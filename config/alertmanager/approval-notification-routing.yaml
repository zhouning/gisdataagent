global:
  resolve_timeout: 5m

route:
  receiver: discard
  group_by:
    - alertname
    - namespace
    - gda_tenant
    - gda_approval_action
  group_wait: 5s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: approval-oncall
      matchers:
        - alertname=~"GDAApprovalCase|GDAApprovalNotification.*"
      continue: false

receivers:
  - name: discard
  - name: approval-oncall
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/approval-oncall-webhook-url
        send_resolved: true
