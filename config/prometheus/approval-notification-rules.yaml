groups:
  - name: gis-data-agent-approval-notification-sli
    interval: 30s
    rules:
      - record: gda:approval_notification_worker_healthy_replicas
        expr: sum(up{job="gis-agent-approval-notification-worker"} == 1)

      - record: gda:approval_notification_worker_target_replicas
        expr: count(up{job="gis-agent-approval-notification-worker"})

      - record: gda:approval_notification_cycle_success_age_seconds
        expr: time() - max(gda_approval_notification_last_success_timestamp_seconds)

      - record: gda:approval_notification_delivery_success:ratio_30m
        expr: |
          1 - (
            (sum(rate(gda_approval_notification_operations_total{outcome=~"retrying|dead_lettered"}[30m])) or vector(0))
            /
            clamp_min((sum(rate(gda_approval_notification_operations_total{outcome=~"delivered|retrying|dead_lettered"}[30m])) or vector(0)), 1e-9)
          )

      - record: gda:approval_notification_delivery_success:ratio_6h
        expr: |
          1 - (
            (sum(rate(gda_approval_notification_operations_total{outcome=~"retrying|dead_lettered"}[6h])) or vector(0))
            /
            clamp_min((sum(rate(gda_approval_notification_operations_total{outcome=~"delivered|retrying|dead_lettered"}[6h])) or vector(0)), 1e-9)
          )

      - record: gda:approval_notification_delivery_attempts:rate5m
        expr: |
          sum by (outcome) (
            rate(gda_approval_notification_operations_total{outcome=~"delivered|retrying|dead_lettered"}[5m])
          )

      - record: gda:approval_notification_cycle_duration:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(gda_approval_notification_cycle_duration_seconds_bucket[5m]))
          )

  - name: gis-data-agent-approval-notifications
    interval: 30s
    rules:
      - alert: GDAApprovalNotificationWorkerUnavailable
        expr: absent(up{job="gis-agent-approval-notification-worker"} == 1)
        for: 5m
        labels:
          severity: critical
          service: gis-data-agent
          component: approval-notification
          team: data-platform
        annotations:
          summary: ApprovalCase notification workers are unavailable
          description: No healthy ApprovalCase notification worker has been scraped for five minutes.
          runbook: approval-notification-worker

      - alert: GDAApprovalNotificationWorkerStalled
        expr: time() - max(gda_approval_notification_last_success_timestamp_seconds) > 120
        for: 2m
        labels:
          severity: critical
          service: gis-data-agent
          component: approval-notification
          team: data-platform
        annotations:
          summary: ApprovalCase notification cycles are stalled
          description: No worker has completed a successful notification cycle within two minutes.
          runbook: approval-notification-worker

      - alert: GDAApprovalNotificationCycleErrors
        expr: sum(increase(gda_approval_notification_operations_total{outcome="cycle_error"}[10m])) > 0
        labels:
          severity: critical
          service: gis-data-agent
          component: approval-notification
          team: data-platform
        annotations:
          summary: ApprovalCase notification cycles are failing
          description: At least one worker cycle failed before it could complete its governed outbox work.
          runbook: approval-notification-worker

      - alert: GDAApprovalNotificationDeadLettered
        expr: sum(increase(gda_approval_notification_operations_total{outcome="dead_lettered"}[15m])) > 0
        labels:
          severity: critical
          service: gis-data-agent
          component: approval-notification
          team: data-platform
        annotations:
          summary: ApprovalCase notifications reached dead letter
          description: At least one notification exhausted its bounded automatic delivery attempts.
          runbook: approval-notification-worker

      - alert: GDAApprovalNotificationRetrySurge
        expr: sum(increase(gda_approval_notification_operations_total{outcome="retrying"}[10m])) >= 5
        labels:
          severity: warning
          service: gis-data-agent
          component: approval-notification
          team: data-platform
        annotations:
          summary: ApprovalCase notification retries are elevated
          description: Five or more delivery failures returned to pending during the last ten minutes.
          runbook: approval-notification-worker
