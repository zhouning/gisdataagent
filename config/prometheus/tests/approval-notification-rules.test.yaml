rule_files:
  - ../approval-notification-rules.yaml

evaluation_interval: 1m

tests:
  - name: recording-rules-produce-operational-sli
    interval: 1m
    input_series:
      - series: up{job="gis-agent-approval-notification-worker",instance="worker-1"}
        values: 1+0x35
      - series: up{job="gis-agent-approval-notification-worker",instance="worker-2"}
        values: 1+0x35
      - series: gda_approval_notification_last_success_timestamp_seconds{instance="worker-1"}
        values: 100+0x35
      - series: gda_approval_notification_operations_total{outcome="delivered"}
        values: 0+54x35
      - series: gda_approval_notification_operations_total{outcome="retrying"}
        values: 0+6x35
      - series: gda_approval_notification_operations_total{outcome="dead_lettered"}
        values: 0+0x35
    promql_expr_test:
      - expr: gda:approval_notification_worker_healthy_replicas
        eval_time: 30m
        exp_samples:
          - labels: gda:approval_notification_worker_healthy_replicas
            value: 2
      - expr: gda:approval_notification_worker_target_replicas
        eval_time: 30m
        exp_samples:
          - labels: gda:approval_notification_worker_target_replicas
            value: 2
      - expr: gda:approval_notification_cycle_success_age_seconds
        eval_time: 30m
        exp_samples:
          - labels: gda:approval_notification_cycle_success_age_seconds
            value: 1700
      - expr: gda:approval_notification_delivery_success:ratio_30m
        eval_time: 30m
        exp_samples:
          - labels: gda:approval_notification_delivery_success:ratio_30m
            value: 0.9
      - expr: gda:approval_notification_delivery_attempts:rate5m
        eval_time: 30m
        exp_samples:
          - labels: '{__name__="gda:approval_notification_delivery_attempts:rate5m",outcome="dead_lettered"}'
            value: 0
          - labels: '{__name__="gda:approval_notification_delivery_attempts:rate5m",outcome="delivered"}'
            value: 0.9
          - labels: '{__name__="gda:approval_notification_delivery_attempts:rate5m",outcome="retrying"}'
            value: 0.1

  - name: idle-delivery-window-is-not-counted-as-failure
    interval: 1m
    input_series:
      - series: gda_approval_notification_operations_total{outcome="claimed"}
        values: 0+0x35
    promql_expr_test:
      - expr: gda:approval_notification_delivery_success:ratio_30m
        eval_time: 30m
        exp_samples:
          - labels: gda:approval_notification_delivery_success:ratio_30m
            value: 1

  - name: worker-unavailable-pages-after-five-minutes
    interval: 1m
    alert_rule_test:
      - eval_time: 6m
        alertname: GDAApprovalNotificationWorkerUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
              service: gis-data-agent
              component: approval-notification
              team: data-platform
            exp_annotations:
              summary: ApprovalCase notification workers are unavailable
              description: No healthy ApprovalCase notification worker has been scraped for five minutes.
              runbook: approval-notification-worker

  - name: stale-cycle-heartbeat-pages
    interval: 1m
    input_series:
      - series: gda_approval_notification_last_success_timestamp_seconds
        values: 0+0x10
    alert_rule_test:
      - eval_time: 6m
        alertname: GDAApprovalNotificationWorkerStalled
        exp_alerts:
          - exp_labels:
              severity: critical
              service: gis-data-agent
              component: approval-notification
              team: data-platform
            exp_annotations:
              summary: ApprovalCase notification cycles are stalled
              description: No worker has completed a successful notification cycle within two minutes.
              runbook: approval-notification-worker

  - name: cycle-errors-page-immediately
    interval: 1m
    input_series:
      - series: gda_approval_notification_operations_total{outcome="cycle_error"}
        values: 0 0 1 1 1
    alert_rule_test:
      - eval_time: 4m
        alertname: GDAApprovalNotificationCycleErrors
        exp_alerts:
          - exp_labels:
              severity: critical
              service: gis-data-agent
              component: approval-notification
              team: data-platform
            exp_annotations:
              summary: ApprovalCase notification cycles are failing
              description: At least one worker cycle failed before it could complete its governed outbox work.
              runbook: approval-notification-worker

  - name: dead-letter-pages-immediately
    interval: 1m
    input_series:
      - series: gda_approval_notification_operations_total{outcome="dead_lettered"}
        values: 0 0 1 1 1
    alert_rule_test:
      - eval_time: 4m
        alertname: GDAApprovalNotificationDeadLettered
        exp_alerts:
          - exp_labels:
              severity: critical
              service: gis-data-agent
              component: approval-notification
              team: data-platform
            exp_annotations:
              summary: ApprovalCase notifications reached dead letter
              description: At least one notification exhausted its bounded automatic delivery attempts.
              runbook: approval-notification-worker

  - name: retry-surge-warns
    interval: 1m
    input_series:
      - series: gda_approval_notification_operations_total{outcome="retrying"}
        values: 0 0 3 6 6
    alert_rule_test:
      - eval_time: 4m
        alertname: GDAApprovalNotificationRetrySurge
        exp_alerts:
          - exp_labels:
              severity: warning
              service: gis-data-agent
              component: approval-notification
              team: data-platform
            exp_annotations:
              summary: ApprovalCase notification retries are elevated
              description: Five or more delivery failures returned to pending during the last ten minutes.
              runbook: approval-notification-worker
