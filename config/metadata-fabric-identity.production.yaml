    project_role: GdaMetadataTableProjectionRole
    project_permissions:
      - resource: table
        operations:
          - Create
    denied_probe:
      resource: policy
      operation: Create
  gravitino:
    role: gda-table-projection
    securable_objects:
      - full_name: lakehouse
        type: CATALOG
        privileges:
          - USE_CATALOG
      - full_name: lakehouse.published
        type: SCHEMA
        privileges:
          - CREATE_TABLE
          - USE_SCHEMA
    denied_probe:
      resource: METALAKE
      operation: CREATE_CATALOG

