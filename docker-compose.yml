      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  minio-bucket-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_dev_minio_secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-gis-agent-uploads}
      MMFE_LAKEHOUSE_BUCKET: ${MMFE_LAKEHOUSE_BUCKET:-gis-agent-lakehouse}
      BLUEPRINT_DUCKDB_OUTPUT_BUCKET: ${GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_BUCKET:-gis-agent-blueprint-results}
      BLUEPRINT_DUCKDB_OUTPUT_PREFIX: ${GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_PREFIX:-blueprint-duckdb-results/v1}
      BLUEPRINT_DUCKDB_ACCESS_KEY_ID: ${GDA_BLUEPRINT_DUCKDB_ACCESS_KEY_ID:-gda_blueprint_worker}
      BLUEPRINT_DUCKDB_SECRET_ACCESS_KEY: ${GDA_BLUEPRINT_DUCKDB_SECRET_ACCESS_KEY:-local_dev_blueprint_worker_secret}
      BLUEPRINT_DUCKDB_POLICY: ${GDA_BLUEPRINT_DUCKDB_POLICY:-gda-blueprint-duckdb-worker}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/"$$AWS_S3_BUCKET"
        mc mb --ignore-existing local/"$$MMFE_LAKEHOUSE_BUCKET"
        # Blueprint output is created with Object Lock.  A pre-existing bucket
        # without lock is intentionally not silently upgraded; the worker's
        # readiness probe will fail closed and the operator must provision a
        # new immutable bucket rather than weaken the evidence contract.
        mc mb --with-lock --ignore-existing local/"$$BLUEPRINT_DUCKDB_OUTPUT_BUCKET"
        mc retention set --default GOVERNANCE 1d local/"$$BLUEPRINT_DUCKDB_OUTPUT_BUCKET"
        policy_file=$$(mktemp)
        trap 'rm -f "$$policy_file"' EXIT
        cat >"$$policy_file" <<POLICY
        {
          "Version": "2012-10-17",
          "Statement": [
            {"Effect":"Allow","Action":["s3:GetBucketLocation"],"Resource":["arn:aws:s3:::$$MMFE_LAKEHOUSE_BUCKET","arn:aws:s3:::$$AWS_S3_BUCKET","arn:aws:s3:::$$BLUEPRINT_DUCKDB_OUTPUT_BUCKET"]},
            {"Effect":"Allow","Action":["s3:GetBucketVersioning","s3:GetBucketObjectLockConfiguration"],"Resource":["arn:aws:s3:::$$BLUEPRINT_DUCKDB_OUTPUT_BUCKET"]},
            {"Effect":"Allow","Action":["s3:GetObject","s3:GetObjectVersion"],"Resource":["arn:aws:s3:::$$MMFE_LAKEHOUSE_BUCKET/products/*","arn:aws:s3:::$$AWS_S3_BUCKET/admitted/*","arn:aws:s3:::$$BLUEPRINT_DUCKDB_OUTPUT_BUCKET/$$BLUEPRINT_DUCKDB_OUTPUT_PREFIX/*"]},
            {"Effect":"Allow","Action":["s3:PutObject"],"Resource":["arn:aws:s3:::$$BLUEPRINT_DUCKDB_OUTPUT_BUCKET/$$BLUEPRINT_DUCKDB_OUTPUT_PREFIX/*"]}
          ]
        }
        POLICY
        mc admin user info local "$$BLUEPRINT_DUCKDB_ACCESS_KEY_ID" >/dev/null 2>&1 || mc admin user add local "$$BLUEPRINT_DUCKDB_ACCESS_KEY_ID" "$$BLUEPRINT_DUCKDB_SECRET_ACCESS_KEY"
        mc admin policy info local "$$BLUEPRINT_DUCKDB_POLICY" >/dev/null 2>&1 || mc admin policy create local "$$BLUEPRINT_DUCKDB_POLICY" "$$policy_file"
        mc admin policy attach local "$$BLUEPRINT_DUCKDB_POLICY" --user "$$BLUEPRINT_DUCKDB_ACCESS_KEY_ID"
        mc anonymous set none local/"$$AWS_S3_BUCKET" || true
        mc anonymous set none local/"$$MMFE_LAKEHOUSE_BUCKET" || true
        echo "[bucket-init] buckets ready: $$AWS_S3_BUCKET $$MMFE_LAKEHOUSE_BUCKET"
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # Natural-resource ontology RDF read projection (production runtime)
  # Fuseki/TDB2 serves OWL hierarchy and SPARQL. PostgreSQL remains the
  # authority for versions, mappings, provenance, publication and audit.
  # ---------------------------------------------------------------------------
  ontology-rdf:
    image: "${FUSEKI_IMAGE:-gisdataagent-ontology-fuseki:5.5.0-nr-2.3.0}"
    build:
      context: .
      dockerfile: docker/ontology-fuseki/Dockerfile
    restart: unless-stopped
    environment:
      JVM_ARGS: ${FUSEKI_JVM_ARGS:--Xms512m -Xmx2g -XX:+UseG1GC}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3030/$$/ping"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - ontology-fuseki-data:/fuseki
    networks:
      - agent-net

  ontology-projection:
    build: .
    restart: "no"
    depends_on:
      ontology-rdf:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Verify the immutable RDF package was loaded before the application starts.
    command:
      - |
        set -eu
        attempt=0
        until curl -fsS http://ontology-rdf:3030/$/ping >/dev/null; do
          attempt=$$((attempt + 1))
          if [ "$$attempt" -ge 60 ]; then exit 1; fi
          sleep 2
        done
        result="$$(curl -fsS -G \
          --data-urlencode 'query=SELECT (COUNT(*) AS ?triples) WHERE { ?s ?p ?o }' \
          -H 'Accept: application/sparql-results+json' \
          http://ontology-rdf:3030/ontology/query)"
        echo "$$result" | grep -q '537245'
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # Redis (optional, for real-time data streams)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # CV Detection Service (Surveying QC — v15.7)
  # ---------------------------------------------------------------------------
  cv-service:
    build: ./subsystems/cv-service
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      MODEL_DIR: /app/models
      DEVICE: ${CV_DEVICE:-cpu}
    volumes:
      - cv-models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agent-net
    profiles:
      - qc

  # ---------------------------------------------------------------------------
  # CAD/3D Parser Service (Surveying QC — v15.7)
  # ---------------------------------------------------------------------------
  cad-parser:
    build: ./subsystems/cad-parser
    restart: unless-stopped
    ports:
      - "8011:8000"
    volumes:
      - cad-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agent-net
    profiles:
      - qc

  # ---------------------------------------------------------------------------
  # Martin Vector Tile Server (v17.1 — large dataset rendering)
  # ---------------------------------------------------------------------------
  martin:
    image: ghcr.io/maplibre/martin:v0.18.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://agent_user:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/gis_agent
    command: ["--config", "/etc/martin/config.yaml"]
    volumes:
      - ./deploy/martin/config.yaml:/etc/martin/config.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - agent-net
    profiles:
      - tiles

  # ---------------------------------------------------------------------------
  # Reference Data Service (Surveying QC — v15.7)
  # ---------------------------------------------------------------------------
  reference-data:
    build: ./subsystems/reference-data
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8012:8000"
    environment:
      DATABASE_URL: postgresql://agent_user:${POSTGRES_PASSWORD:-change_me_strong_password}@db:5432/gis_agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - agent-net
    profiles:
      - qc

  # ---------------------------------------------------------------------------
  # AlphaEarth Backend
  # ---------------------------------------------------------------------------
  ae_backend:
    build: ./ae_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8085:8000"
    environment:
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: flights_dataset
      HUAWEI_OBS_AK: ${HUAWEI_OBS_AK:-}
      HUAWEI_OBS_SK: ${HUAWEI_OBS_SK:-}
      HUAWEI_OBS_SERVER: ${HUAWEI_OBS_SERVER:-}
      HUAWEI_OBS_BUCKET: ${HUAWEI_OBS_BUCKET:-}
    volumes:
      - ./data_agent/weights:/app/data_agent/weights
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # AlphaEarth Frontend
  # ---------------------------------------------------------------------------
  ae_frontend:
    build: ./ae_frontend
    restart: unless-stopped
    depends_on:
      - ae_backend
    ports:
      - "80:80"
    networks:
      - agent-net

volumes:
  pgdata-arm64:
  uploads:
  worldpop_cache:
  redis-data:
  minio-data:
  cv-models:
  cad-uploads:
  ontology-fuseki-data:
  ingestion-lake:
  blueprint-worker-workspace:
  blueprint-worker-status:

secrets:
  openmetadata_bearer_token:
    file: ${GDA_OPENMETADATA_BEARER_TOKEN_SOURCE:-./secrets/openmetadata_token}

networks:
  agent-net:
    driver: bridge
