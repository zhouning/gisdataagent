# =============================================================================
# GIS Data Agent — Docker Compose
# Usage: docker compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostGIS Database
  # ---------------------------------------------------------------------------
  db:
    # Build locally first with:
    #   docker build -t gis-postgis-pgvector:16-3.4 docker/postgis-pgvector
    image: "${POSTGIS_IMAGE:-gis-postgis-pgvector:16-3.4}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: gis_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-150}
      - -c
      - superuser_reserved_connections=${POSTGRES_SUPERUSER_RESERVED_CONNECTIONS:-5}
    ports:
      - "5433:5432"        # Expose on 5433 to avoid conflicts with host PostgreSQL
    volumes:
      # Keep ARM data separate from the old postgis/postgis amd64 volume. Do
      # not point this at an existing cross-architecture PostgreSQL PGDATA.
      - pgdata-arm64:/var/lib/postgresql/data
      - ./docker-db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # Database Migration Authority (one shot)
  # ---------------------------------------------------------------------------
  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres}
      MIGRATION_RUNTIME_DB_ROLE: agent_user
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        python -m data_agent.migration_runner migrate
        bash /app/scripts/grant-platform-gateway-role.sh
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # GIS Data Agent Application
  # ---------------------------------------------------------------------------
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
      ontology-projection:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # PostgreSQL connection
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-150}
      POSTGRES_CONNECTION_RESERVE: ${POSTGRES_CONNECTION_RESERVE:-20}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      ASYNC_POOL_MIN: ${ASYNC_POOL_MIN:-2}
      ASYNC_POOL_MAX: ${ASYNC_POOL_MAX:-10}
      MARTIN_URL: ${MARTIN_URL:-http://martin:3000}
      # OGC API Features provider origin; empty by default until the pygeoapi
      # profile is explicitly enabled.
      PYGEOAPI_URL: ${PYGEOAPI_URL:-}
      PYGEOAPI_PROVIDER_VERSION: ${PYGEOAPI_PROVIDER_VERSION:-0.25.dev0}
      # Google AI — set in .env or pass at runtime
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-global}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-AIzaSy-LOCAL-PLACEHOLDER-not-used-with-ollama-router}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GDA_OPENAI_REASONING_EFFORT: ${GDA_OPENAI_REASONING_EFFORT:-low}
      ROUTER_MODEL: ${ROUTER_MODEL:-gemma4-26b-ollama}
      MODEL_FAST: ${MODEL_FAST:-gemma4-26b-ollama}
      MODEL_STANDARD: ${MODEL_STANDARD:-gemma4-26b-ollama}
      MODEL_PREMIUM: ${MODEL_PREMIUM:-gemma4-26b-ollama}
      MODEL_CONFIG_FORCE_ENV: ${MODEL_CONFIG_FORCE_ENV:-true}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
      GDA_LLM_PROVIDER: ${GDA_LLM_PROVIDER:-}
      GDA_LLM_BASE_URL: ${GDA_LLM_BASE_URL:-}
      GDA_LLM_MODEL: ${GDA_LLM_MODEL:-}
      GDA_LLM_API_KEY: ${GDA_LLM_API_KEY:-}
      GDA_LLM_TIMEOUT_SECONDS: ${GDA_LLM_TIMEOUT_SECONDS:-180}
      NL2SQL_AGENT_MODEL: ${NL2SQL_AGENT_MODEL:-gemma4-26b-ollama}
      NL2SQL_LLM_SCHEMA_MAPPER_MODEL: ${NL2SQL_LLM_SCHEMA_MAPPER_MODEL:-gemma4-26b-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      GDA_EMBEDDING_MODEL: ${GDA_EMBEDDING_MODEL:-}
      GDA_EMBEDDING_PROVIDER: ${GDA_EMBEDDING_PROVIDER:-}
      GDA_EMBEDDING_BASE_URL: ${GDA_EMBEDDING_BASE_URL:-}
      GDA_EMBEDDING_API_KEY: ${GDA_EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-768}
      # Gaode Maps API
      GAODE_API_KEY: ${GAODE_API_KEY:-}
      # Chainlit
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-replace_with_a_real_secret}
      # A standalone ingestion worker owns schedule polling in Compose.
      GDA_INGEST_EMBEDDED_WORKER: "0"
      # Dynamic Planner
      DYNAMIC_PLANNER: ${DYNAMIC_PLANNER:-true}
      # Private ArcPy/DTS MCP gateways. Values are inherited from the shell
      # that starts Compose; bearer tokens are never written to this file.
      ARCPY_MCP_TOKEN: ${ARCPY_MCP_TOKEN:-}
      DTS_MCP_TOKEN: ${DTS_MCP_TOKEN:-}
      MCP_CLOSE_TIMEOUT: ${MCP_CLOSE_TIMEOUT:-5}
      # Optional services
      CLOUD_STORAGE_PROVIDER: ${CLOUD_STORAGE_PROVIDER:-aws}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local_dev_minio_secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-gis-agent-uploads}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MMFE_LAKEHOUSE_BUCKET: ${MMFE_LAKEHOUSE_BUCKET:-gis-agent-lakehouse}
      MMFE_LAKEHOUSE_WAREHOUSE_URI: ${MMFE_LAKEHOUSE_WAREHOUSE_URI:-s3://gis-agent-lakehouse/warehouse}
      MMFE_STAC_CATALOG_URI: ${MMFE_STAC_CATALOG_URI:-s3://gis-agent-lakehouse/catalog/stac}
      MMFE_ICEBERG_CATALOG: ${MMFE_ICEBERG_CATALOG:-local}
      MMFE_ICEBERG_NAMESPACE: ${MMFE_ICEBERG_NAMESPACE:-gis.fusion}
      MMFE_ICEBERG_TABLE: ${MMFE_ICEBERG_TABLE:-semantic_products}
      # Blueprint admission constructs credential-free S3 identities. The API
      # never receives the dedicated worker credential configured below.
      GDA_BLUEPRINT_DUCKDB_RESULT_BACKEND: ${GDA_BLUEPRINT_DUCKDB_RESULT_BACKEND:-s3}
      GDA_BLUEPRINT_DUCKDB_OUTPUT_ROOT: /app/data_agent/uploads/blueprint-duckdb-results
      GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_BUCKET: ${GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_BUCKET:-gis-agent-blueprint-results}
      GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_PREFIX: ${GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_PREFIX:-blueprint-duckdb-results/v1}
      GDA_BLUEPRINT_DUCKDB_INPUT_S3_PREFIXES: ${GDA_BLUEPRINT_DUCKDB_INPUT_S3_PREFIXES:-s3://${MMFE_LAKEHOUSE_BUCKET:-gis-agent-lakehouse}/products,s3://${AWS_S3_BUCKET:-gis-agent-uploads}/admitted}
      HUAWEI_OBS_AK: ${HUAWEI_OBS_AK:-}
      HUAWEI_OBS_SK: ${HUAWEI_OBS_SK:-}
      HUAWEI_OBS_SERVER: ${HUAWEI_OBS_SERVER:-}
      HUAWEI_OBS_BUCKET: ${HUAWEI_OBS_BUCKET:-}
      TIANDITU_TOKEN: ${TIANDITU_TOKEN:-}
      WECOM_CORP_ID: ${WECOM_CORP_ID:-}
      WECOM_APP_SECRET: ${WECOM_APP_SECRET:-}
      WECOM_TOKEN: ${WECOM_TOKEN:-}
      WECOM_ENCODING_AES_KEY: ${WECOM_ENCODING_AES_KEY:-}
      WECOM_AGENT_ID: ${WECOM_AGENT_ID:-}
      WECOM_SHARE_BASE_URL: ${WECOM_SHARE_BASE_URL:-}
      # DingTalk Bot (optional)
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_ROBOT_CODE: ${DINGTALK_ROBOT_CODE:-}
      DINGTALK_SHARE_BASE_URL: ${DINGTALK_SHARE_BASE_URL:-}
      # Feishu Bot (optional)
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_SHARE_BASE_URL: ${FEISHU_SHARE_BASE_URL:-}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      DAILY_ANALYSIS_LIMIT: ${DAILY_ANALYSIS_LIMIT:-}
      MONTHLY_TOKEN_LIMIT: ${MONTHLY_TOKEN_LIMIT:-}
      AUDIT_LOG_RETENTION_DAYS: ${AUDIT_LOG_RETENTION_DAYS:-}
      # Governed DataOps manual admission (non-secret server-side identity profile)
      GDA_DATAOPS_MANUAL_WORKLOAD_SUBJECT: ${GDA_DATAOPS_MANUAL_WORKLOAD_SUBJECT:-workload:dolphinscheduler-gda-dataops}
      GDA_DATAOPS_MANUAL_WORKLOAD_ROLES: ${GDA_DATAOPS_MANUAL_WORKLOAD_ROLES:-platform_operator}
      GDA_DATAOPS_MANUAL_POLICY_VERSION_REF: ${GDA_DATAOPS_MANUAL_POLICY_VERSION_REF:-gda://local-dev/policy/jqdltb-manual-sandbox:v1}
      GDA_DATAOPS_MANUAL_POLICY_EVALUATOR_SUBJECT: ${GDA_DATAOPS_MANUAL_POLICY_EVALUATOR_SUBJECT:-workload:gda-policy-evaluator}
      GDA_DATAOPS_MANUAL_POLICY_TTL_SECONDS: ${GDA_DATAOPS_MANUAL_POLICY_TTL_SECONDS:-86400}
      GDA_DATAOPS_MANUAL_INVOCATION_OWNER_REF: ${GDA_DATAOPS_MANUAL_INVOCATION_OWNER_REF:-team:data-platform}
      # Governed DataOps cancellation admission
      GDA_DATAOPS_CANCEL_WORKLOAD_SUBJECT: ${GDA_DATAOPS_CANCEL_WORKLOAD_SUBJECT:-workload:dolphinscheduler-gda-dataops}
      GDA_DATAOPS_CANCEL_POLICY_VERSION_REF: ${GDA_DATAOPS_CANCEL_POLICY_VERSION_REF:-gda://local-dev/policy/dataops-cancel-sandbox:v1}
      GDA_DATAOPS_CANCEL_POLICY_EVALUATOR_SUBJECT: ${GDA_DATAOPS_CANCEL_POLICY_EVALUATOR_SUBJECT:-workload:gda-policy-evaluator}
      GDA_DATAOPS_CANCEL_POLICY_TTL_SECONDS: ${GDA_DATAOPS_CANCEL_POLICY_TTL_SECONDS:-86400}
      # Unified ApprovalCase Resource ownership (non-secret governance identity)
      GDA_APPROVAL_CASE_OWNER_REF: ${GDA_APPROVAL_CASE_OWNER_REF:-team:data-platform}
      # Exact workload identity accepted by the SLO Alertmanager webhook
      GDA_SLO_ALERT_DETECTOR_SUBJECT: ${GDA_SLO_ALERT_DETECTOR_SUBJECT:-workload:slo-alert-ingestor}
      # Redis (for real-time streams)
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      GDA_GIS_MVT_CACHE_REDIS_URL: ${GDA_GIS_MVT_CACHE_REDIS_URL:-redis://redis:6379/1}
      GDA_GIS_MVT_CACHE_KEY_PREFIX: ${GDA_GIS_MVT_CACHE_KEY_PREFIX:-gda:mvt:response:v1}
      GDA_GIS_MVT_CACHE_MAX_OBJECT_BYTES: ${GDA_GIS_MVT_CACHE_MAX_OBJECT_BYTES:-1048576}
      GDA_GIS_MVT_CACHE_TIMEOUT_SECONDS: ${GDA_GIS_MVT_CACHE_TIMEOUT_SECONDS:-0.5}
      UWM_LIVABILITY_S2_RUN_STORE: /app/data_agent/uploads/uwm_livability_s2_runs
      ONTOLOGY_RUNTIME_BACKEND: ${ONTOLOGY_RUNTIME_BACKEND:-auto}
      ONTOLOGY_SPARQL_ENDPOINT: ${ONTOLOGY_SPARQL_ENDPOINT:-http://ontology-rdf:3030/ontology/query}
      ONTOLOGY_SPARQL_TIMEOUT_SECONDS: ${ONTOLOGY_SPARQL_TIMEOUT_SECONDS:-5}
      # Optional RDF repair provider. Point only at a separately secured
      # writable Graph Store; ontology-rdf below remains intentionally read-only.
      GDA_RDF_PROJECTION_TARGETS_JSON: ${GDA_RDF_PROJECTION_TARGETS_JSON:-}
      GDA_RDF_PROJECTION_USERNAME: ${GDA_RDF_PROJECTION_USERNAME:-}
      GDA_RDF_PROJECTION_PASSWORD: ${GDA_RDF_PROJECTION_PASSWORD:-}
      GDA_RDF_PROJECTION_TIMEOUT_SECONDS: ${GDA_RDF_PROJECTION_TIMEOUT_SECONDS:-120}
      # Optional object-store repair provider. The registry must bind only the
      # sealed Chongqing customer bundle; credentials are separate from the
      # general cloud-storage adapter settings above.
      GDA_OBJECT_PROJECTION_TARGETS_JSON: ${GDA_OBJECT_PROJECTION_TARGETS_JSON:-}
      GDA_OBJECT_PROJECTION_ACCESS_KEY_ID: ${GDA_OBJECT_PROJECTION_ACCESS_KEY_ID:-}
      GDA_OBJECT_PROJECTION_SECRET_ACCESS_KEY: ${GDA_OBJECT_PROJECTION_SECRET_ACCESS_KEY:-}
      GDA_OBJECT_PROJECTION_SESSION_TOKEN: ${GDA_OBJECT_PROJECTION_SESSION_TOKEN:-}
      GDA_OBJECT_PROJECTION_TIMEOUT_SECONDS: ${GDA_OBJECT_PROJECTION_TIMEOUT_SECONDS:-120}
      # Optional Spark/Iceberg repair provider. Enabling this local Docker
      # adapter also requires a deliberately mounted Docker execution boundary.
      GDA_LAKEHOUSE_PROJECTION_TARGETS_JSON: ${GDA_LAKEHOUSE_PROJECTION_TARGETS_JSON:-}
      GDA_LAKEHOUSE_PROJECTION_ACCESS_KEY_ID: ${GDA_LAKEHOUSE_PROJECTION_ACCESS_KEY_ID:-}
      GDA_LAKEHOUSE_PROJECTION_SECRET_ACCESS_KEY: ${GDA_LAKEHOUSE_PROJECTION_SECRET_ACCESS_KEY:-}
      GDA_LAKEHOUSE_PROJECTION_SESSION_TOKEN: ${GDA_LAKEHOUSE_PROJECTION_SESSION_TOKEN:-}
      GDA_LAKEHOUSE_PROJECTION_SPARK_IMAGE: ${GDA_LAKEHOUSE_PROJECTION_SPARK_IMAGE:-gisdataagent/mmfe-spark-runtime:local}
      GDA_LAKEHOUSE_PROJECTION_DOCKER_NETWORK: ${GDA_LAKEHOUSE_PROJECTION_DOCKER_NETWORK:-gisdataagent_agent-net}
      GDA_LAKEHOUSE_PROJECTION_REPOSITORY_ROOT: ${GDA_LAKEHOUSE_PROJECTION_REPOSITORY_ROOT:-/app}
      GDA_LAKEHOUSE_PROJECTION_JAVA_HOME: ${GDA_LAKEHOUSE_PROJECTION_JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-arm64}
      GDA_LAKEHOUSE_PROJECTION_TIMEOUT_SECONDS: ${GDA_LAKEHOUSE_PROJECTION_TIMEOUT_SECONDS:-600}
    volumes:
      - uploads:/app/data_agent/uploads
      - worldpop_cache:/app/data_agent/uploads/.worldpop_cache
      - /Users/zhouning/codex-arcpy-mcp-plugin/plugins/arcpy-mcp/assets/arcpy-mcp-ca.crt:/Users/zhouning/codex-arcpy-mcp-plugin/plugins/arcpy-mcp/assets/arcpy-mcp-ca.crt:ro
      - /Users/zhouning/codex-dts-mcp-plugin/plugins/dts-mcp/assets/dts-mcp-ca.crt:/Users/zhouning/codex-dts-mcp-plugin/plugins/dts-mcp/assets/dts-mcp-ca.crt:ro
      # Optional: mount Google service account credentials
      # - ./secrets/service-account.json:/app/secrets/service-account.json:ro
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # Cross-store projection recovery (explicit optional profile)
  # ---------------------------------------------------------------------------
  projection-recovery-worker:
    build: .
    restart: unless-stopped
    profiles:
      - projection-recovery
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "data_agent.cross_store_projection_recovery_job_worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-150}
      POSTGRES_CONNECTION_RESERVE: ${POSTGRES_CONNECTION_RESERVE:-20}
      DB_POOL_SIZE: ${GDA_WORKER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${GDA_WORKER_DB_MAX_OVERFLOW:-0}
      ASYNC_POOL_MIN: "0"
      ASYNC_POOL_MAX: "1"
      GDA_PROJECTION_RECOVERY_TENANT_ID: ${GDA_PROJECTION_RECOVERY_TENANT_ID:-}
      GDA_PROJECTION_RECOVERY_WORKER_ID: ${GDA_PROJECTION_RECOVERY_WORKER_ID:-worker:projection-recovery:compose}
      GDA_PROJECTION_RECOVERY_WORKER_LIMIT: ${GDA_PROJECTION_RECOVERY_WORKER_LIMIT:-1}
      GDA_PROJECTION_RECOVERY_WORKER_LEASE_SECONDS: ${GDA_PROJECTION_RECOVERY_WORKER_LEASE_SECONDS:-120}
      GDA_PROJECTION_RECOVERY_WORKER_HEARTBEAT_SECONDS: ${GDA_PROJECTION_RECOVERY_WORKER_HEARTBEAT_SECONDS:-40}
      GDA_PROJECTION_RECOVERY_WORKER_RETRY_DELAY_SECONDS: ${GDA_PROJECTION_RECOVERY_WORKER_RETRY_DELAY_SECONDS:-30}
      GDA_PROJECTION_RECOVERY_WORKER_POLL_SECONDS: ${GDA_PROJECTION_RECOVERY_WORKER_POLL_SECONDS:-5}
      GDA_PROJECTION_RECOVERY_ROWS_DIRECTORY: /app/data_agent/uploads/projection-recovery-rows
      # Optional plan-bound cross-store controller admission evidence.
      GDA_PROJECTION_RECOVERY_CONTROLLER_ADMISSION_FILE: ${GDA_PROJECTION_RECOVERY_CONTROLLER_ADMISSION_FILE:-}
      GDA_PROJECTION_RECOVERY_COMPENSATION_STRATEGY: ${GDA_PROJECTION_RECOVERY_COMPENSATION_STRATEGY:-disabled}
      GDA_POSTGIS_PROJECTION_TARGETS_JSON: ${GDA_POSTGIS_PROJECTION_TARGETS_JSON:-}
      GDA_VECTOR_PROJECTION_TARGETS_JSON: ${GDA_VECTOR_PROJECTION_TARGETS_JSON:-}
      GDA_RDF_PROJECTION_TARGETS_JSON: ${GDA_RDF_PROJECTION_TARGETS_JSON:-}
      GDA_RDF_PROJECTION_USERNAME: ${GDA_RDF_PROJECTION_USERNAME:-}
      GDA_RDF_PROJECTION_PASSWORD: ${GDA_RDF_PROJECTION_PASSWORD:-}
      GDA_RDF_PROJECTION_TIMEOUT_SECONDS: ${GDA_RDF_PROJECTION_TIMEOUT_SECONDS:-120}
      GDA_OBJECT_PROJECTION_TARGETS_JSON: ${GDA_OBJECT_PROJECTION_TARGETS_JSON:-}
      GDA_OBJECT_PROJECTION_ACCESS_KEY_ID: ${GDA_OBJECT_PROJECTION_ACCESS_KEY_ID:-}
      GDA_OBJECT_PROJECTION_SECRET_ACCESS_KEY: ${GDA_OBJECT_PROJECTION_SECRET_ACCESS_KEY:-}
      GDA_OBJECT_PROJECTION_SESSION_TOKEN: ${GDA_OBJECT_PROJECTION_SESSION_TOKEN:-}
      GDA_OBJECT_PROJECTION_TIMEOUT_SECONDS: ${GDA_OBJECT_PROJECTION_TIMEOUT_SECONDS:-120}
      GDA_LAKEHOUSE_PROJECTION_TARGETS_JSON: ${GDA_LAKEHOUSE_PROJECTION_TARGETS_JSON:-}
      GDA_LAKEHOUSE_PROJECTION_ACCESS_KEY_ID: ${GDA_LAKEHOUSE_PROJECTION_ACCESS_KEY_ID:-}
      GDA_LAKEHOUSE_PROJECTION_SECRET_ACCESS_KEY: ${GDA_LAKEHOUSE_PROJECTION_SECRET_ACCESS_KEY:-}
      GDA_LAKEHOUSE_PROJECTION_SESSION_TOKEN: ${GDA_LAKEHOUSE_PROJECTION_SESSION_TOKEN:-}
      GDA_LAKEHOUSE_PROJECTION_SPARK_IMAGE: ${GDA_LAKEHOUSE_PROJECTION_SPARK_IMAGE:-gisdataagent/mmfe-spark-runtime:local}
      GDA_LAKEHOUSE_PROJECTION_DOCKER_NETWORK: ${GDA_LAKEHOUSE_PROJECTION_DOCKER_NETWORK:-gisdataagent_agent-net}
      GDA_LAKEHOUSE_PROJECTION_REPOSITORY_ROOT: /app
      GDA_LAKEHOUSE_PROJECTION_JAVA_HOME: ${GDA_LAKEHOUSE_PROJECTION_JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-arm64}
      GDA_LAKEHOUSE_PROJECTION_TIMEOUT_SECONDS: ${GDA_LAKEHOUSE_PROJECTION_TIMEOUT_SECONDS:-600}
    volumes:
      - uploads:/app/data_agent/uploads
    networks:
      - agent-net

  # ---------------------------------------------------------------------------
  # ArcGIS ingestion staging-volume ownership initialization
  # ---------------------------------------------------------------------------
  ingestion-lake-init:
    image: busybox:1.36
    restart: "no"
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -ec
      - |
        mkdir -p /lake/raw
        chown 999:999 /lake /lake/raw
        chmod 0750 /lake /lake/raw
    volumes:
      - ingestion-lake:/lake

  # ---------------------------------------------------------------------------
  # ArcGIS ingestion scheduler and worker
  # ---------------------------------------------------------------------------
  ingestion-worker:
    build: .
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from pathlib import Path; assert b'data_agent.data_ingestion' in Path('/proc/1/cmdline').read_bytes()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
      ingestion-lake-init:
        condition: service_completed_successfully
    command: ["python", "-m", "data_agent.data_ingestion"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-150}
      POSTGRES_CONNECTION_RESERVE: ${POSTGRES_CONNECTION_RESERVE:-20}
      DB_POOL_SIZE: ${GDA_WORKER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${GDA_WORKER_DB_MAX_OVERFLOW:-0}
      ASYNC_POOL_MIN: "0"
      ASYNC_POOL_MAX: "1"
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-replace_with_a_real_secret}
      CLOUD_STORAGE_PROVIDER: ${CLOUD_STORAGE_PROVIDER:-aws}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minio_admin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-local_dev_minio_secret}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-gis-agent-uploads}
      AWS_REGION: ${AWS_REGION:-us-east-1}
