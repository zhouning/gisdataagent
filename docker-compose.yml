  # ---------------------------------------------------------------------------
  # Governed DuckDB Blueprint provider worker
  # ---------------------------------------------------------------------------
  # This process is deliberately separate from the API.  It receives a
  # tenant-scoped outbox command, reads admitted object versions and publishes
  # immutable output evidence.  The optional profile keeps existing lightweight
  # Compose deployments unchanged; enable it after the bucket-init job has
  # provisioned the scoped identity and Object Lock bucket.
  duckdb-blueprint-worker:
    build: .
    restart: unless-stopped
    profiles:
      - blueprint
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      minio-bucket-init:
        condition: service_completed_successfully
      blueprint-worker-volume-init:
        condition: service_completed_successfully
    command: ["python", "-m", "data_agent.duckdb_blueprint_command_worker", "run"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-150}
      POSTGRES_CONNECTION_RESERVE: ${POSTGRES_CONNECTION_RESERVE:-20}
      DB_POOL_SIZE: ${GDA_WORKER_DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${GDA_WORKER_DB_MAX_OVERFLOW:-0}
      ASYNC_POOL_MIN: "0"
      ASYNC_POOL_MAX: "1"
      GDA_BLUEPRINT_DUCKDB_TENANT_ID: ${GDA_BLUEPRINT_DUCKDB_TENANT_ID:-local-dev}
      GDA_BLUEPRINT_DUCKDB_WORKER_ID: ${GDA_BLUEPRINT_DUCKDB_WORKER_ID:-worker:blueprint-duckdb:compose}
      GDA_BLUEPRINT_DUCKDB_OUTPUT_ROOT: /var/lib/gda/blueprint-workspace
      GDA_BLUEPRINT_DUCKDB_RESULT_BACKEND: s3
      GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_BUCKET: ${GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_BUCKET:-gis-agent-blueprint-results}
      GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_PREFIX: ${GDA_BLUEPRINT_DUCKDB_OUTPUT_S3_PREFIX:-blueprint-duckdb-results/v1}
      GDA_BLUEPRINT_DUCKDB_INPUT_S3_PREFIXES: ${GDA_BLUEPRINT_DUCKDB_INPUT_S3_PREFIXES:-s3://${MMFE_LAKEHOUSE_BUCKET:-gis-agent-lakehouse}/products,s3://${AWS_S3_BUCKET:-gis-agent-uploads}/admitted}
      GDA_BLUEPRINT_DUCKDB_BATCH_SIZE: ${GDA_BLUEPRINT_DUCKDB_BATCH_SIZE:-1}
      GDA_BLUEPRINT_DUCKDB_LEASE_SECONDS: ${GDA_BLUEPRINT_DUCKDB_LEASE_SECONDS:-900}
      GDA_BLUEPRINT_DUCKDB_TIMEOUT_CEILING_SECONDS: ${GDA_BLUEPRINT_DUCKDB_TIMEOUT_CEILING_SECONDS:-600}
      GDA_BLUEPRINT_DUCKDB_IO_BUDGET_SECONDS: ${GDA_BLUEPRINT_DUCKDB_IO_BUDGET_SECONDS:-240}
      GDA_BLUEPRINT_DUCKDB_S3_CONNECT_TIMEOUT_SECONDS: ${GDA_BLUEPRINT_DUCKDB_S3_CONNECT_TIMEOUT_SECONDS:-5}
      GDA_BLUEPRINT_DUCKDB_S3_READ_TIMEOUT_SECONDS: ${GDA_BLUEPRINT_DUCKDB_S3_READ_TIMEOUT_SECONDS:-60}
      GDA_BLUEPRINT_DUCKDB_RETRY_SECONDS: ${GDA_BLUEPRINT_DUCKDB_RETRY_SECONDS:-30}
      GDA_BLUEPRINT_DUCKDB_POLL_SECONDS: ${GDA_BLUEPRINT_DUCKDB_POLL_SECONDS:-5}
      GDA_BLUEPRINT_DUCKDB_STATUS_FILE: /var/run/gda-status/worker.json
      GDA_BLUEPRINT_DUCKDB_HEALTH_MAX_AGE_SECONDS: ${GDA_BLUEPRINT_DUCKDB_HEALTH_MAX_AGE_SECONDS:-1200}
      GDA_BLUEPRINT_DUCKDB_SPATIAL_EXTENSION_PATH: /app/duckdb-extensions/spatial.duckdb_extension
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://minio:9000}
      AWS_ACCESS_KEY_ID: ${GDA_BLUEPRINT_DUCKDB_ACCESS_KEY_ID:-gda_blueprint_worker}
      AWS_SECRET_ACCESS_KEY: ${GDA_BLUEPRINT_DUCKDB_SECRET_ACCESS_KEY:-local_dev_blueprint_worker_secret}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CLOUD_STORAGE_PROVIDER: aws
      PYTHONDONTWRITEBYTECODE: "1"
      GDA_SKIP_RUNTIME_ENV_FILE: "1"
      HOME: /tmp
      TMPDIR: /tmp
    volumes:
      - blueprint-worker-workspace:/var/lib/gda/blueprint-workspace
      - blueprint-worker-status:/var/run/gda-status
    healthcheck:
      test:
        - CMD
        - python
        - -m
        - data_agent.duckdb_blueprint_command_worker
        - health
        - --status-file
        - /var/run/gda-status/worker.json
        - --max-age-seconds
        - "1200"
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - agent-net

  # Named volumes are created by Docker as root.  The runtime image's agent
  # user is UID/GID 999; initialize only the private worker workspace/status
  # volumes and keep the worker itself non-root.
  blueprint-worker-volume-init:
    image: busybox:1.36
    restart: "no"
    profiles:
      - blueprint
    user: "0:0"
    network_mode: none
    command:
      - sh
      - -ec
      - |
        mkdir -p /workspace /status
        chown 999:999 /workspace /status
        chmod 0700 /workspace /status
    volumes:
      - blueprint-worker-workspace:/workspace
      - blueprint-worker-status:/status

