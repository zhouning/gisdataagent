# =============================================================================
# GIS Data Agent — Gemma4 hackathon demo (pure Docker / Docker Desktop)
# Usage:
#   docker compose -f docker-compose.gemma4-demo.yml up -d --build
# =============================================================================

services:
  db:
    image: gis-postgis-pgvector:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: gis_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - timezone=Asia/Shanghai
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-150}
      - -c
      - superuser_reserved_connections=${POSTGRES_SUPERUSER_RESERVED_CONNECTIONS:-5}
    ports:
      - "5433:5432"
    volumes:
      - gemma4_demo_pgdata:/var/lib/postgresql/data
      - ./docker-db-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gis_agent"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - gemma4-demo-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - gemma4_demo_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - gemma4-demo-net

  migrate:
    image: gis-data-agent:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MIGRATION_RUNTIME_DB_ROLE: agent_user
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        python -m data_agent.migration_runner migrate
        bash /app/scripts/grant-platform-gateway-role.sh
    networks:
      - gemma4-demo-net

  app:
    image: gis-data-agent:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      TZ: Asia/Shanghai

      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: change_me_strong_password
      PGTZ: Asia/Shanghai
      DATABASE_URL: postgresql://agent_user:change_me_strong_password@db:5432/gis_agent
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-150}
      POSTGRES_CONNECTION_RESERVE: ${POSTGRES_CONNECTION_RESERVE:-20}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      ASYNC_POOL_MIN: ${ASYNC_POOL_MIN:-2}
      ASYNC_POOL_MAX: ${ASYNC_POOL_MAX:-10}

      REDIS_URL: redis://redis:6379/0
      GDA_GIS_MVT_CACHE_REDIS_URL: ${GDA_GIS_MVT_CACHE_REDIS_URL:-redis://redis:6379/1}
      GDA_GIS_MVT_CACHE_KEY_PREFIX: ${GDA_GIS_MVT_CACHE_KEY_PREFIX:-gda:mvt:response:v1}
      GDA_GIS_MVT_CACHE_MAX_OBJECT_BYTES: ${GDA_GIS_MVT_CACHE_MAX_OBJECT_BYTES:-1048576}
      GDA_GIS_MVT_CACHE_TIMEOUT_SECONDS: ${GDA_GIS_MVT_CACHE_TIMEOUT_SECONDS:-0.5}

      GOOGLE_GENAI_USE_VERTEXAI: "FALSE"
      GOOGLE_CLOUD_PROJECT: local-dev-placeholder
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_API_KEY: AIzaSy-LOCAL-PLACEHOLDER-not-used-with-ollama-router
      GOOGLE_APPLICATION_CREDENTIALS: ""

      ROUTER_MODEL: gemma4-26b-ollama
      MODEL_FAST: gemma4-26b-ollama
      MODEL_STANDARD: gemma4-26b-ollama
      MODEL_PREMIUM: gemma4-26b-ollama
      MODEL_CONFIG_FORCE_ENV: "true"
      NL2SQL_AGENT_MODEL: gemma4-26b-ollama
      NL2SQL_LLM_SCHEMA_MAPPER_MODEL: gemma4-26b-ollama
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text-v2-moe}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}

      PAPER9_FARMLAND_MPC_REPO: /app/paper9-demo
      PAPER9_FARMLAND_MPC_DEFAULT_PREPARED_DIR: /app/bishan-runs/prepared
      PAPER9_FARMLAND_MPC_DEFAULT_ENSEMBLE_DIR: /app/bishan-runs/prepared/ensemble_seed0
      PROJ_DATA: /app/.venv/lib/python3.12/site-packages/pyproj/proj_dir/share/proj
      PROJ_LIB: /app/.venv/lib/python3.12/site-packages/pyproj/proj_dir/share/proj

      CHAINLIT_AUTH_SECRET: local_dev_chainlit_secret_change_me_to_64_chars_minimum_xx
      DYNAMIC_PLANNER: "true"
    volumes:
      - gemma4_demo_uploads:/app/data_agent/uploads
      - ${PAPER9_HOST_REPO:-/Users/zhouning/paper9-mnr-offline-package}:/app/paper9-demo:ro
      - ${PAPER9_BISHAN_RUNS_HOST:-/Users/zhouning/farmland_mpc_runs/bishan}:/app/bishan-runs:ro
      - ${PAPER9_DONGXING_RUNS_HOST:-/Users/zhouning/arcgis-farmland-mpc/runs/dongxing}:/app/dongxing-runs:ro
    networks:
      - gemma4-demo-net

  # Optional exact generic-SLO activation -> GIS ServiceSLO binding reconciler.
  gis-service-slo-reconciliation-worker:
    image: gis-data-agent:dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles:
      - gis-slo
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "data_agent.gis_service_slo_reconciliation_worker"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: gis_agent
      POSTGRES_USER: agent_user
      POSTGRES_PASSWORD: change_me_strong_password
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-150}
      POSTGRES_CONNECTION_RESERVE: ${POSTGRES_CONNECTION_RESERVE:-20}
      DB_POOL_SIZE: ${GDA_WORKER_DB_POOL_SIZE:-2}
      DB_MAX_OVERFLOW: "0"
      ASYNC_POOL_MIN: "0"
      ASYNC_POOL_MAX: "1"
      GDA_GIS_SLO_RECONCILIATION_TENANT_ID: ${GDA_GIS_SLO_RECONCILIATION_TENANT_ID:-}
      GDA_GIS_SLO_RECONCILIATION_WORKER_ID: ${GDA_GIS_SLO_RECONCILIATION_WORKER_ID:-worker:gis-slo-reconciliation:gemma4-demo}
      GDA_GIS_SLO_RECONCILIATION_BATCH_SIZE: ${GDA_GIS_SLO_RECONCILIATION_BATCH_SIZE:-10}
      GDA_GIS_SLO_RECONCILIATION_LEASE_SECONDS: ${GDA_GIS_SLO_RECONCILIATION_LEASE_SECONDS:-60}
      GDA_GIS_SLO_RECONCILIATION_RETRY_SECONDS: ${GDA_GIS_SLO_RECONCILIATION_RETRY_SECONDS:-30}
      GDA_GIS_SLO_RECONCILIATION_POLL_SECONDS: ${GDA_GIS_SLO_RECONCILIATION_POLL_SECONDS:-5}
    networks:
      - gemma4-demo-net

volumes:
  gemma4_demo_pgdata:
  gemma4_demo_redis:
  gemma4_demo_uploads:

networks:
  gemma4-demo-net:
    driver: bridge
